/* =====================================================================
   12-attendance.js — daily register, punches, manual entry, monthly
   grid, employee calendar, corrections & approval workflow, import
   ===================================================================== */
const Att = {
  needsApproval(emp) { return S().attendance.requireApprovalForManual && !Auth.can('attendance', 'approve') && emp.id !== Auth.user.empId; },
  addLog(rec, action, details) { rec.log = rec.log || []; rec.log.push({ ts: new Date().toISOString(), by: Auth.user?.username || 'system', action, details }); },
  /* save a record (create or update) with audit + approval rules */
  save(emp, data, { action = 'Manual entry', source = 'manual', silent = false } = {}) {
    const ex = Store.att(emp.id, data.date);
    const before = ex ? `${ex.in || '-'}→${ex.out || '-'} (${ex.status})` : 'no record';
    const rec = ex || { id: uid('att'), empId: emp.id, date: data.date, breaks: [], log: [] };
    Object.assign(rec, data, { source, updatedAt: new Date().toISOString(), updatedBy: Auth.user.username });
    rec.approval = this.needsApproval(emp) ? 'pending' : 'approved';
    if (rec.approval === 'pending') rec.enteredBy = Auth.user.username;
    Calc.compute(rec, emp);
    this.addLog(rec, action, `${before} ⇒ ${rec.in || '-'}→${rec.out || '-'} (${rec.status})${data.note ? ' · ' + data.note : ''}`);
    Store.putAtt(rec);
    Store.log(action, 'attendance', `${emp.code} ${emp.name} ${fmtDate(rec.date)}: ${before} ⇒ ${rec.in || '-'}→${rec.out || '-'} ${STATUS_LABEL[rec.status]}${rec.approval === 'pending' ? ' [pending approval]' : ''}`);
    if (!silent) Store.save();
    return rec;
  },
  /* live punch for "now" (self-service or by HR at the gate) */
  punch(empId, kind) {
    const emp = Store.emp(empId); if (!emp) return;
    const self = emp.id === Auth.user.empId;
    if (!self && !Auth.guard('attendance', 'create')) return;
    if (self && !S().attendance.selfService) return UI.toast('Self check-in is disabled by the administrator.', 'warn');
    const td = today(), now = nowTime();
    let rec = Store.att(emp.id, td);
    // overnight shift: an open record from yesterday is closed by a check-out after midnight
    if (kind !== 'in' && (!rec || !rec.in)) {
      const y = D.add(td, -1), yr = Store.att(emp.id, y);
      if (yr && yr.in && !yr.out) rec = yr;
    }
    const fin = (r, msg) => { Calc.compute(r, emp); if (!self) { r.approval = this.needsApproval(emp) ? 'pending' : (r.approval || 'approved'); } Store.putAtt(r); Store.log('Punch: ' + kind, 'attendance', `${emp.code} ${emp.name} ${fmtDate(r.date)} ${now}${self ? ' (self-service)' : ' (by ' + Auth.user.username + ')'}`); Store.save(); UI.toast(msg, 'success'); App.refresh(); };
    if (kind === 'in') {
      if (rec && rec.in) return UI.toast(`${emp.name} already checked in at ${fmtTime(rec.in)}.`, 'warn');
      if (!Calc.employedOn(emp, td)) return UI.toast('Employee is not active on this date.', 'warn');
      const r = rec || { id: uid('att'), empId: emp.id, date: td, breaks: [], log: [] };
      Object.assign(r, { mark: 'auto', in: now, out: null, source: self ? 'self' : 'web', approval: 'approved' });
      this.addLog(r, 'Check-in', now);
      return fin(r, `${self ? 'You' : emp.name} checked in at ${fmtTime(now)}.`);
    }
    if (!rec || !rec.in) return UI.toast('No open check-in found.', 'warn');
    if (rec.out) return UI.toast(`Already checked out at ${fmtTime(rec.out)}.`, 'warn');
    if (kind === 'out') {
      if (Calc.onBreak(rec)) rec.breaks[rec.breaks.length - 1].e = now;
      rec.out = now; this.addLog(rec, 'Check-out', now);
      return fin(rec, `${self ? 'You' : emp.name} checked out at ${fmtTime(now)}.`);
    }
    if (kind === 'breakStart') { if (Calc.onBreak(rec)) return UI.toast('Already on break.', 'warn'); rec.breaks = rec.breaks || []; rec.breaks.push({ s: now, e: null }); this.addLog(rec, 'Break start', now); return fin(rec, 'Break started.'); }
    if (kind === 'breakEnd') { if (!Calc.onBreak(rec)) return UI.toast('Not on break.', 'warn'); rec.breaks[rec.breaks.length - 1].e = now; this.addLog(rec, 'Break end', now); return fin(rec, 'Break ended.'); }
  },

  /* ---------------- manual entry / edit modal ---------------- */
  editModal(empId, date) {
    const emp = Store.emp(empId); if (!emp) return;
    if (!Auth.canSeeEmp(emp) || !Auth.guard('attendance', Store.att(empId, date) ? 'edit' : 'create')) return;
    const ex = Store.att(empId, date);
    const sh = Calc.shiftFor(emp, date);
    const pay = Store.db.payrollRuns.find(r => r.month === date.slice(0, 7) && r.status === 'finalized');
    const br = (ex?.breaks || []).filter(b => b.s);
    const m = UI.modal({
      title: `${ex ? 'Edit' : 'Add'} attendance — ${emp.name}`, size: 'lg', icon: 'clock',
      body: `<div class="row mb-3">${UI.person(emp)}<span class="spacer"></span>${UI.badge(sh.name + ` (${fmtTime(sh.start)}–${fmtTime(sh.end)})`, 'navy')}${Calc.holiday(date) ? UI.badge('Holiday: ' + Calc.holiday(date).name, 'violet') : Calc.isWeeklyOff(emp, date) ? UI.badge('Weekly off', 'gray') : ''}</div>
        ${pay ? `<div class="alert warn mb-3">${icon('lock')}<div>Payroll for ${D.monthLabel(date.slice(0, 7))} is already finalized. Changes will not affect issued salary slips unless payroll is reopened.</div></div>` : ''}
        ${this.needsApproval(emp) ? `<div class="alert info mb-3">${icon('info')}<div>Your entry will be saved as <b>pending approval</b> by a Department Manager / HR Manager.</div></div>` : ''}
        <form class="form-grid c4" id="att-f">
          ${F.input('date', 'Date', { type: 'date', value: date, required: true, attrs: `max="${today()}"` })}
          ${F.select('mark', 'Status mode', [['auto', 'Auto (calculate from times)'], ['P', 'Present (manual)'], ['HD', 'Half Day (manual)'], ['A', 'Absent']], { value: ex?.mark || 'auto' })}
          ${F.input('in', 'Check-in', { type: 'time', value: ex?.in || sh.start })}
          ${F.input('out', 'Check-out', { type: 'time', value: ex ? (ex.out || '') : sh.end, hint: 'Leave empty if still at work.' })}
          ${F.input('b1s', 'Break start', { type: 'time', value: br[0]?.s || '' })}
          ${F.input('b1e', 'Break end', { type: 'time', value: br[0]?.e || '' })}
          ${F.input('b2s', 'Break 2 start', { type: 'time', value: br[1]?.s || '' })}
          ${F.input('b2e', 'Break 2 end', { type: 'time', value: br[1]?.e || '' })}
          ${F.textarea('note', 'Reason / remarks', { full: true, required: true, value: ex?.note || '', placeholder: 'e.g. Biometric device offline — verified with supervisor', err: 'Please give a reason for the manual entry.' })}
        </form>
        <div class="card mt-2" style="background:var(--surface-2)"><div class="card-b" id="att-prev"></div></div>
        ${ex?.log?.length ? `<details class="mt-3"><summary class="small strong" style="cursor:pointer">Change history (${ex.log.length})</summary><div class="timeline mt-2">${ex.log.slice().reverse().map(l => `<div class="tl-item"><b>${esc(l.action)}</b> <span class="muted small">by ${esc(l.by)}</span><small>${esc(new Date(l.ts).toLocaleString('en-GB', { timeZone: tz() }))} · ${esc(l.details)}</small></div>`).join('')}</div></details>` : ''}`,
      footer: [
        ex && Auth.can('attendance', 'delete') ? { label: 'Delete record', cls: 'btn-ghost', icon: 'trash', action: async a => { if (await UI.confirm({ title: 'Delete attendance record?', message: `Remove ${emp.name}'s record for ${fmtDate(date)}? The day will show as absent / not marked.`, ok: 'Delete', danger: true })) { Store.delAtt(empId, date); Store.log('Delete attendance', 'attendance', `${emp.code} ${fmtDate(date)}`); Store.save(); a.close(); UI.toast('Record deleted.', 'success'); App.refresh(); } } } : null,
        { label: 'Cancel', action: 'close' },
        { label: 'Save attendance', cls: 'btn-primary', icon: 'check', action: a => {
          const d = this.readForm(a.el);
          const rules = { date: v => !D.valid(v) ? 'Valid date required.' : v > today() ? 'Future dates cannot be marked.' : !Calc.employedOn(emp, v) ? 'Employee was not employed on this date.' : (v !== date && Store.att(empId, v)) ? 'A record already exists for that date — edit it instead.' : null,
            in: v => d.mark !== 'A' && d.mark === 'auto' && !v ? 'Check-in time is required.' : null,
            note: v => !v ? 'Please give a reason for the manual entry.' : null,
            b1e: () => d.breaks.some(b => !b.e && d.out) ? 'Break end is required.' : null };
          if (!F.validate(a.el, d, rules)) return;
          if (Calc.leaveOn(emp, d.date) && !Calc.leaveOn(emp, d.date).half) UI.toast('Note: this employee has approved leave on this date.', 'warn', 6000);
          if (d.date !== date && ex) Store.delAtt(empId, date);
          this.save(emp, { date: d.date, mark: d.mark, in: d.mark === 'A' ? null : (d.in || null), out: d.mark === 'A' ? null : (d.out || null), breaks: d.mark === 'A' ? [] : d.breaks, note: d.note }, { action: ex ? 'Edit attendance' : 'Manual attendance' });
          a.close(); UI.toast('Attendance saved.', 'success'); App.refresh();
        } }
      ].filter(Boolean)
    });
    const prev = () => {
      const d = this.readForm(m.el);
      const tmp = Calc.compute({ empId, date: D.valid(d.date) ? d.date : date, mark: d.mark, in: d.mark === 'A' ? null : d.in || null, out: d.mark === 'A' ? null : d.out || null, breaks: d.breaks }, emp);
      $('#att-prev', m.el).innerHTML = `<div class="row" style="gap:22px">${[['Status', UI.statusBadge(tmp.status)], ['Worked', fmtDur(tmp.workMins, '0m')], ['Break', fmtDur(tmp.breakMins, '0m')], ['Late', tmp.lateMins ? `<span style="color:var(--danger)">${fmtDur(tmp.lateMins)}</span>` : '—'], ['Early leave', tmp.earlyMins ? fmtDur(tmp.earlyMins) : '—'], ['Overtime', tmp.otMins ? `<b style="color:var(--violet)">${fmtDur(tmp.otMins)}</b>` : '—']].map(([k, v]) => `<div><div class="tiny muted">${k}</div><div class="strong">${v}</div></div>`).join('')}
        ${(tmp.flags || []).includes('missingOut') ? `<span class="badge b-amber">No check-out</span>` : ''}${(tmp.flags || []).includes('offDay') ? `<span class="badge b-violet">Off-day work</span>` : ''}</div>`;
      $$('[name=in],[name=out],[name^=b]', m.el).forEach(i => i.disabled = d.mark === 'A');
    };
    $$('input,select', m.el).forEach(i => i.addEventListener('input', prev)); prev();
  },
  readForm(root) {
    const d = F.read(root);
    d.breaks = [[d.b1s, d.b1e], [d.b2s, d.b2e]].filter(([s]) => s).map(([s, e]) => ({ s, e: e || null }));
    return d;
  },

  /* ---------------- correction request ---------------- */
  correctionModal(empId, date) {
    const emps = Auth.isSelf() ? [Auth.myEmp()].filter(Boolean) : Auth.scopedEmps();
    if (!emps.length) return UI.toast('No employee profile is linked to your account.', 'warn');
    const ex = empId && date ? Store.att(empId, date) : null;
    UI.modal({
      title: 'Attendance correction request', icon: 'edit',
      body: `<p class="muted small mt-0">Corrections are reviewed by an approver. Once approved, the attendance record is updated automatically and logged in the audit trail.</p>
        <form class="form-grid">${F.select('empId', 'Employee', UI.empOptions(empId || emps[0].id, undefined, emps), { required: true, full: true })}
        ${F.input('date', 'Date', { type: 'date', required: true, value: date || D.add(today(), -1), attrs: `max="${today()}"` })}
        ${F.select('reqMark', 'Requested status', [['auto', 'Present — calculate from times'], ['HD', 'Half Day'], ['P', 'Present (full day)']], { value: 'auto' })}
        ${F.input('reqIn', 'Correct check-in', { type: 'time', value: ex?.in || '' })}${F.input('reqOut', 'Correct check-out', { type: 'time', value: ex?.out || '' })}
        ${F.textarea('reason', 'Reason', { full: true, required: true, placeholder: 'e.g. Forgot to punch out; left at 05:30 PM after shift' })}</form>`,
      footer: [{ label: 'Cancel', action: 'close' }, { label: 'Submit request', cls: 'btn-primary', icon: 'send', action: a => {
        const d = F.read(a.el); const emp = Store.emp(d.empId);
        if (!F.validate(a.el, d, { date: v => !D.valid(v) ? 'Valid date required.' : v > today() ? 'Cannot be a future date.' : !Calc.employedOn(emp, v) ? 'Not employed on this date.' : Store.db.corrections.some(c => c.empId === d.empId && c.date === v && c.status === 'pending') ? 'A pending request already exists for this date.' : null, reqIn: v => d.reqMark === 'auto' && !v ? 'Check-in time required.' : null, reason: F.req('Reason') })) return;
        const c = { id: uid('cor'), empId: d.empId, date: d.date, reqIn: d.reqIn || null, reqOut: d.reqOut || null, reqMark: d.reqMark, reason: d.reason, status: 'pending', requestedBy: Auth.user.username, requestedAt: new Date().toISOString() };
        Store.db.corrections.unshift(c);
        Store.notify({ to: 'perm:attendance.approve', type: 'Attendance', tone: 'amber', icon: 'edit', title: `Correction request — ${emp.name}`, text: `${fmtDate(d.date)}: ${d.reason.slice(0, 80)}`, link: '#/attendance/approvals' });
        Store.log('Correction requested', 'attendance', `${emp.code} ${fmtDate(d.date)}`); Store.save();
        a.close(); UI.toast('Correction request submitted for approval.', 'success'); App.refresh();
      } }]
    });
  },
  async decideCorrection(id, approve) {
    const c = Store.db.corrections.find(x => x.id === id); const emp = Store.emp(c.empId);
    if (!Auth.canApproveFor('attendance', emp)) return UI.toast('You cannot approve requests for this employee.', 'warn');
    const remarks = await UI.ask({ title: `${approve ? 'Approve' : 'Reject'} correction`, label: 'Remarks', required: !approve, ok: approve ? 'Approve' : 'Reject' });
    if (remarks === null) return;
    c.status = approve ? 'approved' : 'rejected'; c.actionBy = Auth.user.username; c.actionAt = new Date().toISOString(); c.remarks = remarks;
    if (approve) {
      const ex = Store.att(c.empId, c.date);
      const rec = ex || { id: uid('att'), empId: c.empId, date: c.date, breaks: [], log: [] };
      Object.assign(rec, { mark: c.reqMark || 'auto', in: c.reqIn || rec.in, out: c.reqOut || rec.out, source: 'correction', approval: 'approved', note: 'Correction: ' + c.reason });
      Calc.compute(rec, emp); this.addLog(rec, 'Correction approved', `${c.reqIn || '-'}→${c.reqOut || '-'} by ${Auth.user.username}`); Store.putAtt(rec);
    }
    Store.notify({ to: 'emp:' + c.empId, type: 'Attendance', tone: approve ? 'green' : 'red', icon: approve ? 'checkCircle' : 'xCircle', title: `Attendance correction ${approve ? 'approved' : 'rejected'}`, text: `${fmtDate(c.date)}${remarks ? ' — ' + remarks : ''}`, link: '#/attendance' });
    Store.log(`Correction ${c.status}`, 'attendance', `${emp.code} ${fmtDate(c.date)} ${remarks}`); Store.save();
    UI.toast(`Request ${c.status}.`, 'success'); App.refresh();
  },
  approveRecords(ids, approve = true) {
    let n = 0;
    ids.forEach(id => { const r = Store.db.attendance.find(x => x.id === id); if (!r || r.approval !== 'pending') return; const e = Store.emp(r.empId); if (!Auth.canApproveFor('attendance', e)) return;
      if (approve) { r.approval = 'approved'; this.addLog(r, 'Approved', Auth.user.username); } else { Store.delAtt(r.empId, r.date); }
      Store.log(approve ? 'Approve manual attendance' : 'Reject manual attendance', 'attendance', `${e.code} ${fmtDate(r.date)}`); n++; });
    Store.save(); UI.toast(`${n} record(s) ${approve ? 'approved' : 'rejected and removed'}.`, 'success'); App.refresh();
  },
  bulk(empIds, date, kind) {
    if (!Auth.guard('attendance', 'create')) return;
    let n = 0, skip = 0;
    empIds.forEach(id => {
      const emp = Store.emp(id); if (!emp || !Calc.employedOn(emp, date)) { skip++; return; }
      const sh = Calc.shiftFor(emp, date); const ex = Store.att(id, date);
      if (kind === 'out') { if (ex && ex.in && !ex.out) { ex.out = date === today() ? nowTime() : sh.end; Calc.compute(ex, emp); this.addLog(ex, 'Bulk check-out', ex.out); n++; } else skip++; return; }
      if (kind === 'delete') { if (ex) { Store.delAtt(id, date); n++; } return; }
      if (ex && ex.in && kind === 'P') { skip++; return; }
      const data = { date, mark: kind === 'P' ? 'auto' : kind, in: kind === 'A' ? null : sh.start, out: kind === 'A' ? null : (kind === 'HD' ? fromMin((toMin(sh.start) + Math.round(Calc.shiftMins(sh).sched / 2) + (sh.breakPaid ? 0 : 0)) % 1440) : (date === today() && toMin(nowTime()) < toMin(sh.end) && Calc.shiftMins(sh).en <= 1440 ? null : sh.end)), breaks: [], note: `Bulk ${STATUS_LABEL[kind] || kind}` };
      this.save(emp, data, { action: 'Bulk attendance', source: 'bulk', silent: true }); n++;
    });
    Store.log('Bulk attendance', 'attendance', `${kind} for ${n} employee(s) on ${fmtDate(date)}`); Store.save();
    UI.toast(`${n} record(s) updated${skip ? `, ${skip} skipped` : ''}.`, 'success'); App.refresh();
  },

  /* ---------------- device / CSV import ---------------- */
  importModal() {
    if (!Auth.guard('attendance', 'create')) return;
    const m = UI.modal({
      title: 'Import attendance (biometric / CSV / Excel)', size: 'lg', icon: 'upload',
      body: `<div class="alert info mb-3">${icon('info')}<div class="alert-body">This application <b>does not connect directly to biometric devices</b> (that requires a device SDK and a server). Export punches from your device software as CSV/Excel and import them here.<br>
        Accepted columns (header names, any order): <b>EmployeeCode, Date, CheckIn, CheckOut</b> — or raw punch logs <b>EmployeeCode, Date, Time</b> (first punch = in, last = out). Dates: YYYY-MM-DD or DD-MM-YYYY.</div></div>
        <div class="row mb-3"><button class="btn" id="imp-pick">${icon('upload')}Choose file…</button><button class="btn btn-ghost" id="imp-tpl">${icon('download')}Download template</button><label class="check"><input type="checkbox" id="imp-ow"> Overwrite existing records</label></div>
        <div id="imp-prev">${UI.empty('No file selected', 'Choose a .csv or .xlsx file to preview it before importing.', 'file')}</div>`,
      footer: [{ label: 'Cancel', action: 'close' }, { label: 'Import valid rows', cls: 'btn-primary', id: 'imp-go', icon: 'check', action: a => {
        if (!this._imp || !this._imp.valid.length) return UI.toast('Nothing valid to import.', 'warn');
        const ow = $('#imp-ow', a.el).checked; let n = 0, sk = 0;
        this._imp.valid.forEach(r => { const ex = Store.att(r.emp.id, r.date); if (ex && !ow) { sk++; return; } this.save(r.emp, { date: r.date, mark: 'auto', in: r.in, out: r.out || null, breaks: [], note: 'Imported from ' + this._imp.file }, { action: 'Import attendance', source: 'device-import', silent: true }); n++; });
        Store.log('Import attendance', 'attendance', `${n} records from ${this._imp.file}${sk ? `, ${sk} skipped (existing)` : ''}`); Store.save();
        a.close(); UI.toast(`${n} attendance record(s) imported${sk ? `, ${sk} existing skipped` : ''}.`, 'success'); App.refresh();
      } }]
    });
    $('#imp-tpl', m.el).onclick = () => UI.downloadBlob(new Blob([CSV.build(['EmployeeCode', 'Date', 'CheckIn', 'CheckOut'], [['IP-0001', today(), '09:02', '17:35'], ['IP-0002', today(), '08:55', '']])], { type: 'text/csv' }), 'attendance_import_template.csv');
    $('#imp-pick', m.el).onclick = async () => {
      const f = await UI.pickFile('.csv,.xlsx'); if (!f) return;
      let rows; try { rows = await readTable(f); } catch (e) { return UI.toast(e.message, 'error'); }
      const byCode = new Map(Store.db.employees.map(e => [String(e.code).toLowerCase(), e]));
      const groups = new Map(); const errors = [];
      rows.forEach(r => {
        const code = String(r.employeecode || r.code || r.empcode || r.employeeid || r.id || '').trim().toLowerCase();
        const emp = byCode.get(code); const date = excelDate(r.date);
        if (!emp) return errors.push([r._row, code || '(blank)', 'Unknown employee code']);
        if (!date) return errors.push([r._row, code, 'Invalid date']);
        if (!Auth.canSeeEmp(emp)) return errors.push([r._row, code, 'Outside your data access']);
        if (date > today()) return errors.push([r._row, code, 'Future date']);
        const key = emp.id + '|' + date; const g = groups.get(key) || { emp, date, punches: [] };
        [r.checkin || r.in || r.timein, r.checkout || r.out || r.timeout, r.time || r.punch].forEach(v => { if (v === '' || v === undefined) return; const t = excelTime(v); if (t) g.punches.push(t); else errors.push([r._row, code, `Invalid time "${v}"`]); });
        groups.set(key, g);
      });
      const valid = [];
      groups.forEach(g => { const p = [...new Set(g.punches)].sort(); if (!p.length) return errors.push(['-', g.emp.code, `No punches on ${g.date}`]); valid.push({ emp: g.emp, date: g.date, in: p[0], out: p.length > 1 ? p[p.length - 1] : null, exists: !!Store.att(g.emp.id, g.date) }); });
      this._imp = { file: f.name, valid };
      $('#imp-prev', m.el).innerHTML = `<div class="row mb-2">${UI.badge(valid.length + ' valid day-records', 'green')} ${UI.badge(valid.filter(v => v.exists).length + ' already exist', 'amber')} ${UI.badge(errors.length + ' errors', errors.length ? 'red' : 'gray')}</div>
        <div class="tbl-wrap" style="max-height:260px"><table class="tbl compact"><thead><tr><th>Code</th><th>Employee</th><th>Date</th><th>In</th><th>Out</th><th></th></tr></thead><tbody>${valid.slice(0, 200).map(v => `<tr><td>${esc(v.emp.code)}</td><td>${esc(v.emp.name)}</td><td>${fmtDate(v.date)}</td><td>${fmtTime(v.in)}</td><td>${fmtTime(v.out)}</td><td>${v.exists ? UI.badge('exists', 'amber') : ''}</td></tr>`).join('')}</tbody></table></div>
        ${errors.length ? `<details class="mt-2"><summary class="small strong" style="cursor:pointer;color:var(--danger)">Show ${errors.length} error(s)</summary><table class="tbl compact"><thead><tr><th>Row</th><th>Code</th><th>Problem</th></tr></thead><tbody>${errors.slice(0, 300).map(e => `<tr><td>${e[0]}</td><td>${esc(e[1])}</td><td>${esc(e[2])}</td></tr>`).join('')}</tbody></table></details>` : ''}`;
    };
  },

  /* ---------------- shared renderers ---------------- */
  cellCode(x) {
    const c = x.code; if (c === 'FUT' || c === 'NE') return { t: '', cls: 'st-' + c };
    if (c === 'NM') return { t: '·', cls: 'st-NM' };
    let t = { P: 'P', HD: '½', A: 'A', L: 'L', H: 'H', WO: 'W' }[c] || c;
    if (x.rec && x.rec.lateMins > 0 && c === 'P') t = 'P*';
    if (x.code === 'L' && x.half) t = 'L½';
    return { t, cls: 'st-' + c };
  }
};

  monthly(el, ym) {
    if (!/^\d{4}-\d{2}$/.test(ym)) ym = today().slice(0, 7);

  calendarGrid(box, emp, ym) {
    const first = D.monthStart(ym), last = D.monthEnd(ym), td = today();
    const ws = S().weekStart ?? 1;
    let start = first; while (D.dow(start) !== ws) start = D.add(start, -1);
    let end = last; while (D.dow(end) !== (ws + 6) % 7) end = D.add(end, 1);
    const canEdit = !Auth.isSelf() && Auth.can('attendance', 'edit');
    box.innerHTML = `<div class="cal">${[0, 1, 2, 3, 4, 5, 6].map(i => `<div class="dow">${DOW3[(ws + i) % 7]}</div>`).join('')}${D.each(start, end).map(d => {
      const x = Calc.day(emp, d, td); const other = d.slice(0, 7) !== ym;
      const hol = Calc.holiday(d);
      return `<div class="day ${other ? 'other' : ''} ${d === td ? 'today' : ''} ${x.code === 'WO' ? 'off' : ''} ${hol ? 'hol has-ev' : ''} ${(canEdit || Auth.isSelf()) && !other && d <= td && x.code !== 'NE' ? 'clickable' : ''}" data-d="${d}">

        ${x.rec?.in ? `<div class="tiny muted mono">${fmtTime(x.rec.in)} – ${x.rec.out ? fmtTime(x.rec.out) : '…'}</div>` : ''}
        ${x.rec?.otMins ? `<div class="tiny" style="color:var(--violet)">OT ${fmtDur(x.rec.otMins)}</div>` : ''}
        ${x.code !== 'FUT' && x.code !== 'NE' ? `<div class="att-cell st-${x.code}">${esc(x.code === 'L' ? (Store.leaveType(x.leave.typeId)?.code || 'L') + (x.half ? ' ½' : '') : STATUS_LABEL[x.code])}</div>` : ''}</div>`;
    }).join('')}</div>`;
    $$('.day.clickable', box).forEach(d => d.onclick = () => Auth.isSelf() ? Att.correctionModal(emp.id, d.dataset.d) : Att.editModal(emp.id, d.dataset.d));
  },

   13-shifts.js — shifts, rotations, assignment, roster, change requests
   ===================================================================== */
const Shifts = {
  finalizedMonths() { return new Set(Store.db.payrollRuns.filter(r => r.status === 'finalized').map(r => r.month)); },
  recalcFor(pred) {
    const fin = this.finalizedMonths(); let n = 0;
    Store.db.attendance.forEach(r => { if (fin.has(r.date.slice(0, 7))) return; const e = Store.emp(r.empId); if (e && pred(r, e)) { Calc.compute(r, e); n++; } });
    return n;
  },
  shiftModal(sh) {
    if (!Auth.guard('shifts', sh ? 'edit' : 'create')) return;
    const s = sh || { code: '', name: '', type: 'fixed', start: '09:00', end: '17:00', breakMins: 30, breakPaid: false, graceMins: null, earlyGraceMins: null, otAllowed: true, weeklyOffs: null, color: '#1d4688', active: true, requiredMins: 480 };
    const wo = s.weeklyOffs || [];
    UI.modal({
      title: sh ? `Edit shift — ${sh.name}` : 'Create shift', size: 'lg', icon: 'shift',
      body: `<form class="form-grid c3">
        ${F.input('code', 'Short code', { value: s.code, required: true, attrs: 'maxlength="6"' })}${F.input('name', 'Shift name', { value: s.name, required: true })}
        ${F.select('type', 'Type', [['fixed', 'Fixed timings'], ['flexible', 'Flexible hours']], { value: s.type })}
        ${F.input('start', 'Start time', { type: 'time', value: s.start, required: true })}${F.input('end', 'End time', { type: 'time', value: s.end, required: true, hint: 'End before start = overnight shift.' })}
        ${F.input('requiredHrs', 'Required hours (flexible)', { type: 'number', value: (s.requiredMins || 480) / 60, attrs: 'min="1" max="16" step="0.25"' })}
        ${F.input('breakMins', 'Break (minutes)', { type: 'number', value: s.breakMins, attrs: 'min="0" max="240"' })}
        ${F.input('graceMins', 'Late grace (min)', { type: 'number', value: s.graceMins ?? '', hint: `Blank = company default (${S().attendance.graceMins} min)`, attrs: 'min="0" max="240"' })}
        ${F.input('earlyGraceMins', 'Early-leave grace (min)', { type: 'number', value: s.earlyGraceMins ?? '', hint: `Blank = default (${S().attendance.earlyGraceMins} min)`, attrs: 'min="0" max="240"' })}
        ${F.toggle('breakPaid', 'Break is paid (counted as work)', s.breakPaid)}${F.toggle('otAllowed', 'Overtime allowed on this shift', s.otAllowed !== false)}${F.toggle('active', 'Active', s.active !== false)}
        <div class="fld full"><label>Weekly off days for this shift <span class="muted">(leave all unchecked to use company default: ${(S().weeklyOffs || []).map(d => DOW[d]).join(', ') || 'none'})</span></label><div class="row">${DOW.map((d, i) => `<label class="check"><input type="checkbox" name="wo" value="${i}" data-multi="1" ${wo.includes(i) ? 'checked' : ''}>${d.slice(0, 3)}</label>`).join('')}</div></div>
        ${F.input('color', 'Colour', { type: 'color', value: s.color })}
        ${sh ? `<div class="fld full">${F.toggle('recalc', 'Recalculate existing attendance for this shift (months not yet finalized in payroll)', true)}</div>` : ''}
      </form><div class="alert info mt-2" id="sh-prev"></div>`,
      onMount: m => { const p = () => { const d = F.read(m.el); const t = { type: d.type, start: d.start, end: d.end, breakMins: +d.breakMins || 0, breakPaid: d.breakPaid, requiredMins: (+d.requiredHrs || 8) * 60 }; if (!V.time(d.start) || !V.time(d.end)) return; const x = Calc.shiftMins(t); $('#sh-prev', m.el).innerHTML = `${icon('info')}<div>Scheduled working time: <b>${fmtDur(x.sched)}</b>${x.en > 1440 ? ' · <b>overnight shift</b> (attendance is recorded on the start date)' : ''}.</div>`; }; $$('input,select', m.el).forEach(i => i.addEventListener('input', p)); p(); },

  assign(empIds, target, from, note) {

  async decide(id, ok) {

  }

    const setTypes = () => { const e = Store.emp($('[name=empId]', f).value || first.id); $('[name=typeId]', f).innerHTML = UI.options(this.eligibleTypes(e).map(t => [t.id, `${t.name}${t.paid === false ? ' (unpaid)' : ''}`])); };
    const prev = () => {

      $('[name=to]', f).disabled = half;
      if (!t || !D.valid(d.from)) return;
      const to = half ? d.from : d.to;
      const days = D.valid(to) && to >= d.from ? Calc.leaveDays(e, d.from, to, half, t) : 0;
      const b = Calc.balance(e, t, Calc.leaveYear(d.from));

      $('#lv-prev', m.el).innerHTML = `<div class="row" style="gap:24px"><div><div class="tiny muted">Days charged</div><b style="font-size:20px">${days}</b></div><div><div class="tiny muted">Available (${Calc.leaveYear(d.from)})</div><b style="font-size:20px">${b.available}</b></div><div><div class="tiny muted">Pending</div><b>${b.pending}</b></div><div><div class="tiny muted">Balance after</div><b style="font-size:20px;color:${b.afterPending - days < 0 && t.paid !== false ? 'var(--danger)' : 'var(--success)'}">${round2(b.afterPending - days)}</b></div></div>
        ${offs.length && !t.calendarDays ? `<div class="small muted mt-2">${offs.length} weekly-off / holiday day(s) in range are not charged${S().leave.sandwichRule ? ' (sandwich rule ON: they are charged)' : ''}.</div>` : ''}${t.requiresDoc ? `<div class="small mt-1" style="color:var(--warning)">${icon('file')} Supporting document (e.g. medical certificate) must be submitted to HR.</div>` : ''}`;

  },
  submit(a) {
    const f = $('form', a.el); const d = F.read(f);
    const e = Store.emp(d.empId || $('[name=empId]', f).value); const t = Store.leaveType(d.typeId);
    const half = d.halfDay !== 'full'; const to = half ? d.from : d.to;
    const days = t && D.valid(d.from) && D.valid(to) && to >= d.from ? Calc.leaveDays(e, d.from, to, half, t) : 0;
    const b = t ? Calc.balance(e, t, Calc.leaveYear(d.from)) : null;

      typeId: F.req('Leave type'),
      from: v => !D.valid(v) ? 'Valid date required.' : v < e.joinDate ? 'Before joining date.' : (Auth.isSelf() && v < D.add(today(), -30)) ? 'Back-dated applications older than 30 days must be entered by HR.' : null,
      to: v => !D.valid(v) || v < d.from ? '“To” must be on or after “From”.' : Calc.leaveYear(v) !== Calc.leaveYear(d.from) ? 'Leave cannot span two leave years — split it into two applications.' : null,
      reason: F.req('Reason')

    if (!ok) return;

    const ov = Calc.leaveOverlap(e.id, d.from, to); if (ov) return UI.toast(`Overlaps an existing ${ov.status} leave (${fmtDate(ov.from)} – ${fmtDate(ov.to)}).`, 'error', 6000);
    if (t.paid !== false && !S().leave.allowNegative && b.afterPending - days < 0) return UI.toast(`Insufficient ${t.name} balance (${b.afterPending} available after pending requests). Choose Unpaid Leave or ask HR for an adjustment.`, 'error', 7000);
    const auto = !!d.autoApprove && Auth.canApproveFor('leaves', e);
    const lv = { id: uid('lv'), empId: e.id, typeId: t.id, from: d.from, to, half, halfPart: half ? d.halfDay : null, days, reason: d.reason, contact: d.contact, status: auto ? 'approved' : 'pending', appliedAt: new Date().toISOString(), appliedBy: Auth.user.username, actionBy: auto ? Auth.user.username : null, actionAt: auto ? new Date().toISOString() : null, remarks: auto ? 'Approved at entry' : '' };
    Store.db.leaves.unshift(lv);

    else Store.notify({ to: 'perm:leaves.approve', tone: 'blue', icon: 'plane', type: 'Leave', title: `Leave request — ${e.name}`, text: `${t.name}: ${fmtDate(d.from)}${to !== d.from ? ' – ' + fmtDate(to) : ''} (${days} d)`, link: '#/leaves/approvals' });

  async decide(id, approve) {

    if (rem === null) return;

/* ---- 15-payroll.js ---- */
/* =====================================================================
   15-payroll.js — monthly payroll processing, adjustments, finalization,
   salary slips, loans & advances, one-off earnings / deductions
   All rates & rules come from Settings → Payroll (nothing is assumed).
   ===================================================================== */
const Payroll = {
  run(ym) { return Store.db.payrollRuns.find(r => r.month === ym); },
  eligible(ym) { const f = D.monthStart(ym), t = D.monthEnd(ym); return Store.db.employees.filter(e => !e.archived && e.joinDate <= t && (!e.exitDate || e.exitDate >= f) && (EMPLOYED.includes(e.status) || (e.exitDate && e.exitDate >= f))); },
  slip(run, row) { if (run.status === 'finalized') return row.slip; const e = Store.emp(row.empId); return e ? Calc.payslip(e, run.month, row.adj || {}) : null; },
  rows(run) { return run.rows.map(r => ({ r, s: this.slip(run, r) })).filter(x => x.s); },
  create(ym) {
    if (!Auth.guard('payroll', 'create')) return;
    if (this.run(ym)) return UI.toast('A payroll run already exists for this month.', 'warn');
    const emps = this.eligible(ym);
    const run = { id: uid('pay'), month: ym, status: 'draft', createdAt: new Date().toISOString(), createdBy: Auth.user.username, rows: emps.map(e => ({ empId: e.id, adj: {} })) };
    Store.db.payrollRuns.push(run);
    Store.log('Payroll draft created', 'payroll', `${D.monthLabel(ym)} — ${emps.length} employees`); Store.save();
    UI.toast(`Draft payroll created for ${emps.length} employees.`, 'success'); App.refresh();
  },
  async finalize(run) {
    if (!Auth.guard('payroll', 'approve')) return;
    const rows = this.rows(run);
    const warn = [];
    if (D.monthEnd(run.month) >= today()) warn.push('The month has not ended yet — attendance after today will be treated as not worked.');
    const pend = Store.db.attendance.filter(r => r.date.slice(0, 7) === run.month && r.approval === 'pending').length; if (pend) warn.push(`${pend} attendance record(s) for this month are still pending approval.`);
    const pl = Store.db.leaves.filter(l => l.status === 'pending' && l.from.slice(0, 7) <= run.month && l.to.slice(0, 7) >= run.month).length; if (pl) warn.push(`${pl} leave request(s) overlapping this month are pending.`);
    const neg = rows.filter(x => x.s.net < 0).length; if (neg) warn.push(`${neg} employee(s) have a negative net salary.`);
    if (!(await UI.confirm({ title: `Finalize payroll — ${D.monthLabel(run.month)}?`, ok: 'Finalize payroll', typeToConfirm: 'FINALIZE', message: `Finalizing freezes all ${rows.length} salary slips (total net <b>${money(sum(rows, x => x.s.net))}</b>) and posts loan / advance recoveries.${warn.length ? `<div class="alert warn mt-2">${icon('alert')}<div>${warn.map(esc).join('<br>')}</div></div>` : ''}<p class="small muted">This prepares figures for payment. It does <b>not</b> transfer any money — salary payment must be made through your bank / cash process.</p>` }))) return;
    run.rows.forEach(r => { r.slip = this.slip(run, r); });
    run.rows.forEach(r => (r.slip.loanLines || []).forEach(ll => { const l = Store.db.loans.find(x => x.id === ll.loanId); if (l && !(l.repayments || []).some(p => p.runId === run.id)) { l.repayments = l.repayments || []; l.repayments.push({ month: run.month, amount: ll.amount, runId: run.id }); if (Calc.loanBalance(l) <= 0) l.status = 'settled'; } }));
    run.status = 'finalized'; run.finalizedAt = new Date().toISOString(); run.finalizedBy = Auth.user.username;
    run.rows.forEach(r => Store.notify({ to: 'emp:' + r.empId, tone: 'gold', icon: 'wallet', type: 'Payroll', title: `Salary slip available — ${D.monthLabel(run.month)}`, text: `Net pay ${money(r.slip.net)}`, link: '#/payroll' }));
    Store.log('Payroll finalized', 'payroll', `${D.monthLabel(run.month)} — ${rows.length} slips, net ${money(sum(run.rows, r => r.slip.net))}`); Store.save();
    UI.toast('Payroll finalized. Salary slips are now available.', 'success'); App.refresh();
  },
  async reopen(run) {
    if (!(Auth.can('payroll', 'approve') && Auth.can('payroll', 'delete'))) return UI.toast('Reopening requires Payroll approve + delete permissions.', 'warn');
    if (!(await UI.confirm({ title: 'Reopen finalized payroll?', danger: true, ok: 'Reopen', typeToConfirm: 'REOPEN', message: `Reopening ${D.monthLabel(run.month)} reverses its loan recoveries and makes slips editable again. Only do this to correct errors <b>before</b> salaries are paid.` }))) return;
    Store.db.loans.forEach(l => { const before = (l.repayments || []).length; l.repayments = (l.repayments || []).filter(p => p.runId !== run.id); if (before !== l.repayments.length && l.status === 'settled') l.status = 'active'; });
    run.rows.forEach(r => delete r.slip); run.status = 'draft'; run.reopenedAt = new Date().toISOString(); run.reopenedBy = Auth.user.username;
    Store.log('Payroll reopened', 'payroll', D.monthLabel(run.month)); Store.save(); UI.toast('Payroll reopened as draft.', 'success'); App.refresh();
  },
  adjustModal(run, empId) {
    if (!Auth.guard('payroll', 'edit')) return;
    const row = run.rows.find(r => r.empId === empId); const e = Store.emp(empId); const a = row.adj || {};
    const m = UI.modal({ title: `Adjust — ${e.name} (${D.monthLabel(run.month)})`, icon: 'sliders', size: 'lg',
      body: `<p class="small muted mt-0">One-off adjustments for this month only. Recurring items belong in the employee's salary structure.</p><form class="form-grid">
        ${F.input('tax', 'Income tax this month', { type: 'number', value: a.tax ?? '', hint: `Blank = employee default (${money(e.salary?.tax || 0)}). No rates are assumed.`, attrs: 'min="0" step="1"' })}${F.select('hold', 'Payment', [['', 'Pay normally'], ['hold', 'Hold salary (exclude from bank list)']], { value: a.hold || '' })}
        ${F.input('otherEarnLabel', 'Other earning — label', { value: a.otherEarnLabel || '', placeholder: 'e.g. Arrears' })}${F.input('otherEarn', 'Other earning — amount', { type: 'number', value: a.otherEarn ?? '', attrs: 'min="0" step="1"' })}
        ${F.input('otherDedLabel', 'Other deduction — label', { value: a.otherDedLabel || '', placeholder: 'e.g. Damage recovery' })}${F.input('otherDed', 'Other deduction — amount', { type: 'number', value: a.otherDed ?? '', attrs: 'min="0" step="1"' })}
        ${F.textarea('remarks', 'Remarks', { value: a.remarks || '', full: true })}</form><div id="pa-prev" class="mt-2"></div>`,
      footer: [{ label: 'Cancel', action: 'close' }, { label: 'Save adjustment', cls: 'btn-primary', action: x => {
        const d = F.read(x.el);
        if (!F.validate(x.el, d, { tax: v => v !== '' && (+v < 0 || isNaN(v)) ? 'Invalid.' : null, otherEarn: v => v !== '' && (+v < 0 || isNaN(v)) ? 'Invalid.' : null, otherDed: v => v !== '' && (+v < 0 || isNaN(v)) ? 'Invalid.' : null, otherEarnLabel: v => +d.otherEarn > 0 && !v ? 'Label required.' : null, otherDedLabel: v => +d.otherDed > 0 && !v ? 'Label required.' : null })) return;
        row.adj = { tax: d.tax === '' ? undefined : +d.tax, hold: d.hold, otherEarn: +d.otherEarn || 0, otherEarnLabel: d.otherEarnLabel, otherDed: +d.otherDed || 0, otherDedLabel: d.otherDedLabel, remarks: d.remarks };
        Store.log('Payroll adjustment', 'payroll', `${e.code} ${run.month}: ${JSON.stringify(row.adj)}`); Store.save(); x.close(); UI.toast('Adjustment saved.', 'success'); App.refresh();
      } }] });
    const prev = () => { const d = F.read(m.el); const s = Calc.payslip(e, run.month, { tax: d.tax === '' ? undefined : +d.tax, otherEarn: +d.otherEarn || 0, otherDed: +d.otherDed || 0 }); $('#pa-prev', m.el).innerHTML = `<div class="alert info">${icon('wallet')}<div class="alert-body">Gross <b>${money(s.gross)}</b> − deductions <b>${money(s.totalDed)}</b> = net <b>${money(s.net)}</b></div></div>`; };
    $$('input', m.el).forEach(i => i.addEventListener('input', prev)); prev();
  },
  slipHTML(s, run) {
    const co = S().company; const e = Store.emp(s.empId) || {};
    const L = s.earnings.length, R = s.deductions.length, n = Math.max(L, R);
    const lines = Array.from({ length: n }, (_, i) => `<tr><td>${esc(s.earnings[i]?.name || '')}</td><td class="num">${s.earnings[i] ? num(s.earnings[i].amount, 2) : ''}</td><td>${esc(s.deductions[i]?.name || '')}</td><td class="num">${s.deductions[i] ? num(s.deductions[i].amount, 2) : ''}</td></tr>`).join('');
    return `<div class="slip" style="page-break-after:always;margin-bottom:16px">${Printer.header(`Salary Slip — ${D.monthLabel(s.month)}${run.status !== 'finalized' ? ' (DRAFT — not final)' : ''}`, '')}
      <div class="slip-grid" style="font-size:10.5px;margin-bottom:10px"><table><tbody>
        <tr><td style="color:#555">Employee</td><td><b>${esc(s.name)}</b></td></tr><tr><td style="color:#555">Employee ID</td><td>${esc(s.code)}</td></tr><tr><td style="color:#555">CNIC</td><td>${esc(e.cnic || '')}</td></tr><tr><td style="color:#555">Department</td><td>${esc(Store.deptName(s.deptId))}</td></tr><tr><td style="color:#555">Designation</td><td>${esc(Store.desigName(s.desigId))}</td></tr></tbody></table>
        <table><tbody><tr><td style="color:#555">Pay period</td><td>${fmtDate(D.monthStart(s.month))} – ${fmtDate(D.monthEnd(s.month))}</td></tr><tr><td style="color:#555">Attendance</td><td>P ${s.att.P} · ½ ${s.att.HD} · A ${s.att.A} · L ${s.att.L} · H ${s.att.H} · WO ${s.att.WO}</td></tr><tr><td style="color:#555">Late / OT</td><td>${s.att.late} late · ${num(s.otHrs, 2)} OT hours</td></tr><tr><td style="color:#555">Payment</td><td>${esc(s.paymentMode)}${s.bank?.name ? ' · ' + esc(s.bank.name) : ''}${s.bank?.iban ? ' · ' + esc(s.bank.iban) : ''}</td></tr><tr><td style="color:#555">Per-day rate</td><td>${num(s.perDay, 2)} (÷ ${num(s.divisor)})</td></tr></tbody></table></div>
      <table><thead><tr><th>Earnings</th><th class="num">PKR</th><th>Deductions</th><th class="num">PKR</th></tr></thead><tbody>${lines}</tbody>
      <tfoot><tr><td>Gross earnings</td><td class="num">${num(s.gross, 2)}</td><td>Total deductions</td><td class="num">${num(s.totalDed, 2)}</td></tr></tfoot></table>
      <div class="net"><span>NET PAYABLE</span><span>${money(s.net, 2)}</span></div>
      ${s.adj?.remarks ? `<p style="font-size:10px">Remarks: ${esc(s.adj.remarks)}</p>` : ''}${s.notes?.length ? `<p style="font-size:9.5px;color:#7a5a12">${s.notes.map(esc).join(' ')}</p>` : ''}
      <div class="pr-sign"><div>Prepared by</div><div>Accounts</div><div>Employee signature</div></div><div class="pr-foot"><span>${esc(co.name)} · computer-generated slip</span><span>${run.status === 'finalized' ? 'Finalized ' + fmtDate((run.finalizedAt || '').slice(0, 10)) : 'DRAFT'}</span></div></div>`;
  },
  printSlips(run, empIds) {
    if (!run) return;
    const rows = this.rows(run).filter(x => !empIds || empIds.includes(x.s.empId)).filter(x => Auth.isSelf() ? x.s.empId === Auth.user.empId : true);
    if (!rows.length) return UI.toast('No slips to print.', 'warn');
    Printer.run(rows.map(x => this.slipHTML(x.s, run)).join(''));
    Store.log('Print salary slips', 'payroll', `${run.month}: ${rows.length} slip(s)`); Store.save();
    UI.toast('Use “Save as PDF” in the print dialog to create PDF slips.', 'info', 5000);
  },
  register(run) {
    const rows = this.rows(run);
    const cols = ['Code', 'Employee', 'Department', 'Designation', 'Days P', 'Half', 'Absent', 'Leave', 'Late', 'OT hrs', 'Basic', 'Allowances', 'OT pay', 'Gross', 'Absence/late ded.', 'Loan/advance', 'Tax', 'Other ded.', 'Total ded.', 'Net', 'Payment', 'Status'];
    const data = rows.map(({ r, s }) => { const att = sum(s.deductions.filter(d => ['ne', 'abs', 'hd', 'ul', 'late'].includes(d.key)), d => d.amount); const loan = sum(s.deductions.filter(d => d.key === 'loan'), d => d.amount); const tax = sum(s.deductions.filter(d => d.key === 'tax'), d => d.amount); return [s.code, s.name, Store.deptName(s.deptId), Store.desigName(s.desigId), s.att.P, s.att.HD, s.att.A, s.att.L, s.att.late, s.otHrs, s.basic, s.allowTotal, s.otPay, s.gross, round2(att), loan, tax, round2(s.totalDed - att - loan - tax), s.totalDed, s.net, s.paymentMode, r.adj?.hold ? 'HOLD' : '']; });
    const tot = cols.map((c, i) => i === 1 ? 'TOTAL' : i >= 10 && i <= 19 ? round2(sum(data, x => x[i])) : '');
    return { cols, data, tot };
  },
  exportXlsx(run) {
    const { cols, data, tot } = this.register(run);
    const rows = this.rows(run);
    const bank = rows.filter(({ r, s }) => s.paymentMode === 'Bank' && !r.adj?.hold && s.net > 0).map(({ s }) => [s.code, s.name, s.bank?.title || s.name, s.bank?.name || '', s.bank?.iban || s.bank?.account || '', s.net]);
    const byDept = groupBy(rows, x => x.s.deptId);
    const deptRows = Object.entries(byDept).map(([d, xs]) => [Store.deptName(d), xs.length, round2(sum(xs, x => x.s.gross)), round2(sum(xs, x => x.s.totalDed)), round2(sum(xs, x => x.s.net))]);
    const co = S().company; const meta = t => [co.name, t, `Pay period ${D.monthLabel(run.month)} · Status: ${run.status.toUpperCase()}`, `Generated ${fmtDate(today())} by ${Auth.user.name}`];
    UI.downloadBlob(XLSX.build([
      { name: 'Payroll Register', title: meta('Payroll Register'), columns: cols.map(l => ({ label: l })), rows: [...data, tot] },
      { name: 'Bank Transfer List', title: meta('Bank Transfer List (verify before upload to bank)'), columns: ['Code', 'Employee', 'Account Title', 'Bank', 'IBAN / Account', 'Net Amount (PKR)'].map(l => ({ label: l })), rows: [...bank, ['', 'TOTAL', '', '', '', round2(sum(bank, b => b[5]))]] },
      { name: 'Department Summary', title: meta('Department Summary'), columns: ['Department', 'Employees', 'Gross', 'Deductions', 'Net'].map(l => ({ label: l })), rows: deptRows }
    ]), Exporter.fname(`Payroll_${run.month}`, 'xlsx'));
    Store.log('Export payroll', 'payroll', run.month); Store.save(); UI.toast('Payroll workbook downloaded.', 'success');
  },
  loanModal(loan) {
    if (!Auth.guard('payroll', loan ? 'edit' : 'create')) return;
    const l = loan || { type: 'loan', amount: '', installment: '', startMonth: D.addMonths(today().slice(0, 7), 1), issueDate: today(), purpose: '' };
    const m = UI.modal({ title: loan ? `Edit ${loan.ref}` : 'New loan / advance', icon: 'bank',
      body: `<form class="form-grid">${F.select('empId', 'Employee', UI.empOptions(l.empId || ''), { required: true, full: true, disabled: !!loan })}${F.select('type', 'Type', [['loan', 'Loan (installments)'], ['advance', 'Salary advance']], { value: l.type })}${F.input('issueDate', 'Issue date', { type: 'date', value: l.issueDate, required: true })}
        ${F.input('amount', 'Amount (PKR)', { type: 'number', value: l.amount, required: true, attrs: 'min="1" step="1"' })}${F.input('installment', 'Monthly installment (PKR)', { type: 'number', value: l.installment, required: true, attrs: 'min="1" step="1"' })}${F.input('startMonth', 'Recovery starts (payroll month)', { type: 'month', value: l.startMonth, required: true })}${F.textarea('purpose', 'Purpose / remarks', { value: l.purpose, full: true })}</form><div class="alert info mt-2" id="ln-prev"></div>`,
      footer: [{ label: 'Cancel', action: 'close' }, { label: 'Save', cls: 'btn-primary', action: a => {
        const d = F.read(a.el); if (loan) d.empId = loan.empId;
        if (!F.validate(a.el, d, { empId: F.req('Employee'), amount: v => !(+v > 0) ? 'Enter amount.' : loan && +v < sum(loan.repayments || [], r => r.amount) ? 'Less than already recovered.' : null, installment: v => !(+v > 0) ? 'Enter installment.' : +v > +d.amount ? 'Cannot exceed amount.' : null, startMonth: v => !/^\d{4}-\d{2}$/.test(v) ? 'Choose month.' : Store.db.payrollRuns.some(r => r.month === v && r.status === 'finalized') && !loan ? 'That payroll month is finalized; choose a later month.' : null })) return;
        const o = loan || { id: uid('loan'), ref: `LN-${String(Store.db.loans.length + 1).padStart(3, '0')}`, repayments: [], status: 'active', createdBy: Auth.user.username };
        Object.assign(o, { empId: d.empId, type: d.type, amount: +d.amount, installment: +d.installment, startMonth: d.startMonth, issueDate: d.issueDate, purpose: d.purpose });
        if (!loan) Store.db.loans.push(o);
        Store.log(loan ? 'Edit loan' : 'New loan', 'payroll', `${o.ref} ${Store.emp(o.empId).code} ${money(o.amount)} @ ${money(o.installment)}/m`); Store.save(); a.close(); UI.toast('Saved.', 'success'); App.refresh();
      } }] });
    const prev = () => { const d = F.read(m.el); if (+d.amount > 0 && +d.installment > 0) { const n = Math.ceil(+d.amount / +d.installment); $('#ln-prev', m.el).innerHTML = `${icon('info')}<div>${n} installment(s): ${D.monthLabel(d.startMonth || today().slice(0, 7))} → ${D.monthLabel(D.addMonths(d.startMonth || today().slice(0, 7), n - 1))}</div>`; } };
    $$('input,select', m.el).forEach(i => i.addEventListener('input', prev)); prev();
  },
  itemModal(month) {
    if (!Auth.guard('payroll', 'create')) return;
    UI.modal({ title: 'One-off earning / deduction', icon: 'tag', body: `<form class="form-grid">${F.select('empId', 'Employee', UI.empOptions(''), { required: true, full: true })}${F.input('month', 'Payroll month', { type: 'month', value: month, required: true })}${F.select('kind', 'Kind', [['earning', 'Earning (bonus, incentive, arrears)'], ['deduction', 'Deduction (fine, recovery)']])}${F.input('name', 'Description', { required: true, placeholder: 'e.g. Eid bonus' })}${F.input('amount', 'Amount (PKR)', { type: 'number', required: true, attrs: 'min="1" step="1"' })}${F.textarea('note', 'Note', { full: true })}</form>`,
      footer: [{ label: 'Cancel', action: 'close' }, { label: 'Add item', cls: 'btn-primary', action: a => {
        const d = F.read(a.el); if (!F.validate(a.el, d, { empId: F.req('Employee'), name: F.req('Description'), amount: v => !(+v > 0) ? 'Enter amount.' : null, month: v => !/^\d{4}-\d{2}$/.test(v) ? 'Choose month.' : this.run(v)?.status === 'finalized' ? 'That payroll month is finalized.' : null })) return;
        Store.db.payItems.push({ id: uid('pi'), empId: d.empId, month: d.month, kind: d.kind, name: d.name, amount: +d.amount, note: d.note, by: Auth.user.username, at: new Date().toISOString() });
        Store.log('Pay item added', 'payroll', `${Store.emp(d.empId).code} ${d.kind} ${d.name} ${money(d.amount)} (${d.month})`); Store.save(); a.close(); UI.toast('Item added.', 'success'); App.refresh();
      } }] });
  }
};

Pages.payroll = {
  title: () => Auth.isSelf() ? 'My Payslips' : 'Payroll', module: 'payroll',

    ({ process: () => this.process(b, a1), history: () => this.history(b), loans: () => this.loans(b), items: () => this.items(b, a1) }[tab] || (() => this.process(b)))();
  },
  rulesSummary() {
    const P = S().payroll;

  },
  process(el, ym) {
    if (!/^\d{4}-\d{2}$/.test(ym || '')) ym = (Store.db.payrollRuns.filter(r => r.status === 'draft').sort((a, b) => cmp(b.month, a.month))[0]?.month) || D.addMonths(today().slice(0, 7), D.monthEnd(today().slice(0, 7)) === today() ? 0 : -1);

      ${run ? (run.status === 'finalized' ? UI.badge('Finalized', 'green', true) : UI.badge('Draft', 'amber', true)) : UI.badge('Not started', 'gray')}<span class="spacer"></span><span class="small muted" style="max-width:640px">${this.rulesSummary()}</span></div></div><div id="py-run"></div>`;
    $('#py-m').onchange = e => e.target.value && Router.go('payroll/process/' + e.target.value);

      const nb = $('#py-new'); if (nb) nb.onclick = () => Payroll.create(ym);
      return;
    }

    const missing = !fin ? Payroll.eligible(ym).filter(e => !run.rows.some(r => r.empId === e.id)) : [];
    const T = k => round2(sum(rows, x => x.s[k]));

      <div class="grid g-4 mb-3">${UI.kpi({ label: 'Employees', value: rows.length, sub: `${rows.filter(x => x.r.adj?.hold).length} on hold`, ic: 'users', tone: 'navy' })}${UI.kpi({ label: 'Gross earnings', value: money(T('gross')), sub: `OT ${money(T('otPay'))}`, ic: 'trend', tone: 'green' })}${UI.kpi({ label: 'Total deductions', value: money(T('totalDed')), sub: `Tax ${money(T('tax'))}`, ic: 'sliders', tone: 'red' })}${UI.kpi({ label: 'Net payable', value: money(T('net')), sub: fin ? `Finalized by ${esc(run.finalizedBy)}` : 'Draft — live calculation', ic: 'wallet', tone: 'gold' })}</div>

        ${!fin && Auth.can('payroll', 'delete') ? `<button class="btn btn-sm btn-ghost" id="py-del">${icon('trash')}Delete draft</button>` : ''}
        ${fin ? `<button class="btn btn-sm btn-ghost" id="py-re">${icon('undo')}Reopen</button>` : Auth.can('payroll', 'approve') ? `<button class="btn btn-sm btn-gold" id="py-fin">${icon('lock')}Finalize payroll</button>` : ''}</div><div id="py-tbl"></div></div>`;

    $$('[data-v]', el).forEach(b => b.onclick = () => this.viewSlip(Store.db.payrollRuns.find(r => r.id === b.dataset.v), me.id));

};

const Org = {
  deptModal(d) {
    if (!Auth.guard('departments', d ? 'edit' : 'create')) return;
    const x = d || { code: '', name: '', headId: '', description: '', active: true };
    UI.modal({ title: d ? `Edit department — ${d.name}` : 'New department', icon: 'building',
      body: `<form class="form-grid">${F.input('code', 'Code', { value: x.code, required: true, attrs: 'maxlength="6"' })}${F.input('name', 'Department name', { value: x.name, required: true })}${F.select('headId', 'Department head', Store.db.employees.filter(e => Calc.isEmployed(e)).map(e => [e.id, `${e.name} (${e.code}) — ${Store.deptName(e.deptId)}`]), { value: x.headId, placeholder: '— Not assigned —', full: true })}${F.textarea('description', 'Description', { value: x.description, full: true })}${F.toggle('active', 'Active', x.active !== false)}</form>`,
      footer: [{ label: 'Cancel', action: 'close' }, { label: 'Save', cls: 'btn-primary', action: a => {
        const f = F.read(a.el);
        if (!F.validate(a.el, f, { code: v => !v ? 'Required.' : Store.db.departments.some(y => y.code.toLowerCase() === v.toLowerCase() && y.id !== d?.id) ? 'Code already used.' : null, name: v => !v ? 'Required.' : Store.db.departments.some(y => y.name.toLowerCase() === v.toLowerCase() && y.id !== d?.id) ? 'Name already exists.' : null })) return;
        const o = d || { id: uid('dep'), createdAt: new Date().toISOString() };
        Object.assign(o, { code: f.code.toUpperCase(), name: f.name, headId: f.headId || null, description: f.description, active: !!f.active });
        if (!d) Store.db.departments.push(o);
        Store.log(d ? 'Edit department' : 'Create department', 'departments', o.name); Store.save(); a.close(); UI.toast('Department saved.', 'success'); App.refresh();
      } }] });
  },
  async deptDelete(d) {
    if (!Auth.guard('departments', 'delete')) return;
    const n = Store.db.employees.filter(e => e.deptId === d.id).length;
    if (n) return UI.toast(`${n} employee record(s) belong to this department. Transfer them or mark the department inactive.`, 'warn', 6000);
    if (!(await UI.confirm({ title: 'Delete department?', message: esc(d.name), ok: 'Delete', danger: true }))) return;
    Store.db.departments = Store.db.departments.filter(x => x !== d); Store.db.designations.forEach(g => { if (g.deptId === d.id) g.deptId = null; });
    Store.log('Delete department', 'departments', d.name); Store.save(); App.refresh();
  },
  desigModal(g) {
    if (!Auth.guard('departments', g ? 'edit' : 'create')) return;
    const x = g || { name: '', deptId: '', grade: '' };
    UI.modal({ title: g ? 'Edit designation' : 'New designation', icon: 'tag', size: 'sm',
      body: `<form class="form-grid" style="grid-template-columns:1fr">${F.input('name', 'Designation', { value: x.name, required: true })}${F.select('deptId', 'Department', Store.db.departments.map(d => [d.id, d.name]), { value: x.deptId, placeholder: 'Any department' })}${F.input('grade', 'Grade / band', { value: x.grade, placeholder: 'e.g. G-3' })}</form>`,
      footer: [{ label: 'Cancel', action: 'close' }, { label: 'Save', cls: 'btn-primary', action: a => {
        const f = F.read(a.el); if (!F.validate(a.el, f, { name: v => !v ? 'Required.' : Store.db.designations.some(y => y.name.toLowerCase() === v.toLowerCase() && (y.deptId || '') === (f.deptId || '') && y.id !== g?.id) ? 'Already exists in this department.' : null })) return;
        const o = g || { id: uid('dsg') }; Object.assign(o, { name: f.name, deptId: f.deptId || null, grade: f.grade }); if (!g) Store.db.designations.push(o);
        Store.log(g ? 'Edit designation' : 'Create designation', 'departments', o.name); Store.save(); a.close(); UI.toast('Designation saved.', 'success'); App.refresh();
      } }] });
  },
  holidayModal(h) {
    if (!Auth.guard('holidays', h ? 'edit' : 'create')) return;
    const x = h || { date: today(), toDate: '', name: '', type: 'public', tentative: false, note: '' };
    UI.modal({ title: h ? 'Edit holiday' : 'Add holiday', icon: 'calendar',
      body: `<form class="form-grid">${F.input('name', 'Holiday name', { value: x.name, required: true, full: true })}${F.input('date', 'Date (from)', { type: 'date', value: x.date, required: true })}${F.input('toDate', 'To date (multi-day)', { type: 'date', value: x.toDate || '' })}
        ${F.select('type', 'Type', [['public', 'Public holiday (Pakistan)'], ['company', 'Company holiday'], ['optional', 'Optional / restricted (not an off day)']], { value: x.type })}${F.toggle('tentative', 'Tentative (subject to moon sighting / notification)', x.tentative)}${F.textarea('note', 'Note', { value: x.note, full: true })}${h ? `<div class="fld full">${F.toggle('recalc', 'Recalculate attendance on these dates (unfinalized months)', true)}</div>` : ''}</form>`,
      footer: [{ label: 'Cancel', action: 'close' }, { label: 'Save', cls: 'btn-primary', action: a => {
        const f = F.read(a.el);
        if (!F.validate(a.el, f, { name: F.req('Name'), date: v => !D.valid(v) ? 'Valid date required.' : null, toDate: v => v && (!D.valid(v) || v < f.date) ? 'Must be on/after the start date.' : v && D.diff(f.date, v) > 30 ? 'Maximum 31 days.' : null })) return;
        const clash = Store.db.holidays.find(y => y.id !== h?.id && !((f.toDate || f.date) < y.date || f.date > (y.toDate || y.date)));
        if (clash) UI.toast(`Note: overlaps “${clash.name}”.`, 'warn');
        const o = h || { id: uid('hol') }; Object.assign(o, { name: f.name, date: f.date, toDate: f.toDate && f.toDate !== f.date ? f.toDate : null, type: f.type, tentative: !!f.tentative, note: f.note });
        if (!h) Store.db.holidays.push(o);
        const n = Shifts.recalcFor(r => r.date >= D.min(o.date, h?.date || o.date) && r.date <= D.max(o.toDate || o.date, h?.toDate || h?.date || o.date));
        Store.log(h ? 'Edit holiday' : 'Add holiday', 'holidays', `${o.name} ${o.date}${o.toDate ? '→' + o.toDate : ''}${n ? `, ${n} records recalculated` : ''}`); Store.save(); a.close(); UI.toast('Holiday saved.', 'success'); App.refresh();
      } }] });
  },
  addFixedPK(year) {
    const list = [['02-05', 'Kashmir Solidarity Day'], ['03-23', 'Pakistan Day'], ['05-01', 'Labour Day'], ['05-28', 'Youm-e-Takbeer'], ['08-14', 'Independence Day'], ['11-09', 'Iqbal Day'], ['12-25', 'Quaid-e-Azam Day / Christmas']];
    let n = 0;
    list.forEach(([md, name]) => { const d = `${year}-${md}`; if (!Store.db.holidays.some(h => h.date === d)) { Store.db.holidays.push({ id: uid('hol'), date: d, toDate: null, name, type: 'public', tentative: false, note: 'Fixed-date national holiday — verify against the official notification for the year.' }); n++; } });
    Shifts.recalcFor(r => r.date.startsWith(String(year)));
    Store.log('Add fixed public holidays', 'holidays', `${year}: ${n} added`); Store.save();
    UI.toast(`${n} fixed-date holiday(s) added for ${year}. Add Eid, Ashura and Milad holidays once officially notified (they depend on moon sighting).`, 'info', 9000); App.refresh();
  },
  specialModal() {
    if (!Auth.guard('holidays', 'create')) return;
    UI.modal({ title: 'Special working day', icon: 'briefcase', size: 'sm', body: `<p class="small muted mt-0">A special working day overrides the weekly off (e.g. a Sunday declared working). Attendance on that date is treated as a normal working day.</p><form class="form-grid" style="grid-template-columns:1fr">${F.input('date', 'Date', { type: 'date', required: true })}${F.input('name', 'Reason', { required: true })}</form>`,
      footer: [{ label: 'Cancel', action: 'close' }, { label: 'Save', cls: 'btn-primary', action: a => { const f = F.read(a.el); if (!F.validate(a.el, f, { date: v => !D.valid(v) ? 'Valid date required.' : Store.db.specialDays.some(s => s.date === v) ? 'Already defined.' : null, name: F.req('Reason') })) return; Store.db.specialDays.push({ id: uid('spd'), date: f.date, name: f.name }); Shifts.recalcFor(r => r.date === f.date); Store.log('Special working day', 'holidays', `${f.date} ${f.name}`); Store.save(); a.close(); App.refresh(); } }] });
  }
};

Pages.departments = {
  title: 'Departments & Designations', module: 'departments',
  render(el, [tab = 'list', id]) {
    if (tab === 'view') return this.view(el, Store.dept(id));
    el.innerHTML = pageHead('Departments & Designations', 'Organisation structure, department heads and department-wise analytics.', `${Auth.can('departments', 'create') ? `<button class="btn" id="dg-new">${icon('tag')}New designation</button><button class="btn btn-primary" id="dp-new">${icon('plus')}New department</button>` : ''}`) +
      tabs([['list', 'Departments'], ['designations', 'Designations'], ['analytics', 'Analytics']], tab, 'departments') + '<div id="dp"></div>';
    const a = $('#dp-new'); if (a) a.onclick = () => Org.deptModal(); const b = $('#dg-new'); if (b) b.onclick = () => Org.desigModal();
    ({ list: () => this.list($('#dp')), designations: () => this.desigs($('#dp')), analytics: () => this.analytics($('#dp')) }[tab] || (() => this.list($('#dp'))))();
  },
  list(el) {
    const td = today();
    const depts = Store.db.departments.filter(d => Auth.scopedDeptIds().includes(d.id));
    el.innerHTML = `<div class="grid g-3">${depts.map(d => {
      const emps = Store.db.employees.filter(e => e.deptId === d.id && Calc.isEmployed(e)); const snap = Calc.todaySnapshot(emps); const head = Store.emp(d.headId);
      return `<div class="card"><div class="card-b"><div class="row between mb-2"><div class="row"><span class="k-ic tone-navy" style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center">${icon('building')}</span><div><b>${esc(d.name)}</b><div class="small muted">${esc(d.code)}</div></div></div>${d.active === false ? UI.badge('Inactive', 'gray') : ''}</div>
        <div class="row mb-2">${head ? UI.person(head, 'Department head') : '<span class="small muted">No head assigned</span>'}</div>
        <div class="stat-row"><span>Employees</span><b>${emps.length}</b></div><div class="stat-row"><span>Present today</span><b>${snap.present} / ${snap.onDuty}</b></div><div class="mt-2"><div class="progress ${snap.pct >= 90 ? 'green' : snap.pct >= 75 ? '' : 'red'}"><div style="width:${snap.pct}%"></div></div><div class="tiny muted mt-1">${snap.pct}% attendance today</div></div>
        <div class="row mt-3"><a class="btn btn-sm" href="#/departments/view/${d.id}">${icon('eye')}View</a>${Auth.can('departments', 'edit') ? `<button class="btn btn-sm btn-ghost" data-e="${d.id}">${icon('edit')}</button>` : ''}${Auth.can('departments', 'delete') ? `<button class="btn btn-sm btn-ghost" data-d="${d.id}">${icon('trash')}</button>` : ''}</div></div></div>`;
    }).join('') || UI.empty('No departments', '')}</div>`;
    $$('[data-e]', el).forEach(b => b.onclick = () => Org.deptModal(Store.dept(b.dataset.e)));
    $$('[data-d]', el).forEach(b => b.onclick = () => Org.deptDelete(Store.dept(b.dataset.d)));
  },
  view(el, d) {
    if (!d || !Auth.scopedDeptIds().includes(d.id)) { el.innerHTML = UI.empty('Department not found', ''); return; }
    const emps = Store.db.employees.filter(e => e.deptId === d.id && Calc.isEmployed(e)); const td = today(); const ym = td.slice(0, 7);

const Reports = {
  defs: [
    ['daily', 'Daily Attendance', 'clock', 'Status, punches, hours, late and overtime for one day.', ['date', 'dept']],
    ['weekly', 'Weekly Attendance', 'calendar', 'Employee summary for a week.', ['week', 'dept']],

    ['custom', 'Custom Date Range', 'sliders', 'Employee summary for any period.', ['range', 'dept']],
    ['employee', 'Employee Attendance History', 'user', 'Day-by-day history of one employee.', ['emp', 'range']],
    ['late', 'Late Arrival Report', 'clock', 'Every late check-in with minutes late.', ['range', 'dept']],
    ['absent', 'Absenteeism Report', 'xCircle', 'Absent days and absenteeism rate by employee.', ['range', 'dept']],
    ['overtime', 'Overtime Report', 'zap', 'Overtime hours and estimated OT cost.', ['range', 'dept']],
    ['leave', 'Leave Report', 'plane', 'Leave applications and days by type.', ['range', 'dept']],
    ['deptleave', 'Department-wise Leave', 'building', 'Leave days by department and leave type.', ['range']],
    ['department', 'Department-wise Attendance', 'building', 'Attendance KPIs by department.', ['range']],
    ['shift', 'Shift-wise Attendance', 'shift', 'Attendance KPIs by shift.', ['range', 'dept']],
    ['pct', 'Attendance Percentage', 'trend', 'Attendance % ranking with performance bands.', ['range', 'dept']],
    ['payroll', 'Payroll Report', 'wallet', 'Payroll register for a month.', ['month', 'dept'], 'payroll'],
    ['summary', 'Employee Summary', 'users', 'Employee master list with key details.', ['dept']]
  ],
  presets() {
    const td = today(), ym = td.slice(0, 7), ws = D.weekStart(td), pm = D.addMonths(ym, -1);
    return [['today', 'Today', td, td], ['yesterday', 'Yesterday', D.add(td, -1), D.add(td, -1)], ['thisweek', 'This week', ws, td], ['lastweek', 'Last week', D.add(ws, -7), D.add(ws, -1)], ['thismonth', 'This month', D.monthStart(ym), td], ['lastmonth', 'Last month', D.monthStart(pm), D.monthEnd(pm)], ['last30', 'Last 30 days', D.add(td, -29), td], ['thisyear', 'This year', td.slice(0, 4) + '-01-01', td]];
  },
  emps(p, includeLeft = true) { return Auth.scopedEmps(includeLeft).filter(e => (!p.dept || e.deptId === p.dept) && (!p.emp || e.id === p.emp) && D.each(p.from, p.to).some(d => Calc.employedOn(e, d))); },
  summaryRows(emps, from, to) {
    const cols = [{ label: 'Code' }, { label: 'Employee' }, { label: 'Department' }, { label: 'Working days', num: 1 }, { label: 'Present', num: 1 }, { label: 'Half day', num: 1 }, { label: 'Absent', num: 1 }, { label: 'Leave', num: 1 }, { label: 'Holidays', num: 1 }, { label: 'Weekly off', num: 1 }, { label: 'Late', num: 1 }, { label: 'Late (min)', num: 1 }, { label: 'Early out', num: 1 }, { label: 'OT (h)', num: 1 }, { label: 'Worked (h)', num: 1 }, { label: 'Attendance %', num: 1 }];
    const ss = emps.map(e => ({ e, s: Calc.summarize(e, from, to) }));
    const rows = ss.map(({ e, s }) => [e.code, e.name, Store.deptName(e.deptId), s.working - s.NM, s.P, s.HD, s.A, s.L, s.H, s.WO, s.late, s.lateMins, s.early, hrs(s.otMins), hrs(s.workMins), s.pct]);
    const T = i => round2(sum(rows, r => r[i]));
    const foot = ['', `TOTAL (${rows.length})`, '', T(3), T(4), T(5), T(6), T(7), '', '', T(10), T(11), T(12), T(13), T(14), rows.length ? round2(pct(sum(ss, x => x.s.attended), sum(ss, x => Math.max(0, x.s.working - x.s.NM)))) : 0];
    const summary = [['Employees', rows.length], ['Present days', T(4)], ['Absent days', T(6)], ['Leave days', T(7)], ['Late arrivals', T(10)], ['Overtime (h)', T(13)], ['Overall attendance', foot[15] + '%']];
    return { cols, rows, foot, summary, ss };

    html.push(`<button class="btn btn-primary" id="rp-go">${icon('refresh')}Generate</button>`);
    par.innerHTML = html.join('');
    $$('[data-p]', par).forEach(i => i.onchange = () => { p[i.dataset.p] = i.dataset.p === 'year' ? +i.value : i.value; if (['from', 'to'].includes(i.dataset.p)) { p.preset = ''; const pr = $('[data-preset]', par); if (pr) pr.value = ''; } this.run(id); });
    const pr = $('[data-preset]', par); if (pr) pr.onchange = () => { const x = Reports.presets().find(z => z[0] === pr.value); if (x) { p.preset = x[0]; p.from = x[2]; p.to = x[3]; $('[data-p=from]', par).value = p.from; $('[data-p=to]', par).value = p.to; this.run(id); } };
    $('#rp-go').onclick = () => this.run(id);
    this.run(id);
  },
  params(id) {
    const p = Object.assign({}, this.p);
    if (id === 'weekly') { p.from = D.weekStart(p.week); p.to = D.add(p.from, 6); }
    if (id === 'monthly') { p.from = D.monthStart(p.month); p.to = D.monthEnd(p.month); }
    if (id === 'annual') { p.from = `${p.year}-01-01`; p.to = `${p.year}-12-31`; }
    return p;
  },
  run(id) {
    const out = $('#rp-out'); const p = this.params(id);
    if (p.from && p.to && p.from > p.to) { out.innerHTML = `<div class="alert warn">${icon('alert')}<div>“From” date must be before “To” date.</div></div>`; return; }
    if (D.diff(p.from || today(), p.to || today()) > 400) { out.innerHTML = `<div class="alert warn">${icon('alert')}<div>Please choose a range of 400 days or less.</div></div>`; return; }
    if (id === 'employee' && !p.emp) { out.innerHTML = `<div class="card">${UI.empty('Select an employee', 'Choose an employee above to generate the history.', 'user')}</div>`; return; }
    out.innerHTML = `<div class="card"><div class="empty">${icon('refresh')}<b>Generating…</b></div></div>`;
    setTimeout(() => {
      let r; try { r = Reports.build(id, p); } catch (e) { console.error(e); out.innerHTML = `<div class="alert danger">${icon('alert')}<div>Could not build report: ${esc(e.message)}</div></div>`; return; }
      const sub = r.subtitle || [p.dept ? Store.deptName(p.dept) : 'All departments', Auth.scope() !== 'all' ? `Scope: ${Auth.scope()}` : ''].filter(Boolean).join(' · ');
      const canX = Auth.can('reports', 'export');
      out.innerHTML = `<div class="card mb-3"><div class="card-b"><div class="row between"><div><h3>${esc(r.title)}</h3><div class="small muted">${esc(sub)} · generated ${fmtDate(today())} ${fmtTime(nowTime())}</div></div>
        ${canX ? `<div class="row"><button class="btn btn-sm" data-x="pdf">${icon('pdf')}PDF</button><button class="btn btn-sm" data-x="xlsx">${icon('excel')}Excel</button><button class="btn btn-sm" data-x="csv">${icon('file')}CSV</button><button class="btn btn-sm" data-x="print">${icon('print')}Print</button></div>` : '<span class="small muted">Export not permitted for your role</span>'}</div>
        ${r.summary?.length ? `<div class="row mt-3" style="gap:10px">${r.summary.map(([k, v]) => `<div class="card" style="padding:10px 14px;box-shadow:none;background:var(--surface-2)"><div class="tiny muted">${esc(k)}</div><b style="font-size:17px">${esc(v)}</b></div>`).join('')}</div>` : ''}</div></div>
        ${r.chart && (r.chart.items ? r.chart.items.some(i => i.value) : r.chart.labels?.length) ? `<div class="card mb-3"><div class="card-b"><div id="rp-ch"></div></div></div>` : ''}
        <div class="card" id="rp-t"></div>${r.note ? `<p class="small muted mt-2">${icon('info')} ${esc(r.note)}</p>` : ''}`;
      const ch = $('#rp-ch');
      if (ch) { if (r.chart.type === 'donut') Charts.donut(ch, { items: r.chart.items, center: sum(r.chart.items, i => i.value), sub: 'total' }); else Charts[r.chart.type](ch, Object.assign({ height: 240 }, r.chart)); }
      const fmtCell = (v, c) => typeof v === 'number' ? num(v, Number.isInteger(v) ? 0 : 2) : (/^\d{4}-\d{2}-\d{2}$/.test(v) ? fmtDate(v) : /^\d{2}:\d{2}$/.test(v) ? fmtTime(v) : esc(v));
      new DataTable($('#rp-t'), { rows: r.rows.map((v, i) => ({ id: String(i), v })), pageSize: 25, search: true, searchText: x => x.v.join(' '),
        cols: r.cols.map((c, i) => ({ key: 'c' + i, label: c.label, cls: c.num ? 'num' : '', value: x => x.v[i], render: x => fmtCell(x.v[i], c) })),
        footer: r.foot ? () => r.foot.map((v, i) => `<td class="${r.cols[i]?.num ? 'num' : ''}">${typeof v === 'number' ? num(v, Number.isInteger(v) ? 0 : 2) : esc(v)}</td>`).join('') : null,
        empty: ['No data for the selected filters', ''] });
      const exp = { title: r.title, subtitle: sub, columns: r.cols, rows: r.rows, summary: r.summary, footRow: r.foot, filename: r.title.split('—')[0].trim() + ' ' + (p.from || p.month || ''), signatures: true };
      $$('[data-x]', out).forEach(b => b.onclick = () => { Exporter[b.dataset.x](exp); Store.log('Export report', 'reports', `${r.title} (${b.dataset.x.toUpperCase()})`); Store.save(); });
    }, 30);
  }
};

/* user-account persistence — offline version (the cloud build overrides these with server calls) */
const UsersApi = {
  async save(u, f, pw, mustChange) {
    const o = u || { id: uid('usr'), createdAt: new Date().toISOString(), failed: 0 };
    Object.assign(o, f);
    if (!u) { o.salt = newSalt(); o.hash = hashPassword(pw, o.salt); o.mustChange = !!mustChange; Store.db.users.push(o); }
    Store.log(u ? 'Edit user' : 'Create user', 'users', `${o.username} (${Pages.users.roleName(o.role)})${Object.keys(o.overrides || {}).length ? ` with ${Object.keys(o.overrides).length} override(s)` : ''}`); Store.save();
    return o;
  },
  async reset(u, pw, mustChange, unlock) { u.salt = newSalt(); u.hash = hashPassword(pw, u.salt); u.mustChange = !!mustChange; if (unlock) { u.failed = 0; u.lockedUntil = null; } Store.log('Password reset', 'users', u.username); Store.save(); return true; },
  async remove(u) { Store.db.users = Store.db.users.filter(x => x !== u); Store.log('Delete user', 'users', u.username); Store.save(); return true; }
};
