  },
  balance(emp, type, year, depth = 0) {
    const { from, to } = this.leaveYearRange(year);
    const ent = this.entitlement(emp, type, year);
    const inYear = Store.db.leaves.filter(l => l.empId === emp.id && l.typeId === type.id && l.from >= from && l.from <= to);
    const used = sum(inYear.filter(l => l.status === 'approved'), l => l.days);
    const pending = sum(inYear.filter(l => l.status === 'pending'), l => l.days);
    const adj = sum(Store.db.leaveAdjust.filter(a => a.empId === emp.id && a.typeId === type.id && Number(a.year) === Number(year)), a => a.days);
    const enc = sum(Store.db.encashments.filter(x => x.empId === emp.id && x.typeId === type.id && Number(x.year) === Number(year) && x.status !== 'rejected'), x => x.days);
    let carry = 0;
    if (type.carryForward && depth === 0 && emp.joinDate && emp.joinDate <= D.add(from, -1)) {
      const prev = this.balance(emp, type, year - 1, 1);
      carry = Math.min(Number(type.maxCarry) || 0, Math.max(0, prev.available));
    }
    const total = ent + carry + adj;
    return { ent, carry, adj, used, pending, enc, total, available: round2(total - used - enc), afterPending: round2(total - used - enc - pending) };
  },
  leaveOverlap(empId, from, to, ignoreId) {
    return Store.db.leaves.find(l => l.empId === empId && l.id !== ignoreId && ['pending', 'approved'].includes(l.status) && !(to < l.from || from > l.to));
  },

  /* ---------------- day status ---------------- */
  day(emp, date, td) {
    td = td || today();
    if (!this.employedOn(emp, date)) return { code: 'NE' };
    const rec = Store.att(emp.id, date);
    const hol = this.holiday(date);
    const wo = !hol && this.isWeeklyOff(emp, date);
    if (rec) {
      const lv = this.leaveOn(emp, date);
      return { code: rec.status || 'P', rec, holiday: hol, weeklyOff: wo, leave: lv && lv.half ? lv : null, pending: rec.approval === 'pending' };
    }
    if (hol) return { code: 'H', holiday: hol };
    if (wo) return { code: 'WO' };
    const lv = this.leaveOn(emp, date);
    if (lv) return { code: 'L', leave: lv, half: !!lv.half };
    if (date > td) return { code: 'FUT' };
    if (date === td) return { code: 'NM' };
    return { code: 'A', noRecord: true };
  },

  /* summary over a date range for one employee */
  summarize(emp, from, to) {
    const td = today();
    const s = { days: 0, working: 0, P: 0, HD: 0, A: 0, L: 0, Lpaid: 0, Lunpaid: 0, H: 0, WO: 0, NE: 0, NEwork: 0, NM: 0, FUT: 0, late: 0, lateMins: 0, early: 0, earlyMins: 0, otMins: 0, workMins: 0, missing: 0, offWork: 0, pending: 0 };
    D.each(from, to).forEach(d => {
      s.days++;
      const x = this.day(emp, d, td);
      if (x.code === 'NE') { s.NE++; if (!this.isOffDay(emp, d)) s.NEwork++; return; }
      if (x.code === 'FUT') { s.FUT++; return; }
      const offDay = x.code === 'H' || x.code === 'WO' || (x.rec && (x.holiday || x.weeklyOff));
      if (!offDay) s.working++;
      if (x.rec) {
        const r = x.rec;
        if (r.status === 'P') s.P++; else if (r.status === 'HD') s.HD++; else if (r.status === 'A') s.A++;
        if (offDay && r.status !== 'A') s.offWork++;
        if (r.lateMins > 0) { s.late++; s.lateMins += r.lateMins; }
        if (r.earlyMins > 0) { s.early++; s.earlyMins += r.earlyMins; }
        s.otMins += r.otMins || 0; s.workMins += r.workMins || 0;
        if ((r.flags || []).includes('missingOut') && d < td) s.missing++;
        if (r.approval === 'pending') s.pending++;
        if (x.leave) { const t = Store.leaveType(x.leave.typeId); s.L += 0.5; if (t && t.paid === false) s.Lunpaid += 0.5; else s.Lpaid += 0.5; }
        return;
      }
      if (x.code === 'H') { s.H++; return; }
      if (x.code === 'WO') { s.WO++; return; }
      if (x.code === 'L') {
        const t = Store.leaveType(x.leave.typeId); const v = x.half ? 0.5 : 1;
        s.L += v; if (t && t.paid === false) s.Lunpaid += v; else s.Lpaid += v;
        if (x.half) s.A += 0; // half leave without attendance record: other half not worked
        return;
      }
      if (x.code === 'NM') { s.NM++; return; }
      if (x.code === 'A') s.A++;
    });
    s.attended = s.P + s.HD * 0.5;
    const base = s.working - s.NM;
    s.pct = base > 0 ? Math.min(100, pct(s.attended, base)) : 0;
    s.pctWithLeave = base > 0 ? Math.min(100, pct(s.attended + s.L, base)) : 0;
    return s;
  },

  /* today snapshot across a set of employees */
  todaySnapshot(emps) {
    const td = today(), now = toMin(nowTime());
    const o = { total: emps.length, present: 0, absent: 0, late: 0, leave: 0, onDuty: 0, working: 0, onBreak: 0, notMarked: 0, off: 0, halfDay: 0, checkedOut: 0, list: [] };
    emps.forEach(e => {
      const x = this.day(e, td, td);
      const sh = this.shiftFor(e, td);
      const item = { emp: e, x, shift: sh };
      o.list.push(item);
      if (x.code === 'NE') return;
      if (x.code === 'H' || x.code === 'WO') { o.off++; if (!x.rec) return; }
      if (x.code === 'L') { o.leave++; return; }
      if (!(x.code === 'H' || x.code === 'WO')) o.onDuty++;
      if (x.rec) {
        if (x.rec.status === 'A') { o.absent++; return; }
        o.present++;
        if (x.rec.status === 'HD') o.halfDay++;
        if (x.rec.lateMins > 0) o.late++;
        if (x.rec.in && !x.rec.out) { if (this.onBreak(x.rec)) o.onBreak++; else o.working++; }
        if (x.rec.out) o.checkedOut++;
      } else {
        const { st } = this.shiftMins(sh);
        const grace = Number(sh.graceMins ?? S().attendance.graceMins) || 0;
        // after shift start + grace, a missing punch counts as absent for "today" figures
        if (now !== null && now > st + grace + 60 && sh.type !== 'flexible') o.absent++; else o.notMarked++;
      }
    });
    o.pct = o.onDuty > 0 ? pct(o.present, o.onDuty) : 0;
    return o;
  },

  /* ---------------- payroll ---------------- */
  loanBalance(loan) { return round2(Number(loan.amount) - sum(loan.repayments || [], r => r.amount)); },
  workingDaysInMonth(emp, ym) { return D.each(D.monthStart(ym), D.monthEnd(ym)).filter(d => !this.isOffDay(emp, d)).length; },
  payslip(emp, ym, adj = {}, opts = {}) {
    const P = S().payroll;
    const from = D.monthStart(ym), to = D.monthEnd(ym);
    const [y, m] = ym.split('-').map(Number);
    const dim = D.dim(y, m);
    const sal = emp.salary || {};
    const basic = Number(sal.basic) || 0;
    const allowances = (sal.allowances || []).filter(a => Number(a.amount)).map(a => ({ name: a.name, amount: Number(a.amount) }));
    const allowTotal = sum(allowances, a => a.amount);
    const fixedGross = basic + allowTotal;
    const workDays = this.workingDaysInMonth(emp, ym);
    const divisor = P.divisor === 'fixed' ? (Number(P.fixedDivisor) || 30) : P.divisor === 'working' ? Math.max(1, workDays) : dim;
    const perDay = (P.basis === 'basic' ? basic : fixedGross) / divisor;
    const sm = this.summarize(emp, from, to);
    const notes = [];
    if (sm.FUT > 0) notes.push(`${sm.FUT} day(s) of this month are still in the future — figures are provisional.`);
    if (sm.pending > 0) notes.push(`${sm.pending} attendance record(s) are pending approval.`);
    if (sm.missing > 0) notes.push(`${sm.missing} missing check-out punch(es).`);
    // proration for days not employed
    const neDays = P.divisor === 'working' ? sm.NEwork : P.divisor === 'fixed' ? sm.NE * (divisor / dim) : sm.NE;
    const earnings = [{ name: 'Basic Salary', amount: basic }].concat(allowances);
    const otEligible = sal.otEligible !== false;
    const otHrs = otEligible ? hrs(sm.otMins) : 0;
    const otBase = P.otBasis === 'gross' ? fixedGross : basic;
    const hourly = otBase / divisor / (Number(P.hoursPerDay) || 8);
    const otPay = otHrs * hourly * (Number(P.otMultiplier) || 1);
    if (otPay > 0) earnings.push({ name: `Overtime (${num(otHrs, 2)} h × ${num(hourly, 2)} × ${P.otMultiplier})`, amount: otPay, key: 'ot' });
    Store.db.payItems.filter(p => p.empId === emp.id && p.month === ym && p.kind === 'earning').forEach(p => earnings.push({ name: p.name || 'Bonus', amount: Number(p.amount) || 0, key: 'item' }));
    Store.db.encashments.filter(x => x.empId === emp.id && x.month === ym && x.status === 'approved').forEach(x => earnings.push({ name: `Leave Encashment (${x.days} d ${Store.leaveType(x.typeId)?.code || ''})`, amount: Number(x.amount) || 0, key: 'enc' }));
    if (Number(adj.otherEarn)) earnings.push({ name: adj.otherEarnLabel || 'Other Earnings', amount: Number(adj.otherEarn), key: 'adj' });

    const deductions = [];
    if (neDays > 0) deductions.push({ name: `Days not employed (${num(neDays, 1)} d)`, amount: neDays * perDay, key: 'ne' });
    if (P.deductAbsence && sm.A > 0) deductions.push({ name: `Absence (${sm.A} d × ${num(perDay, 2)})`, amount: sm.A * perDay, key: 'abs' });
    if (P.deductHalfDay && sm.HD > 0) deductions.push({ name: `Half days (${sm.HD} × 0.5 d)`, amount: sm.HD * 0.5 * perDay, key: 'hd' });
    if (P.deductUnpaidLeave && sm.Lunpaid > 0) deductions.push({ name: `Unpaid leave (${sm.Lunpaid} d)`, amount: sm.Lunpaid * perDay, key: 'ul' });
    if (P.lateRule === 'count' && Number(P.lateCountPerDay) > 0) {
      const units = Math.floor(Math.max(0, sm.late - (Number(P.lateGraceCount) || 0)) / Number(P.lateCountPerDay));
      const dd = units * (Number(P.lateDeductDays) || 1);
      if (dd > 0) deductions.push({ name: `Late arrivals (${sm.late} lates → ${dd} d)`, amount: dd * perDay, key: 'late' });
    } else if (P.lateRule === 'minutes' && Number(P.latePerMinRate) > 0 && sm.lateMins > 0) {
      deductions.push({ name: `Late minutes (${sm.lateMins} × ${P.latePerMinRate})`, amount: sm.lateMins * Number(P.latePerMinRate), key: 'late' });
    }
    // loans & advances
    const loanLines = [];
    Store.db.loans.filter(l => l.empId === emp.id && l.status !== 'cancelled' && l.startMonth <= ym).forEach(l => {
      const already = (l.repayments || []).find(r => r.month === ym);
      const bal = this.loanBalance(l) + (already ? Number(already.amount) : 0);
      if (bal <= 0) return;
      const inst = Math.min(Number(l.installment) || bal, bal);
      if (inst > 0) { deductions.push({ name: `${l.type === 'advance' ? 'Advance' : 'Loan'} recovery (${l.ref || l.id.slice(-4)})`, amount: inst, key: 'loan', loanId: l.id }); loanLines.push({ loanId: l.id, amount: inst }); }
    });
    const tax = adj.tax !== undefined && adj.tax !== '' && adj.tax !== null ? Number(adj.tax) : Number(sal.tax) || 0;
    if (tax > 0) deductions.push({ name: 'Income Tax (withholding)', amount: tax, key: 'tax' });
    (sal.deductions || []).filter(d => Number(d.amount)).forEach(d => deductions.push({ name: d.name, amount: Number(d.amount), key: 'fixed' }));
    Store.db.payItems.filter(p => p.empId === emp.id && p.month === ym && p.kind === 'deduction').forEach(p => deductions.push({ name: p.name || 'Deduction', amount: Number(p.amount) || 0, key: 'item' }));
    if (Number(adj.otherDed)) deductions.push({ name: adj.otherDedLabel || 'Other Deduction', amount: Number(adj.otherDed), key: 'adj' });

    const rnd = v => P.rounding === 'none' ? round2(v) : P.rounding === 'down' ? Math.floor(v) : P.rounding === 'up' ? Math.ceil(v) : Math.round(v);
    earnings.forEach(e => e.amount = round2(e.amount)); deductions.forEach(d => d.amount = round2(d.amount));
    const gross = round2(sum(earnings, e => e.amount));
    const totalDed = round2(sum(deductions, d => d.amount));
    let net = rnd(gross - totalDed);
    if (net < 0) notes.push('Deductions exceed earnings — net salary is negative. Please review.');
    return {
      empId: emp.id, code: emp.code, name: emp.name, deptId: emp.deptId, desigId: emp.desigId, month: ym,
      basic, allowTotal, fixedGross, divisor, perDay: round2(perDay), workDays,
      att: { P: sm.P, HD: sm.HD, A: sm.A, L: sm.L, Lpaid: sm.Lpaid, Lunpaid: sm.Lunpaid, H: sm.H, WO: sm.WO, NE: sm.NE, late: sm.late, lateMins: sm.lateMins, otMins: sm.otMins, working: sm.working, workMins: sm.workMins },
      otHrs, otPay: round2(otPay), tax, earnings, deductions, gross, totalDed, net, loanLines, notes,
      bank: Object.assign({}, emp.bank || {}), paymentMode: sal.paymentMode || 'Bank', adj: Object.assign({}, adj)
    };
  }
};

/* ---- 02-ui.js ---- */
/* =====================================================================
   02-ui.js — UI components: toast, modal, confirm, data table, forms,
   SVG charts, CSV / XLSX export & import, print-to-PDF
   ===================================================================== */
const UI = {
  /* ---------------- toast ---------------- */
  toast(msg, type = 'info', ms = 3800) {
    const box = $('#toasts');
    const ic = { success: 'checkCircle', error: 'xCircle', warn: 'alert', info: 'info' }[type] || 'info';
    const t = document.createElement('div');
    t.className = `toast ${type}`; t.setAttribute('role', 'status'); t.style.setProperty('--tt', ms + 'ms');
    t.innerHTML = `${icon(ic)}<div>${esc(msg)}</div>`;
    box.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, ms);
  },

  /* ---------------- modal ---------------- */
  stack: [],
  modal({ title, body = '', size = '', footer = null, onMount = null, dismissible = false, icon: ic = null }) {
    const layer = document.createElement('div');
    layer.className = 'modal-layer';
    layer.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-h"><h3 class="row">${ic ? icon(ic) : ''}${esc(title)}</h3><button class="btn btn-ghost btn-icon" data-x aria-label="Close">${icon('x')}</button></div>
      <div class="modal-b">${body}</div>${footer === false ? '' : '<div class="modal-f"></div>'}</div>`;
    document.body.appendChild(layer);
    const prevFocus = document.activeElement;
    const close = () => { layer.remove(); UI.stack = UI.stack.filter(x => x !== api); if (prevFocus && prevFocus.focus) try { prevFocus.focus(); } catch (e) { } };
    const api = { el: layer, close, body: $('.modal-b', layer) };
    UI.stack.push(api);
    $('[data-x]', layer).onclick = close;
    if (dismissible) layer.addEventListener('mousedown', e => { if (e.target === layer) close(); });
    const f = $('.modal-f', layer);
    if (f) {
      (footer || [{ label: 'Close', action: 'close' }]).forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'btn ' + (b.cls || '');
        btn.innerHTML = (b.icon ? icon(b.icon) : '') + esc(b.label);
        if (b.id) btn.id = b.id;
        btn.onclick = async () => { if (b.action === 'close') return close(); btn.disabled = true; try { await b.action(api, btn); } finally { btn.disabled = false; } };
        f.appendChild(btn);
      });
    }
    if (onMount) onMount(api);
    setTimeout(() => { const first = $('input:not([type=hidden]):not([disabled]):not([readonly]), select, textarea', $('.modal-b', layer)); if (first && !('ontouchstart' in window)) first.focus(); }, 30);
    return api;
  },
  confirm({ title = 'Are you sure?', message = '', ok = 'Confirm', danger = false, typeToConfirm = null }) {
    return new Promise(res => {
      let done = false;
      const m = UI.modal({
        title, size: 'sm',
        body: `<div class="confirm-ic ${danger ? 'tone-red' : 'tone-gold'}">${icon(danger ? 'alert' : 'info')}</div><div>${message}</div>
          ${typeToConfirm ? `<div class="fld mt-2"><label>Type <b>${esc(typeToConfirm)}</b> to confirm</label><input class="inp" id="cf-type" autocomplete="off"></div>` : ''}`,
        footer: [
          { label: 'Cancel', action: a => { done = true; a.close(); res(false); } },
          { label: ok, cls: danger ? 'btn-danger' : 'btn-primary', id: 'cf-ok', action: a => {
            if (typeToConfirm && $('#cf-type', a.el).value.trim() !== typeToConfirm) { UI.toast(`Please type ${typeToConfirm} to confirm.`, 'warn'); return; }
            done = true; a.close(); res(true);
          } }
        ]
      });
      const x = $('[data-x]', m.el); const oc = x.onclick; x.onclick = () => { oc(); if (!done) res(false); };
    });
  },
  ask({ title, label = 'Remarks', required = false, placeholder = '', ok = 'Submit', value = '' }) {
    return new Promise(res => {
      let done = false;
      const m = UI.modal({
        title, size: 'sm',
        body: `<div class="fld"><label>${esc(label)}${required ? ' <span class="req">*</span>' : ''}</label><textarea class="inp" id="ask-v" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`,
        footer: [{ label: 'Cancel', action: a => { done = true; a.close(); res(null); } },
          { label: ok, cls: 'btn-primary', action: a => { const v = $('#ask-v', a.el).value.trim(); if (required && !v) return UI.toast('This field is required.', 'warn'); done = true; a.close(); res(v); } }]
      });
      const x = $('[data-x]', m.el); const oc = x.onclick; x.onclick = () => { oc(); if (!done) res(null); };
    });
  },

  /* ---------------- small renderers ---------------- */
  avatar(emp, size = '') {
    if (!emp) return `<span class="av ${size}">?</span>`;
    if (emp.photo) return `<span class="av ${size}"><img src="${emp.photo}" alt=""></span>`;
    return `<span class="av ${size}" style="background:${avColor(emp.code || emp.name)}">${esc(initials(emp.name))}</span>`;
  },
  person(emp, sub) {
    if (!emp) return '<span class="muted">—</span>';
    return `<div class="person">${UI.avatar(emp)}<div class="pn"><b>${esc(emp.name)}</b><small>${sub !== undefined ? sub : esc(emp.code) + ' · ' + esc(Store.desigName(emp.desigId))}</small></div></div>`;
  },
  statusBadge(code, extra = '') {
    const map = { P: 'b-green', HD: 'b-amber', A: 'b-red', L: 'b-blue', H: 'b-violet', WO: 'b-gray', NM: 'b-gray', FUT: 'b-gray', NE: 'b-gray' };
    return `<span class="badge ${map[code] || 'b-gray'}">${esc(STATUS_LABEL[code] || code)}${extra}</span>`;
  },
  badge(text, tone = 'gray', dot = false) { return `<span class="badge b-${tone} ${dot ? 'dot' : ''}">${esc(text)}</span>`; },
  empStatusBadge(s) { return UI.badge(s, { Active: 'green', 'On Probation': 'blue', 'On Notice': 'amber', Suspended: 'amber', Resigned: 'gray', Terminated: 'red', Archived: 'gray' }[s] || 'gray', true); },
  reqBadge(s) { return UI.badge({ pending: 'Pending', approved: 'Approved', rejected: 'Rejected', cancelled: 'Cancelled' }[s] || s, { pending: 'amber', approved: 'green', rejected: 'red', cancelled: 'gray' }[s] || 'gray', true); },
  empty(title = 'Nothing here yet', text = '', ic = 'layers') { return `<div class="empty">${icon(ic)}<b>${esc(title)}</b>${esc(text)}</div>`; },
  kpi({ label, value, sub = '', ic = 'users', tone = 'navy', onclick = '' }) {
    return `<div class="card kpi ${onclick ? 'clickable' : ''}" ${onclick ? `data-go="${onclick}"` : ''}><div class="k-ic tone-${tone}">${icon(ic)}</div><div><div class="k-val">${value}</div><div class="k-lbl">${esc(label)}</div>${sub ? `<div class="k-sub">${sub}</div>` : ''}</div></div>`;
  },
  options(list, sel, placeholder) {
    return (placeholder !== undefined ? `<option value="">${esc(placeholder)}</option>` : '') +
      list.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(sel ?? '') ? 'selected' : ''}>${esc(l)}</option>`; }).join('');
  },
  deptOptions(sel, ph = 'All departments') { return UI.options(Store.db.departments.filter(d => d.active !== false).map(d => [d.id, d.name]), sel, ph); },
  empOptions(sel, ph = 'Select employee', list) { return UI.options((list || Auth.scopedEmps()).map(e => [e.id, `${e.name} (${e.code})`]), sel, ph); },
  downloadBlob(blob, name) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },
  readFile(file, as = 'text') {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; as === 'dataURL' ? r.readAsDataURL(file) : as === 'buffer' ? r.readAsArrayBuffer(file) : r.readAsText(file); });
  },
  pickFile(accept) {
    return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept || ''; i.onchange = () => res(i.files[0] || null); i.click(); });
  },
  async imageToDataURL(file, max = 320, quality = 0.85) {
    const url = await UI.readFile(file, 'dataURL');
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, c.width, c.height);
        const png = file.type === 'image/png';
        res(c.toDataURL(png ? 'image/png' : 'image/jpeg', quality));
      };
      img.onerror = rej; img.src = url;
    });
  }
};

/* ---------------- forms ---------------- */
const F = {
  input(name, label, o = {}) {
    const t = o.type || 'text';
    return `<div class="fld ${o.full ? 'full' : ''} ${o.cls || ''}" data-f="${name}"><label for="f-${name}">${esc(label)}${o.required ? ' <span class="req">*</span>' : ''}</label>
      <input class="inp" id="f-${name}" name="${name}" type="${t}" value="${esc(o.value ?? '')}" ${o.placeholder ? `placeholder="${esc(o.placeholder)}"` : ''} ${o.required ? 'required' : ''} ${o.attrs || ''} ${o.readonly ? 'readonly' : ''} ${o.disabled ? 'disabled' : ''}>
      ${o.hint ? `<div class="hint">${o.hint}</div>` : ''}<div class="err">${esc(o.err || 'Please check this field.')}</div></div>`;
  },
  select(name, label, opts, o = {}) {
    return `<div class="fld ${o.full ? 'full' : ''} ${o.cls || ''}" data-f="${name}"><label for="f-${name}">${esc(label)}${o.required ? ' <span class="req">*</span>' : ''}</label>
      <select class="inp" id="f-${name}" name="${name}" ${o.required ? 'required' : ''} ${o.attrs || ''} ${o.disabled ? 'disabled' : ''}>${typeof opts === 'string' ? opts : UI.options(opts, o.value, o.placeholder)}</select>
      ${o.hint ? `<div class="hint">${o.hint}</div>` : ''}<div class="err">${esc(o.err || 'Please select a value.')}</div></div>`;
  },
  textarea(name, label, o = {}) {
    return `<div class="fld ${o.full ? 'full' : ''}" data-f="${name}"><label for="f-${name}">${esc(label)}${o.required ? ' <span class="req">*</span>' : ''}</label>

  },

  read(root) {

  validate(root, data, rules) {

};

/* ---------------- data table ---------------- */
class DataTable {
  constructor(el, o) {
    this.el = el; this.o = Object.assign({ pageSize: 15, search: true, selectable: false, rows: [], cols: [], filters: [], bulk: [], empty: ['No records found', 'Try changing filters or adding a new record.'] }, o);

  rowId(r) { return this.o.rowId ? this.o.rowId(r) : r.id; }

  build() {
    const o = this.o;
    this.el.innerHTML = `
      ${o.search || o.filters.length || o.tools ? `<div class="toolbar">
        ${o.search ? `<div class="search">${icon('search')}<input class="inp inp-sm" placeholder="${esc(o.searchPlaceholder || 'Search…')}" data-q></div>` : ''}
        ${o.filters.map(f => `<select class="inp inp-sm" data-flt="${f.key}" style="width:auto;max-width:200px" aria-label="${esc(f.label)}">${UI.options(f.options, this.fv[f.key], f.label)}</select>`).join('')}
        <div class="spacer"></div>${o.tools || ''}
        ${o.exportName ? `<button class="btn btn-sm" data-exp="csv">${icon('file')}CSV</button><button class="btn btn-sm" data-exp="xlsx">${icon('excel')}Excel</button>` : ''}
      </div>` : ''}
      <div class="bulkbar hidden"></div>
      <div class="tbl-wrap"><table class="tbl ${o.compact ? 'compact' : ''}"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      <div class="pager"></div>`;
    const qi = $('[data-q]', this.el);
    if (qi) qi.addEventListener('input', debounce(() => { this.q = qi.value.trim().toLowerCase(); this.page = 1; this.draw(); }, 150));
    $$('[data-flt]', this.el).forEach(s => s.onchange = () => { this.fv[s.dataset.flt] = s.value; this.page = 1; this.draw(); if (o.onFilter) o.onFilter(this.fv); });
    $$('[data-exp]', this.el).forEach(b => b.onclick = () => this.export(b.dataset.exp));
    this.draw();
  }
  filtered() {
    let rows = this.o.rows.slice();
    (this.o.filters || []).forEach(f => { const v = this.fv[f.key]; if (v !== '' && v !== undefined) rows = rows.filter(r => f.test ? f.test(r, v) : String(r[f.key]) === String(v)); });
    if (this.q) {
      const words = this.q.split(/\s+/);
      rows = rows.filter(r => { const hay = (this.o.searchText ? this.o.searchText(r) : this.o.cols.map(c => c.value ? c.value(r) : r[c.key]).join(' ')).toString().toLowerCase(); return words.every(w => hay.includes(w)); });
    }
    if (this.sortKey) {
      const c = this.o.cols.find(c => c.key === this.sortKey);
      if (c) rows.sort((a, b) => cmp(c.value ? c.value(a) : a[c.key], c.value ? c.value(b) : b[c.key]) * this.sortDir);
    }
    return rows;
  }
  draw() {
    const o = this.o, rows = this.filtered(); this.lastRows = rows;
    const ps = o.pageSize, pages = Math.max(1, Math.ceil(rows.length / ps));
    if (this.page > pages) this.page = pages;
    const view = ps === Infinity ? rows : rows.slice((this.page - 1) * ps, this.page * ps);
    const thead = $('thead', this.el), tbody = $('tbody', this.el), tfoot = $('tfoot', this.el);

    tbody.innerHTML = view.length ? view.map(r => {
      const id = this.rowId(r);
      return `<tr data-id="${esc(id)}" class="${o.onRowClick ? 'clickable' : ''} ${this.sel.has(id) ? 'selected' : ''} ${o.rowClass ? o.rowClass(r) : ''}">${o.selectable ? `<td class="cb"><input type="checkbox" data-sel ${this.sel.has(id) ? 'checked' : ''} aria-label="Select row"></td>` : ''}${o.cols.map(c => `<td class="${c.cls || ''}">${c.render ? c.render(r) : esc(r[c.key] ?? '')}</td>`).join('')}</tr>`;
    }).join('') : `<tr><td colspan="${o.cols.length + (o.selectable ? 1 : 0)}">${UI.empty(o.empty[0], o.empty[1], 'search')}</td></tr>`;
    tfoot.innerHTML = o.footer && rows.length ? `<tr>${o.selectable ? '<td></td>' : ''}${o.footer(rows)}</tr>` : '';
    $$('th.sortable', thead).forEach(th => th.onclick = () => { const k = th.dataset.k; if (this.sortKey === k) this.sortDir *= -1; else { this.sortKey = k; this.sortDir = 1; } this.draw(); });
    const all = $('[data-all]', thead); if (all) all.onchange = () => { view.forEach(r => all.checked ? this.sel.add(this.rowId(r)) : this.sel.delete(this.rowId(r))); this.draw(); };
    $$('tr[data-id]', tbody).forEach(tr => {
      const id = tr.dataset.id;
      const cb = $('[data-sel]', tr); if (cb) cb.onchange = () => { cb.checked ? this.sel.add(id) : this.sel.delete(id); this.draw(); };
      if (o.onRowClick) tr.addEventListener('click', e => { if (e.target.closest('button,a,input,select,label,textarea')) return; o.onRowClick(this.o.rows.find(r => String(this.rowId(r)) === id)); });
    });

    const bb = $('.bulkbar', this.el);
    if (o.selectable && this.sel.size) {
      bb.classList.remove('hidden');
      bb.innerHTML = `<b>${this.sel.size} selected</b><button class="btn btn-xs btn-ghost" data-clear>Clear</button><span class="spacer"></span>` + o.bulk.map((b, i) => `<button class="btn btn-xs ${b.cls || ''}" data-bulk="${i}">${b.icon ? icon(b.icon) : ''}${esc(b.label)}</button>`).join('');
      $('[data-clear]', bb).onclick = () => { this.sel.clear(); this.draw(); };
      $$('[data-bulk]', bb).forEach(btn => btn.onclick = () => o.bulk[+btn.dataset.bulk].action([...this.sel], this));
    } else bb.classList.add('hidden');

    const pg = $('.pager', this.el);

    const nums = []; for (let i = 1; i <= pages; i++) if (i === 1 || i === pages || Math.abs(i - this.page) <= 1) nums.push(i); else if (nums[nums.length - 1] !== '…') nums.push('…');
    pg.innerHTML = `<span>Showing ${from}–${to} of ${rows.length}</span><div class="pg">
      <select class="inp inp-sm" data-ps style="width:auto">${[10, 15, 25, 50, 100].map(n => `<option ${n === ps ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <button data-p="${this.page - 1}" ${this.page <= 1 ? 'disabled' : ''} aria-label="Previous">‹</button>
      ${nums.map(n => n === '…' ? '<span>…</span>' : `<button data-p="${n}" class="${n === this.page ? 'active' : ''}">${n}</button>`).join('')}
      <button data-p="${this.page + 1}" ${this.page >= pages ? 'disabled' : ''} aria-label="Next">›</button></div>`;
    $$('[data-p]', pg).forEach(b => b.onclick = () => { this.page = +b.dataset.p; this.draw(); });
    $('[data-ps]', pg).onchange = e => { this.o.pageSize = +e.target.value; this.page = 1; this.draw(); };
  }
  exportData() {
    const cols = this.o.cols.filter(c => !c.noExport);
    return { columns: cols.map(c => ({ label: c.label, num: (c.cls || '').includes('num') })), rows: this.filtered().map(r => cols.map(c => c.exp ? c.exp(r) : c.value ? c.value(r) : r[c.key])) };
  }
  export(kind) {
    if (!Auth.can(this.o.exportModule || Router.current?.module || 'reports', 'export')) return UI.toast('You do not have export permission.', 'warn');
    const d = this.exportData();
    Exporter[kind]({ title: this.o.exportName, columns: d.columns, rows: d.rows, filename: this.o.exportName });
    Store.log('Export', this.o.exportModule || 'data', `${this.o.exportName} (${kind.toUpperCase()}, ${d.rows.length} rows)`); Store.save();
  }

/* ---------------- charts (dependency-free SVG) ---------------- */
const Charts = {
  palette: ['#f2b84b', '#3fe0d0', '#9b7bff', '#ff5f7e', '#5cc8ff', '#ff7a3d', '#7be495', '#ffd27a', '#ff5c8a'],
  nice(max) {
    if (max <= 0) return { max: 4, step: 1 };
    const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw) || raw;
    return { max: Math.ceil(max / step) * step, step };
  },
  mount(el, draw) {
    el.classList.add('chart');
    const run = () => { if (!el.isConnected) { ro && ro.disconnect(); return; } draw(); };
    let ro = null, last = 0;
    if (window.ResizeObserver) { ro = new ResizeObserver(() => { const w = el.clientWidth; if (Math.abs(w - last) > 4) { last = w; run(); } }); ro.observe(el); }
    last = el.clientWidth; run();
  },
  tip(el) { let t = $('.chart-tip', el); if (!t) { t = document.createElement('div'); t.className = 'chart-tip'; el.appendChild(t); } return t; },
  bindTips(el) {
    const t = this.tip(el);
    $$('[data-tip]', el).forEach(n => {
      n.addEventListener('mousemove', e => { const r = el.getBoundingClientRect(); t.innerHTML = n.dataset.tip; t.style.left = (e.clientX - r.left) + 'px'; t.style.top = (e.clientY - r.top) + 'px'; t.classList.add('show'); });
      n.addEventListener('mouseleave', () => t.classList.remove('show'));
    });
  },
  legend(series) { return series.length > 1 ? `<div class="chart-legend">${series.map((s, i) => `<span><i style="background:${s.color || this.palette[i]}"></i>${esc(s.name)}</span>`).join('')}</div>` : ''; },
  bar(el, { labels, series, height = 260, stacked = false, fmt = v => num(v, 1).replace(/\.0$/, ''), maxY = null }) {
    this.mount(el, () => {
      const W = Math.max(280, el.clientWidth), H = height, pl = 42, pr = 10, pt = 12, pb = 34;
      const pw = W - pl - pr, ph = H - pt - pb;
      const totals = labels.map((_, i) => stacked ? sum(series, s => s.data[i]) : Math.max(...series.map(s => s.data[i] || 0)));
      const { max, step } = this.nice(maxY ?? Math.max(...totals, 0));
      const gw = pw / Math.max(1, labels.length);
      const bw = stacked ? Math.min(46, gw * 0.6) : Math.min(28, (gw * 0.72) / series.length);
      let g = '';
      for (let v = 0; v <= max + 1e-9; v += step) { const y = pt + ph - (v / max) * ph; g += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl - 8}" y="${y + 4}" text-anchor="end">${fmt(v)}</text>`; }
      const skip = Math.ceil(labels.length / Math.max(1, Math.floor(pw / 46)));
      labels.forEach((lb, i) => {
        const cx = pl + gw * i + gw / 2;
        if (i % skip === 0) g += `<text class="ax" x="${cx}" y="${H - 12}" text-anchor="middle">${esc(lb)}</text>`;
        let acc = 0;
        series.forEach((s, j) => {
          const v = s.data[i] || 0, hgt = (v / max) * ph, col = s.color || this.palette[j];
          const x = stacked ? cx - bw / 2 : cx - (bw * series.length) / 2 + j * bw;
          const y = stacked ? pt + ph - ((acc + v) / max) * ph : pt + ph - hgt;
          acc += v;
          if (v > 0) g += `<rect class="bar" x="${x + (stacked ? 0 : 1)}" y="${y}" width="${Math.max(1, bw - (stacked ? 0 : 2))}" height="${Math.max(0, hgt)}" rx="${stacked ? 2 : 4}" fill="${col}" data-tip="<b>${esc(lb)}</b><br><i style='background:${col}'></i>${esc(s.name)}: ${fmt(v)}"/>`;
        });
      });
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}</svg>${this.legend(series)}`;
      this.bindTips(el);
    });
  },
  line(el, { labels, series, height = 260, area = true, fmt = v => num(v, 1).replace(/\.0$/, ''), maxY = null, minY = 0 }) {
    this.mount(el, () => {
      const W = Math.max(280, el.clientWidth), H = height, pl = 42, pr = 14, pt = 12, pb = 34;
      const pw = W - pl - pr, ph = H - pt - pb;
      const { max, step } = this.nice(maxY ?? Math.max(...series.flatMap(s => s.data), 0));
      const n = labels.length, xs = i => pl + (n <= 1 ? pw / 2 : (pw * i) / (n - 1));
      const ys = v => pt + ph - ((v - minY) / (max - minY || 1)) * ph;
      let g = `<defs>${series.map((s, j) => `<linearGradient id="lg${j}${el.id || ''}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color || this.palette[j]}" stop-opacity=".28"/><stop offset="1" stop-color="${s.color || this.palette[j]}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
      for (let v = minY; v <= max + 1e-9; v += step) { const y = ys(v); g += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text class="ax" x="${pl - 8}" y="${y + 4}" text-anchor="end">${fmt(v)}</text>`; }
      const skip = Math.ceil(n / Math.max(1, Math.floor(pw / 52)));
      labels.forEach((lb, i) => { if (i % skip === 0 || i === n - 1) g += `<text class="ax" x="${xs(i)}" y="${H - 12}" text-anchor="middle">${esc(lb)}</text>`; });
      series.forEach((s, j) => {
        const col = s.color || this.palette[j];
        const pts = s.data.map((v, i) => [xs(i), ys(v || 0)]);
        const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
        if (area && pts.length) g += `<path d="${d}L${pts[pts.length - 1][0]},${pt + ph}L${pts[0][0]},${pt + ph}Z" fill="url(#lg${j}${el.id || ''})"/>`;
        g += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
        if (n <= 40) pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--surface)" stroke="${col}" stroke-width="2"/>`);
      });
      labels.forEach((lb, i) => {
        const x = xs(i), w = n <= 1 ? pw : pw / (n - 1);
        g += `<rect x="${x - w / 2}" y="${pt}" width="${w}" height="${ph}" fill="transparent" data-tip="<b>${esc(lb)}</b>${series.map((s, j) => `<br><i style='background:${s.color || this.palette[j]}'></i>${esc(s.name)}: ${fmt(s.data[i] || 0)}`).join('')}"/>`;
      });
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}</svg>${this.legend(series)}`;
      this.bindTips(el);
    });
  },
  donut(el, { items, center = '', sub = '', size = 180 }) {
    const total = sum(items, i => i.value);
    const R = 70, C = 2 * Math.PI * R;
    let off = 0, arcs = '';
    if (total > 0) items.forEach((it, i) => {
      if (!it.value) return;
      const len = (it.value / total) * C, col = it.color || this.palette[i];
      arcs += `<circle class="slice" cx="90" cy="90" r="${R}" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)" data-tip="<i style='background:${col}'></i>${esc(it.label)}: <b>${num(it.value)}</b> (${pct(it.value, total)}%)"/>`;
      off += len;
    });
    else arcs = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="22"/>`;
    el.innerHTML = `<div class="donut-wrap"><div class="chart" style="width:${size}px"><svg viewBox="0 0 180 180">${arcs}<text x="90" y="88" text-anchor="middle" style="font:800 24px var(--font-display);fill:var(--text)">${esc(center)}</text><text x="90" y="108" text-anchor="middle" class="ax">${esc(sub)}</text></svg></div>
      <div class="donut-legend">${items.map((it, i) => `<div><i style="background:${it.color || this.palette[i]}"></i>${esc(it.label)}<b>${num(it.value)}</b></div>`).join('')}</div></div>`;
    this.bindTips($('.chart', el));
  }
};

const Router = {
  current: null,
  go(path) { const h = '#/' + path; if (location.hash === h) this.render(); else location.hash = h; },
  parse() { const h = location.hash.replace(/^#\/?/, ''); const [route, ...args] = h.split('/').map(x => { try { return decodeURIComponent(x); } catch { return x; } }); return { route: route || 'dashboard', args }; },
  render() {
    if (!Auth.user) return;
    const { route, args } = this.parse();
    const page = Pages[route] || Pages.dashboard;
    const mod = page.module || route;
    this.current = { route, args, module: mod };
    const c = $('#content');
    $$('.sb-link').forEach(a => a.classList.toggle('active', a.dataset.route === (Pages[route] ? route : 'dashboard')));
    const title = page.title ? (typeof page.title === 'function' ? page.title() : page.title) : route;
    $('#tb-title').textContent = T(title);
    $('#tb-crumb').textContent = S().company.name + ' · ' + T(title);
    document.title = `${title} · ${S().company.name} HR`;
    document.body.classList.remove('sb-open');
    if (!Auth.can(mod, 'view')) {
      c.innerHTML = `<div class="card">${UI.empty('Access restricted', 'Your role does not have permission to open this module. Contact the system administrator if you need access.', 'lock')}</div>`;
      return;
    }
    c.innerHTML = ''; c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';
    try { page.render(c, args); }
    catch (e) { console.error(e); c.innerHTML = `<div class="alert danger">${icon('alert')}<div class="alert-body"><b>Something went wrong while opening this page.</b><br>${esc(e.message)}</div></div>`; }
    window.scrollTo(0, 0);
  }
};

const Notify = {
  readSet() { const m = Store.db.notifRead = Store.db.notifRead || {}; return new Set(m[Auth.user.id] || []); },
  derived() {
    const out = [], td = today(), A = S().attendance, self = Auth.isSelf();
    const emps = Auth.scopedEmps(), now = toMin(nowTime());
    const push = o => out.push(Object.assign({ derived: true }, o));
    emps.forEach(e => {
      const r = Store.att(e.id, td);
      if (A.lateAlert && r && r.lateMins > 0) push({ id: `late-${td}-${e.id}`, type: 'Late arrival', tone: 'amber', icon: 'clock', title: self ? 'You were marked late today' : `Late arrival — ${e.name}`, text: `Checked in at ${fmtTime(r.in)} (${fmtDur(r.lateMins)} late)`, ts: `${td}T${r.in}`, link: `#/attendance` });
      if (r && r.otMins >= (A.otAlertMins || 120)) push({ id: `ot-${td}-${e.id}`, type: 'Overtime', tone: 'violet', icon: 'zap', title: `${self ? 'Your' : e.name + '’s'} overtime: ${fmtDur(r.otMins)}`, text: 'Overtime above alert threshold today', ts: `${td}T${r.out || '23:59'}`, link: '#/attendance' });
      // missing checkout (past 7 days, plus today after shift end + threshold)
      for (let i = 0; i <= 7; i++) {
        const d = D.add(td, -i), rr = Store.att(e.id, d);
        if (!rr || !rr.in || rr.out) continue;
        if (i === 0) { const sh = Calc.shiftFor(e, d); const { en } = Calc.shiftMins(sh); if (en > 1440 || now === null || now < en + (A.missingPunchAlertHours || 2) * 60) continue; }
        push({ id: `miss-${d}-${e.id}`, type: 'Missing check-out', tone: 'red', icon: 'alert', title: `Missing check-out — ${self ? fmtDate(d) : e.name}`, text: `${fmtDate(d)}: checked in ${fmtTime(rr.in)}, no check-out recorded`, ts: `${d}T23:00`, link: '#/attendance/register/' + d });
      }
      // birthdays
      if (e.dob) for (let i = 0; i <= 7; i++) { const d = D.add(td, i); if (d.slice(5) === e.dob.slice(5)) push({ id: `bday-${d}-${e.id}`, type: 'Birthday', tone: 'gold', icon: 'gift', title: i === 0 ? `🎂 Happy birthday, ${e.name}!` : `Upcoming birthday — ${e.name}`, text: i === 0 ? 'Today' : fmtDate(d), ts: `${td}T00:0${Math.min(i, 9)}`, link: `#/employees/view/${e.id}` }); }
      if (!self) {
        if (e.contractEnd && e.contractEnd >= td && D.diff(td, e.contractEnd) <= 30) push({ id: `ctr-${e.contractEnd}-${e.id}`, type: 'Contract expiry', tone: 'red', icon: 'briefcase', title: `Contract expiring — ${e.name}`, text: `Contract ends on ${fmtDate(e.contractEnd)} (${D.diff(td, e.contractEnd)} days)`, ts: `${td}T00:00`, link: `#/employees/view/${e.id}` });
        if (e.probationEnd && e.probationEnd >= td && D.diff(td, e.probationEnd) <= 14) push({ id: `prob-${e.probationEnd}-${e.id}`, type: 'Probation review', tone: 'blue', icon: 'user', title: `Probation ending — ${e.name}`, text: `Probation ends on ${fmtDate(e.probationEnd)}`, ts: `${td}T00:00`, link: `#/employees/view/${e.id}` });
        (e.documents || []).forEach(d => { if (d.expiry && d.expiry >= td && D.diff(td, d.expiry) <= 30) push({ id: `doc-${d.id}`, type: 'Document expiry', tone: 'amber', icon: 'file', title: `${d.name} expiring — ${e.name}`, text: `Expires ${fmtDate(d.expiry)}`, ts: `${td}T00:00`, link: `#/employees/view/${e.id}` }); });
      }
    });
    if (A.absenceAlert && !self) {
      const snap = Calc.todaySnapshot(emps);
      if (snap.absent > 0) push({ id: `abs-${td}-${snap.absent}`, type: 'Absence', tone: 'red', icon: 'xCircle', title: `${snap.absent} employee(s) absent today`, text: 'No check-in recorded after shift start', ts: `${td}T${nowTime()}`, link: '#/attendance' });
    }
    const pl = Store.db.leaves.filter(l => l.status === 'pending' && Auth.canApproveFor('leaves', Store.emp(l.empId)));
    if (pl.length) push({ id: `pl-${pl.map(l => l.id).join('').slice(-40)}`, type: 'Leave approval', tone: 'blue', icon: 'plane', title: `${pl.length} leave request(s) awaiting your approval`, text: pl.slice(0, 3).map(l => Store.empName(l.empId)).join(', '), ts: pl[0].appliedAt, link: '#/leaves/approvals' });
    const pc = Store.db.corrections.filter(c => c.status === 'pending' && Auth.canApproveFor('attendance', Store.emp(c.empId)));
    const pm = Store.db.attendance.filter(r => r.approval === 'pending' && Auth.canApproveFor('attendance', Store.emp(r.empId)));
    if (pc.length + pm.length) push({ id: `pc-${pc.length}-${pm.length}-${td}`, type: 'Attendance approval', tone: 'amber', icon: 'calCheck', title: `${pc.length + pm.length} attendance item(s) awaiting approval`, text: `${pc.length} correction request(s), ${pm.length} manual entr${pm.length === 1 ? 'y' : 'ies'}`, ts: `${td}T08:00`, link: '#/attendance/approvals' });
    const ps = Store.db.shiftRequests.filter(r => r.status === 'pending' && Auth.canApproveFor('shifts', Store.emp(r.empId)));
    if (ps.length) push({ id: `ps-${ps.length}-${td}`, type: 'Shift change', tone: 'teal', icon: 'shift', title: `${ps.length} shift change request(s) pending`, text: 'Review in Shifts & Schedules', ts: `${td}T08:00`, link: '#/shifts/requests' });
    if (Auth.can('backup', 'export')) {
      const lb = S().lastBackupAt;
      if (!lb || (Date.now() - new Date(lb)) > 7 * 86400000) push({ id: `bk-${td}`, type: 'System', tone: 'navy', icon: 'database', title: 'Backup reminder', text: lb ? `Last backup ${fmtDate(lb.slice(0, 10))}. Data lives only in this browser.` : 'No backup has been taken yet. Data lives only in this browser.', ts: `${td}T00:00`, link: '#/backup' });
    }
    return out;
  },
  stored() {
    const u = Auth.user;
    return Store.db.notifications.filter(n => n.to === 'all' || n.to === u.id || (u.empId && n.to === 'emp:' + u.empId) || n.to === 'role:' + u.role || (n.to && n.to.startsWith('perm:') && Auth.can(...n.to.slice(5).split('.'))));
  },
  all() {
    const rs = this.readSet();
    return this.derived().concat(this.stored()).map(n => Object.assign({}, n, { unread: n.derived ? !rs.has(n.id) : !(n.read || []).includes(Auth.user.id) })).sort((a, b) => cmp(b.ts, a.ts));
  },
  unreadCount() { return this.all().filter(n => n.unread).length; },
  markRead(ids) {
    const m = Store.db.notifRead = Store.db.notifRead || {}; const set = new Set(m[Auth.user.id] || []);
    ids.forEach(id => { const s = Store.db.notifications.find(n => n.id === id); if (s) { s.read = s.read || []; if (!s.read.includes(Auth.user.id)) s.read.push(Auth.user.id); } else set.add(id); });
    m[Auth.user.id] = [...set].slice(-1500); Store.save(); App.updateBadges();
  }
};

    UI.modal({ title: 'Keyboard shortcuts', size: 'sm', icon: 'hash', dismissible: true, body: `<div class="stat-row"><span>Global search</span><b><kbd>Ctrl</kbd> + <kbd>K</kbd></b></div><div class="stat-row"><span>Close dialog / menu</span><b><kbd>Esc</kbd></b></div><div class="stat-row"><span>Go to Dashboard</span><b><kbd>Alt</kbd> + <kbd>D</kbd></b></div><div class="stat-row"><span>Go to Employees</span><b><kbd>Alt</kbd> + <kbd>E</kbd></b></div><div class="stat-row"><span>Go to Attendance</span><b><kbd>Alt</kbd> + <kbd>A</kbd></b></div><div class="stat-row"><span>Go to Leave</span><b><kbd>Alt</kbd> + <kbd>L</kbd></b></div><div class="stat-row"><span>Go to Reports</span><b><kbd>Alt</kbd> + <kbd>R</kbd></b></div><div class="stat-row"><span>Navigate search results</span><b><kbd>↑</kbd> <kbd>↓</kbd> <kbd>Enter</kbd></b></div>` });
  },
  changePassword(forced = false) {
    UI.modal({
      title: forced ? 'Set a new password' : 'Change password', size: 'sm', icon: 'key',
      body: `${forced ? `<div class="alert warn mb-3">${icon('alert')}<div>For security you must set a new password before continuing.</div></div>` : ''}<div class="form-grid" style="grid-template-columns:1fr">
        ${F.input('cur', 'Current password', { type: 'password', required: true, attrs: 'autocomplete="current-password"' })}
        ${F.input('pw1', 'New password', { type: 'password', required: true, hint: 'At least 8 characters with letters and numbers.', attrs: 'autocomplete="new-password"' })}
        ${F.input('pw2', 'Confirm new password', { type: 'password', required: true, attrs: 'autocomplete="new-password"' })}</div>`,
      footer: [forced ? { label: 'Sign out', action: m => { m.close(); Auth.logout(); } } : { label: 'Cancel', action: 'close' },
        { label: 'Update password', cls: 'btn-primary', action: m => {
          const d = F.read(m.el), u = Auth.user;
          if (!F.validate(m.el, d, { cur: v => hashPassword(v || '', u.salt) !== u.hash ? 'Current password is incorrect.' : null, pw1: v => !V.password(v) ? 'Use at least 8 characters including letters and numbers.' : v === d.cur ? 'New password must be different.' : null, pw2: v => v !== d.pw1 ? 'Passwords do not match.' : null })) return;
          u.salt = newSalt(); u.hash = hashPassword(d.pw1, u.salt); u.mustChange = false;
          Store.log('Password changed', 'users', u.username); Store.save(); m.close(); UI.toast('Password updated successfully.', 'success');
        } }]
    });
  },

  /* ---------------- global search ---------------- */
  search(q) {
    const box = $('#tb-results');
    q = q.trim().toLowerCase();
    if (!q) { box.classList.add('hidden'); return; }
    const emps = Auth.scopedEmps(true).filter(e => [e.name, e.code, e.cnic, e.phone, e.email, Store.deptName(e.deptId), Store.desigName(e.desigId)].join(' ').toLowerCase().includes(q)).slice(0, 7);
    const pages = NAV.flatMap(([, it]) => it).filter(([id, l]) => Auth.can(Pages[id]?.module || id, 'view') && (l.toLowerCase().includes(q) || (UR[l] || '').includes(q))).slice(0, 5);
    const depts = Auth.can('departments') ? Store.db.departments.filter(d => d.name.toLowerCase().includes(q)).slice(0, 3) : [];
    const items = [];
    let html = '';
    if (emps.length) { html += '<div class="sr-head">Employees</div>'; emps.forEach(e => { items.push('#/employees/view/' + e.id); html += `<div class="sr-item" data-i="${items.length - 1}">${UI.avatar(e, 'sm')}<div><b>${esc(e.name)}</b><small>${esc(e.code)} · ${esc(Store.deptName(e.deptId))} · ${esc(e.status)}</small></div></div>`; }); }
    if (pages.length) { html += '<div class="sr-head">Modules</div>'; pages.forEach(([id, l, ic]) => { items.push('#/' + id); html += `<div class="sr-item" data-i="${items.length - 1}">${icon(ic)}<div><b>${esc(navLabel(id, l))}</b></div></div>`; }); }
    if (depts.length) { html += '<div class="sr-head">Departments</div>'; depts.forEach(d => { items.push('#/departments/view/' + d.id); html += `<div class="sr-item" data-i="${items.length - 1}">${icon('building')}<div><b>${esc(d.name)}</b><small>${Store.db.employees.filter(e => e.deptId === d.id && Calc.isEmployed(e)).length} employees</small></div></div>`; }); }
    box.innerHTML = html || `<div class="empty" style="padding:20px">No matches for “${esc(q)}”</div>`;
    box.classList.remove('hidden');
    this._sr = { items, sel: 0 }; this.srMark();
    $$('.sr-item', box).forEach(x => x.onmousedown = e => { e.preventDefault(); this.srGo(+x.dataset.i); });
  },
  srMark() { $$('#tb-results .sr-item').forEach(x => x.classList.toggle('sel', +x.dataset.i === this._sr.sel)); },
  srGo(i) { const l = this._sr?.items[i]; if (l) { location.hash = l; $('#tb-q').value = ''; $('#tb-results').classList.add('hidden'); $('#tb-q').blur(); } },

  keys(e) {
    if (e.key === 'Escape') { if (UI.stack.length) { UI.stack[UI.stack.length - 1].close(); return; } this.closeDrops(); $('#tb-results')?.classList.add('hidden'); document.body.classList.remove('sb-open'); return; }
    if (!Auth.user) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#tb-q').focus(); $('#tb-q').select(); return; }
    if (e.altKey && !e.ctrlKey) { const m = { d: 'dashboard', e: 'employees', a: 'attendance', l: 'leaves', r: 'reports', p: 'payroll' }[e.key.toLowerCase()]; if (m && Auth.can(m)) { e.preventDefault(); Router.go(m); } }
    if (document.activeElement === $('#tb-q') && this._sr && !$('#tb-results').classList.contains('hidden')) {
      if (e.key === 'ArrowDown') { e.preventDefault(); this._sr.sel = Math.min(this._sr.items.length - 1, this._sr.sel + 1); this.srMark(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); this._sr.sel = Math.max(0, this._sr.sel - 1); this.srMark(); }
      if (e.key === 'Enter') { e.preventDefault(); this.srGo(this._sr.sel); }
    }
  },
  bindTopbar() {
    $('#tb-ham').onclick = () => document.body.classList.toggle('sb-open');
    $('.sb-backdrop').onclick = () => document.body.classList.remove('sb-open');
    $('#tb-theme').onclick = () => this.toggleTheme();
    $('#tb-bell').onclick = e => this.showNotifs(e.currentTarget);
    $('#tb-user').onclick = e => this.showUserMenu(e.currentTarget);
    const q = $('#tb-q');
    q.addEventListener('input', () => this.search(q.value));
    q.addEventListener('focus', () => q.value && this.search(q.value));
    q.addEventListener('blur', () => setTimeout(() => $('#tb-results').classList.add('hidden'), 150));
    document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) location.hash = g.dataset.go; });
  }
};

function tabs(list, active, base) { return `<div class="tabs" role="tablist">${list.filter(Boolean).map(([id, label, count]) => `<a class="tab ${id === active ? 'active' : ''}" href="#/${base}/${id}" role="tab">${esc(label)}${count ? ` <span class="badge b-amber">${count}</span>` : ''}</a>`).join('')}</div>`; }

/* ---- 06-aura.js ---- */
/* =====================================================================
   06-aura.js — AURA motion engine & shell (Volume 2)
   aurora canvas · cursor glow · spotlight cards · magnetic buttons ·
   ripples · count-up numbers · page transitions · command palette ·
   cinematic login · splash
   ===================================================================== */
const Aura = {
  reduced: window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches,

  /* ---------- aurora mesh (canvas, low-cost) ---------- */
  aurora() {
    const c = $('#aurora'); if (!c || this.reduced) return;
    const ctx = c.getContext('2d');
    let w, h, t = 0, dpr = Math.min(1.5, window.devicePixelRatio || 1);
    const blobs = [
      { x: .18, y: .2, r: .55, c: [242, 184, 75], sx: .00021, sy: .00017, p: 0 },
      { x: .82, y: .12, r: .45, c: [255, 122, 61], sx: .00016, sy: .00023, p: 1.7 },
      { x: .7, y: .85, r: .55, c: [155, 123, 255], sx: .00019, sy: .00013, p: 3.1 },
      { x: .15, y: .9, r: .45, c: [63, 224, 208], sx: .00013, sy: .0002, p: 4.4 }
    ];
    const size = () => { w = c.width = Math.round(innerWidth * dpr / 2); h = c.height = Math.round(innerHeight * dpr / 2); c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px'; };
    size(); addEventListener('resize', debounce(size, 200));
    let last = 0;
    const frame = now => {
      requestAnimationFrame(frame);
      if (document.hidden || now - last < 50) return; // ~20 fps is plenty for a slow aurora
      last = now; t += 50;
      const light = document.documentElement.dataset.theme === 'light';
      ctx.clearRect(0, 0, w, h);
      ctx.globalCompositeOperation = light ? 'source-over' : 'lighter';
      blobs.forEach(b => {
        const x = (b.x + Math.sin(t * b.sx + b.p) * .12) * w, y = (b.y + Math.cos(t * b.sy + b.p) * .1) * h;
        const r = b.r * Math.max(w, h) * (1 + Math.sin(t * .0003 + b.p) * .08);
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        const a = light ? .22 : .17;
        g.addColorStop(0, `rgba(${b.c.join(',')},${a})`); g.addColorStop(.55, `rgba(${b.c.join(',')},${a * .35})`); g.addColorStop(1, `rgba(${b.c.join(',')},0)`);
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      });
    };
    requestAnimationFrame(frame);
  },

  /* ---------- cursor glow + spotlight cards + magnetic buttons ---------- */
  pointer() {
    const glow = $('#cursor-glow'); let gx = innerWidth / 2, gy = innerHeight / 3, tx = gx, ty = gy;
    addEventListener('pointermove', e => {
      tx = e.clientX; ty = e.clientY;
      const card = e.target.closest && e.target.closest('.card');
      if (card) { const r = card.getBoundingClientRect(); card.classList.add('spot'); card.style.setProperty('--sx', (e.clientX - r.left) + 'px'); card.style.setProperty('--sy', (e.clientY - r.top) + 'px'); }
      const mb = e.target.closest && e.target.closest('.btn-primary,.btn-gold,.hold-btn,.login-logo');
      if (mb && !this.reduced) {
        const r = mb.getBoundingClientRect(), dx = (e.clientX - r.left - r.width / 2) / r.width, dy = (e.clientY - r.top - r.height / 2) / r.height;
        if (mb.classList.contains('login-logo')) mb.style.transform = `perspective(600px) rotateY(${dx * 22}deg) rotateX(${-dy * 22}deg)`;
        else if (!mb.classList.contains('hold-btn')) { mb.style.setProperty('--mx', dx * 6 + 'px'); mb.style.setProperty('--my', dy * 5 + 'px'); }
      }
    }, { passive: true });
    document.addEventListener('pointerout', e => { const mb = e.target.closest && e.target.closest('.btn-primary,.btn-gold,.login-logo'); if (mb && !mb.contains(e.relatedTarget)) { mb.style.removeProperty('--mx'); mb.style.removeProperty('--my'); if (mb.classList.contains('login-logo')) mb.style.transform = ''; } });
    const loop = () => { gx += (tx - gx) * .12; gy += (ty - gy) * .12; if (glow) glow.style.transform = `translate(${gx - 280}px, ${gy - 280}px)`; requestAnimationFrame(loop); };
    if (glow && !this.reduced) { glow.style.left = '0'; glow.style.top = '0'; requestAnimationFrame(loop); }
    // ripples
    document.addEventListener('pointerdown', e => {
      const b = e.target.closest && e.target.closest('.btn'); if (!b || this.reduced) return;
      const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height);
      const i = document.createElement('span'); i.className = 'ripple';
      i.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
      b.appendChild(i); setTimeout(() => i.remove(), 700);
    });
  },

  /* ---------- count-up numbers ---------- */
  countUp(root) {
    if (this.reduced) return;
    $$('.k-val, [data-count-up]', root).forEach(el => {
      if (el.dataset.counted) return; el.dataset.counted = '1';
      const txt = el.textContent.trim(); const m = txt.match(/^([^\d-]*)(-?[\d,]+(?:\.\d+)?)(.*)$/); if (!m) return;
      const target = parseFloat(m[2].replace(/,/g, '')); if (!isFinite(target) || target === 0) return;
      const dec = (m[2].split('.')[1] || '').length, comma = m[2].includes(',');
      const t0 = performance.now(), dur = 1100 + Math.min(900, Math.log10(Math.abs(target) + 1) * 250);
      const fmt = v => { let s = v.toFixed(dec); if (comma) s = Number(s).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }); return m[1] + s + m[3]; };
      const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4); el.textContent = fmt(target * e); if (p < 1) requestAnimationFrame(step); else el.textContent = txt; };
      el.textContent = fmt(0); requestAnimationFrame(step);
    });
  },
  enhance(root) {
    if (!root) return;
    root.classList.remove('enter'); void root.offsetWidth; root.classList.add('enter');
    this.countUp(root);
    $$('.grid.g-4', root).forEach(g => g.classList.add('stagger'));
  },

  /* ---------- splash ---------- */
  hideSplash() { const s = $('#splash'); if (s && !s.classList.contains('gone')) { setTimeout(() => { s.classList.add('gone'); setTimeout(() => s.remove(), 900); }, this.reduced ? 0 : 650); } },

  /* ---------- confetti + success burst ---------- */
  confetti(n = 140) {
    if (this.reduced) return;
    const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
    const ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
    const cols = ['#ffe3a1', '#f2b84b', '#ff7a3d', '#3fe0d0', '#9b7bff', '#ffffff'];
    const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2, y: innerHeight / 2, vx: (Math.random() - .5) * 16, vy: Math.random() * -16 - 4, s: Math.random() * 7 + 3, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
    let f = 0; const tick = () => { ctx.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - f / 110); ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }); if (++f < 120) requestAnimationFrame(tick); else c.remove(); };
    requestAnimationFrame(tick);
  },
  burst(title, sub = '', photo = null) {
    const b = document.createElement('div'); b.className = 'success-burst';
    b.innerHTML = `<div class="sb-card">${photo ? `<img src="${photo}" style="width:84px;height:84px;border-radius:26px;object-fit:cover;margin:0 auto 6px;display:block;border:3px solid rgba(75,227,160,.6)">` : `<div class="sb-tick"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>`}<b>${esc(title)}</b><div class="muted small">${esc(sub)}</div></div>`;
    document.body.appendChild(b); this.confetti(90); setTimeout(() => b.remove(), 2700);
  },

  /* ---------- command palette (Ctrl/⌘ K) ---------- */
  palette() {
    if ($('.palette-layer')) return;
    const L = document.createElement('div'); L.className = 'palette-layer';
    L.innerHTML = `<div class="palette" role="dialog" aria-label="Command palette"><div class="pl-in">${icon('search')}<input placeholder="Type a name, employee ID, page or action…" autocomplete="off"></div><div class="pl-list"></div><div class="pl-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div></div>`;
    document.body.appendChild(L);
    const inp = $('input', L), list = $('.pl-list', L); let items = [], sel = 0;
    const actions = [
      Auth.can('attendance', 'create') && ['Open kiosk mode', 'zap', '#/kiosk'],
      Auth.can('attendance', 'view') && !Auth.isSelf() && ['Open live wall (TV)', 'activity', '#/wall'],
      Auth.can('attendance', 'view') && ["Today's attendance register", 'clock', '#/attendance/register'],
      Auth.can('leaves', 'create') && ['Apply for leave', 'plane', '#/leaves/apply'],
      Auth.can('employees', 'create') && ['Add new employee', 'userPlus', '#/employees/new'],
      Auth.can('payroll', 'create') && ['Run payroll', 'wallet', '#/payroll/process'],
      Auth.can('reports', 'view') && ['Insights & streaks', 'sparkle', '#/insights'],
      ['Toggle dark / light', 'moon', 'theme'], ['Change password', 'key', 'pw'], ['Sign out', 'logout', 'out']
    ].filter(Boolean);
    const close = () => L.remove();
    const run = it => { close(); if (!it) return; if (it[2] === 'theme') App.toggleTheme(); else if (it[2] === 'pw') App.changePassword(); else if (it[2] === 'out') App.confirmLogout(); else location.hash = it[2]; };
    const draw = () => {
      const q = inp.value.trim().toLowerCase();
      const emps = q ? Auth.scopedEmps(true).filter(e => [e.name, e.code, e.cnic, Store.deptName(e.deptId), Store.desigName(e.desigId)].join(' ').toLowerCase().includes(q)).slice(0, 6) : [];
      const pages = NAV.flatMap(([, it]) => it).filter(([id, l]) => Auth.can(Pages[id]?.module || id, 'view') && (!q || l.toLowerCase().includes(q)));
      const acts = actions.filter(a => !q || a[0].toLowerCase().includes(q));
      items = []; let h = '';
      if (emps.length) { h += '<div class="sr-head">People</div>'; emps.forEach(e => { items.push([e.name, null, '#/employees/view/' + e.id]); h += `<div class="sr-item" data-i="${items.length - 1}">${UI.avatar(e, 'sm')}<div><b>${esc(e.name)}</b><small>${esc(e.code)} · ${esc(Store.deptName(e.deptId))}</small></div></div>`; }); }
      if (acts.length) { h += '<div class="sr-head">Actions</div>'; acts.forEach(a => { items.push(a); h += `<div class="sr-item" data-i="${items.length - 1}">${icon(a[1])}<div><b>${esc(a[0])}</b></div></div>`; }); }
      if (pages.length) { h += '<div class="sr-head">Go to</div>'; pages.slice(0, 8).forEach(([id, l, ic]) => { items.push([l, ic, '#/' + id]); h += `<div class="sr-item" data-i="${items.length - 1}">${icon(ic)}<div><b>${esc(navLabel(id, l))}</b></div></div>`; }); }
      list.innerHTML = h || `<div class="empty" style="padding:26px">No results for “${esc(q)}”</div>`;
      sel = Math.min(sel, Math.max(0, items.length - 1)); mark();
      $$('.sr-item', list).forEach(x => { x.onclick = () => run(items[+x.dataset.i]); x.onmousemove = () => { sel = +x.dataset.i; mark(); }; });
    };
    const mark = () => $$('.sr-item', list).forEach(x => { const on = +x.dataset.i === sel; x.classList.toggle('sel', on); if (on) x.scrollIntoView({ block: 'nearest' }); });
    inp.oninput = () => { sel = 0; draw(); };
    inp.onkeydown = e => { if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); mark(); } if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); mark(); } if (e.key === 'Enter') { e.preventDefault(); run(items[sel]); } if (e.key === 'Escape') { e.stopPropagation(); close(); } };
    L.addEventListener('mousedown', e => { if (e.target === L) close(); });
    draw(); setTimeout(() => inp.focus(), 20);
  },

  /* ---------- typewriter ---------- */
  type(el, phrases) {
    if (!el) return; let i = 0, j = 0, del = false;
    const tick = () => { if (!el.isConnected) return; const w = phrases[i]; el.textContent = w.slice(0, j); if (!del && j < w.length) j++; else if (!del) { del = true; return setTimeout(tick, 1600); } else if (j > 0) j--; else { del = false; i = (i + 1) % phrases.length; } setTimeout(tick, del ? 28 : 55); };
    tick();
  }
};

          <div class="small strong muted mb-2 mt-3">UPCOMING HOLIDAYS</div>${Calc.holidaysIn(td, D.add(td, 120)).slice(0, 4).map(h => `<div class="list-item"><div class="date-chip"><small>${MON3[+h.date.slice(5, 7) - 1]}</small><b>${+h.date.slice(8)}</b></div><div class="li-main"><b>${esc(h.name)}</b><small>${h.tentative ? 'Tentative' : DOW[D.dow(h.date)]}</small></div></div>`).join('') || '<p class="small muted">None configured.</p>'}</div></div>

  }
};

const EMP_TYPES = ['Permanent', 'Contract', 'Probation', 'Daily Wages', 'Internship', 'Consultant'];
const EMP_STATUSES = ['Active', 'On Probation', 'On Notice', 'Suspended', 'Resigned', 'Terminated'];
/* document file storage — offline version stores inside the employee record; the cloud build overrides */
const Docs = {
  maxBytes: 1048576,
  note: 'Files are stored inside this browser\'s storage (max 1 MB each). For large scans, keep originals on the company file server and record the reference here.',
  async attach(emp, doc, file) { doc.data = await UI.readFile(file, 'dataURL'); doc.size = file.size; doc.fileName = file.name; },
  async download(d) { const a = document.createElement('a'); a.href = d.data; a.download = d.fileName || d.name; a.click(); },
  remove(emp, d) { }
};
const DOC_TYPES = ['CNIC Copy', 'Appointment Letter', 'Contract', 'Educational Certificate', 'Experience Letter', 'Medical Certificate', 'Police Verification', 'Photograph', 'Other'];

const Emp = {
  canSalary() { return Auth.can('payroll', 'view') && !Auth.isSelf() || Auth.isSelf(); },
  canEditSalary() { return Auth.can('payroll', 'edit') || (Auth.can('employees', 'edit') && Auth.can('payroll', 'view') && !Auth.isSelf()); },
  addHistory(emp, action, details) { emp.history = emp.history || []; emp.history.unshift({ ts: new Date().toISOString(), by: Auth.user?.username || 'system', action, details }); },
  duplicates(d, ignoreId) {
    const out = [];
    Store.db.employees.forEach(e => {
      if (e.id === ignoreId) return;
      if (d.cnic && e.cnic === d.cnic) out.push(`CNIC ${d.cnic} already belongs to ${e.name} (${e.code}).`);
      else if (d.code && e.code && e.code.toLowerCase() === d.code.toLowerCase()) out.push(`Employee ID ${d.code} is already used by ${e.name}.`);
      else if (d.email && e.email && e.email.toLowerCase() === d.email.toLowerCase()) out.push(`Email is already used by ${e.name} (${e.code}).`);
      else if (d.name && d.fatherName && e.name.toLowerCase() === d.name.toLowerCase() && (e.fatherName || '').toLowerCase() === d.fatherName.toLowerCase()) out.push(`Possible duplicate: ${e.name} s/o ${e.fatherName} (${e.code}).`);
    });
    return out;
  },
  async setStatus(emp) {
    if (!Auth.guard('employees', 'edit')) return;
    UI.modal({
      title: `Change employment status — ${emp.name}`, icon: 'briefcase',
      body: `<form class="form-grid">${F.select('status', 'New status', EMP_STATUSES, { value: emp.status, required: true })}${F.input('date', 'Effective date', { type: 'date', value: today(), required: true, hint: 'For Resigned / Terminated this becomes the last working day.' })}${F.textarea('reason', 'Reason / remarks', { full: true, required: true })}</form>`,
      footer: [{ label: 'Cancel', action: 'close' }, { label: 'Update status', cls: 'btn-primary', action: a => {
        const d = F.read(a.el);
        if (!F.validate(a.el, d, { date: v => D.valid(v) ? (v < emp.joinDate ? 'Cannot be before the joining date.' : null) : 'Valid date required.', reason: F.req('Reason') })) return;
        const old = emp.status; emp.status = d.status;
        if (['Resigned', 'Terminated'].includes(d.status)) emp.exitDate = d.date; else emp.exitDate = null;
        if (d.status === 'On Probation' && !emp.probationEnd) emp.probationEnd = D.add(d.date, 90);
        this.addHistory(emp, 'Status changed', `${old} → ${d.status} effective ${fmtDate(d.date)}: ${d.reason}`);
        Store.log('Employee status', 'employees', `${emp.code} ${emp.name}: ${old} → ${d.status}`); Store.save();
        a.close(); UI.toast('Status updated.', 'success'); App.refresh();
      } }]
    });
  },
  async archive(ids, restore = false) {
    if (!Auth.guard('employees', 'delete')) return;
    if (!restore && !(await UI.confirm({ title: `Archive ${ids.length} employee(s)?`, message: 'Archived employees are hidden from lists, attendance and payroll but all records are kept. You can restore them at any time.', ok: 'Archive' }))) return;
    ids.forEach(id => { const e = Store.emp(id); if (!e) return; e.archived = !restore; this.addHistory(e, restore ? 'Restored' : 'Archived', ''); Store.log(restore ? 'Restore employee' : 'Archive employee', 'employees', `${e.code} ${e.name}`); });
    Store.save(); UI.toast(`${ids.length} employee(s) ${restore ? 'restored' : 'archived'}.`, 'success'); App.refresh();
  },
  async remove(ids) {
    if (!Auth.guard('employees', 'delete')) return;
    const names = ids.map(i => Store.emp(i)?.name).filter(Boolean);
    if (!(await UI.confirm({ title: 'Permanently delete?', danger: true, typeToConfirm: 'DELETE', ok: 'Delete permanently', message: `This will permanently delete <b>${names.length}</b> employee(s) (${esc(names.slice(0, 4).join(', '))}${names.length > 4 ? '…' : ''}) together with their attendance, leave, correction and loan records. Finalized payroll snapshots are kept. <b>This cannot be undone.</b> Consider <i>Archive</i> instead.` }))) return;
    const set = new Set(ids);
    const db = Store.db;
    db.employees = db.employees.filter(e => !set.has(e.id));
    db.attendance = db.attendance.filter(r => !set.has(r.empId));
    ['leaves', 'corrections', 'loans', 'shiftRequests', 'leaveAdjust', 'encashments', 'payItems'].forEach(k => db[k] = db[k].filter(x => !set.has(x.empId)));
    db.users.forEach(u => { if (set.has(u.empId)) u.empId = null; });
    db.departments.forEach(d => { if (set.has(d.headId)) d.headId = null; });
    db.employees.forEach(e => { if (set.has(e.managerId)) e.managerId = null; });
    Store.reindex(); Store.log('Delete employee', 'employees', names.join(', ')); Store.save();
    UI.toast(`${names.length} employee(s) deleted.`, 'success'); Router.go('employees');
  },
  importModal() {
    if (!Auth.guard('employees', 'create')) return;
    const cols = ['Code', 'Name', 'FatherName', 'CNIC', 'DOB', 'Gender', 'Phone', 'Email', 'Address', 'City', 'Department', 'Designation', 'JoinDate', 'EmploymentType', 'Shift', 'BasicSalary', 'HouseRent', 'Conveyance', 'Medical', 'BankName', 'IBAN'];

        <div class="row mb-3"><button class="btn" id="ei-pick">${icon('upload')}Choose file…</button><button class="btn btn-ghost" id="ei-tpl">${icon('download')}Download template</button></div><div id="ei-prev"></div>`,
      footer: [{ label: 'Cancel', action: 'close' }, { label: 'Import valid rows', cls: 'btn-primary', icon: 'check', action: a => {
        const v = this._ei || []; if (!v.length) return UI.toast('Nothing valid to import.', 'warn');
        v.forEach(x => { delete x._warn; Store.db.employees.push(x); Store.log('Import employee', 'employees', `${x.code} ${x.name}`); });
        Store.save(); a.close(); UI.toast(`${v.length} employee(s) imported.`, 'success'); App.refresh();
      } }]
    });
    $('#ei-tpl', m.el).onclick = () => UI.downloadBlob(new Blob([CSV.build(cols, [['', 'Example Name', 'Father Name', '35202-1234567-1', '1990-05-14', 'Male', '0300-1234567', 'name@example.com', 'House 1, Street 2', 'Lahore', 'Production', 'Machine Operator', today(), 'Permanent', 'GEN', '30000', '10000', '3000', '2000', 'Meezan Bank', 'PK00XXXX0000000000000000']])], { type: 'text/csv' }), 'employee_import_template.csv');
    $('#ei-pick', m.el).onclick = async () => {
      const f = await UI.pickFile('.csv,.xlsx'); if (!f) return;
      let rows; try { rows = await readTable(f); } catch (e) { return UI.toast(e.message, 'error'); }
      const ok = [], errs = []; const seenCnic = new Set(Store.db.employees.map(e => e.cnic));
      let nextN = +(Store.nextEmpCode().match(/(\d+)$/) || [0, 1])[1];
      rows.forEach(r => {
        if (!String(r.name || '').trim() && !String(r.department || '').trim() && !String(r.cnic || '').trim()) return; // skip blank / total rows
        const e = []; const name = String(r.name || '').trim(); const cnic = formatCNIC(r.cnic);
        const dep = Store.db.departments.find(d => [d.name, d.code].map(x => String(x).toLowerCase()).includes(String(r.department || '').trim().toLowerCase()));
        const joinRaw = excelDate(r.joindate); const join = joinRaw === '' ? today() : joinRaw; const warn = []; if (!cnic) warn.push('CNIC missing'); if (joinRaw === '') warn.push('Join date set to today'); const dob = r.dob ? excelDate(r.dob) : '';
        if (!name) e.push('Name missing'); if (cnic && !V.cnic(cnic)) e.push('Invalid CNIC (format 12345-1234567-1)'); else if (cnic && seenCnic.has(cnic)) e.push('Duplicate CNIC');
        const depName = String(r.department || '').trim(); if (!r.designation) e.push('Designation missing'); if (joinRaw === null) e.push('Invalid JoinDate (use DD-MM-YYYY)'); if (dob === null) e.push('Invalid DOB');
        if (r.email && !V.email(r.email)) e.push('Invalid email');
        const nums = ['basicsalary', 'houserent', 'conveyance', 'medical'].map(k => r[k] === '' || r[k] === undefined ? 0 : Number(String(r[k]).replace(/,/g, '')));
        if (nums.some(n => isNaN(n) || n < 0)) e.push('Invalid salary amount');
        if (e.length) return errs.push([r._row, name || '-', e.join('; ')]);
        if (cnic) seenCnic.add(cnic);
        let dp = dep; if (!dp && depName) { dp = { id: uid('dep'), code: depName.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() || 'DEP', name: depName, headId: null, description: '', active: true, createdAt: new Date().toISOString() }; Store.db.departments.push(dp); warn.push('New department "' + depName + '" created'); }
        let ds = Store.db.designations.find(x => x.name.toLowerCase() === String(r.designation).trim().toLowerCase());
        if (!ds) { ds = { id: uid('dsg'), name: String(r.designation).trim(), deptId: dp?.id || '', grade: '' }; Store.db.designations.push(ds); }
        const sh = Store.db.shifts.find(s => s.code.toLowerCase() === String(r.shift || '').toLowerCase()) || Store.db.shifts[0];
        let code = String(r.code || '').trim(); if (!code || Store.db.employees.some(x => x.code === code) || ok.some(x => x.code === code)) code = (S().empCodePrefix || 'IP-') + String(nextN++).padStart(4, '0');
        ok.push({ id: uid('emp'), code, name, fatherName: String(r.fathername || ''), cnic, dob: dob || '', gender: /^f/i.test(r.gender) ? 'Female' : /^m/i.test(r.gender) ? 'Male' : '', maritalStatus: '', phone: String(r.phone || ''), email: String(r.email || ''), address: String(r.address || ''), city: String(r.city || ''), emergency: {}, deptId: dp?.id || '', desigId: ds.id, joinDate: join, employmentType: EMP_TYPES.find(t => t.toLowerCase() === String(r.employmenttype || '').toLowerCase()) || 'Permanent', status: 'Active', managerId: null, shiftId: sh?.id || null, rotationId: null, shiftHist: [], salary: { basic: nums[0], allowances: [{ name: 'House Rent Allowance', amount: nums[1] }, { name: 'Conveyance Allowance', amount: nums[2] }, { name: 'Medical Allowance', amount: nums[3] }], deductions: [], tax: 0, otEligible: true, paymentMode: r.iban ? 'Bank' : 'Cash' }, bank: { name: String(r.bankname || ''), title: name, iban: String(r.iban || '') }, photo: null, documents: [], history: [{ ts: new Date().toISOString(), by: Auth.user.username, action: 'Imported', details: f.name + (warn.length ? ' — ' + warn.join(', ') : '') }], _warn: warn.join(', '), leaveQuota: {}, createdAt: new Date().toISOString() });
      });
      this._ei = ok;
      $('#ei-prev', m.el).innerHTML = `<div class="row mb-2">${UI.badge(ok.length + ' ready to import', 'green')} ${UI.badge(errs.length + ' rejected', errs.length ? 'red' : 'gray')}</div>

        ${errs.length ? `<table class="tbl compact mt-2"><thead><tr><th>Row</th><th>Name</th><th>Problem</th></tr></thead><tbody>${errs.map(e => `<tr><td>${e[0]}</td><td>${esc(e[1])}</td><td style="color:var(--danger)">${esc(e[2])}</td></tr>`).join('')}</tbody></table>` : ''}`;
    };
  },
  printRecord(emp) {

        <p class="small muted mt-0">${esc(Docs.note)}</p>

      $$('[data-dl]', body).forEach(b => b.onclick = () => Docs.download(emp.documents.find(x => x.id === b.dataset.dl)));
      $$('[data-rm]', body).forEach(b => b.onclick = async () => { const d = emp.documents.find(x => x.id === b.dataset.rm); if (await UI.confirm({ title: 'Delete document?', message: `Delete “${esc(d.name)}” permanently?`, ok: 'Delete', danger: true })) { Docs.remove(emp, d); emp.documents = emp.documents.filter(x => x !== d); Emp.addHistory(emp, 'Document removed', d.name); Store.log('Delete document', 'employees', `${emp.code} ${d.name}`); Store.save(); App.refresh(); } });
