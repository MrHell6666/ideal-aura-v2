/* ---- 20-insights-engine.js ---- */
/* =====================================================================
   20-insights-engine.js — punctuality scores, streaks, achievements,
   heatmaps and rule-based insights (no AI service; all computed locally
   from attendance records, so numbers are always traceable)
   ===================================================================== */
const Insight = {
  cache: new Map(),
  key(...a) { return a.join('|') + '|' + (Store.db.meta.updatedAt || '') + '|' + Store.db.attendance.length; },
  memo(k, fn) { if (this.cache.size > 60) this.cache.clear(); if (!this.cache.has(k)) this.cache.set(k, fn()); return this.cache.get(k); },

  /* per-employee stats over the last N days (to today) */
  stats(emp, days = 30) {
    return this.memo(this.key('st', emp.id, days), () => {
      const td = today(), from = D.add(td, -(days - 1));
      const s = { work: 0, present: 0, onTime: 0, late: 0, absent: 0, leave: 0, otMins: 0, earlyArrMins: 0, arrivals: 0, night: 0, streak: 0, bestStreak: 0 };
      let run = 0;
      D.each(from, td).forEach(d => {
        const x = Calc.day(emp, d, td);
        if (['NE', 'FUT', 'H', 'WO', 'NM'].includes(x.code) && !(x.rec && x.rec.in)) return;
        if (x.code === 'L') { s.leave++; return; } // leave neither breaks nor extends a streak
        s.work++;
        const r = x.rec;
        if (r && r.status !== 'A' && r.in) {
          s.present++; s.otMins += r.otMins || 0;
          const sh = Calc.shiftFor(emp, d); const st = toMin(sh.start), i = toMin(r.in);
          if (sh.type !== 'flexible' && st !== null && i !== null) { let diff = st - i; if (diff < -720) diff += 1440; if (diff > 720) diff -= 1440; s.earlyArrMins += diff; s.arrivals++; }
          if (sh.code === 'C') s.night++;
          if (r.lateMins > 0) { s.late++; run = 0; } else { s.onTime++; run++; }
        } else { s.absent++; run = 0; }
        s.bestStreak = Math.max(s.bestStreak, run);
      });
      s.streak = run;
      s.attPct = s.work ? pct(s.present, s.work) : 0;
      s.onTimePct = s.present ? pct(s.onTime, s.present) : 0;
      s.avgEarly = s.arrivals ? Math.round(s.earlyArrMins / s.arrivals) : 0;
      s.score = s.work ? Math.round(0.55 * s.attPct + 0.35 * s.onTimePct + Math.min(10, s.streak / 2)) : 0;
      return s;
    });
  },
  leaderboard(emps, days = 30) {
    return emps.map(e => ({ e, s: this.stats(e, days) })).filter(x => x.s.work >= Math.min(5, days / 3)).sort((a, b) => b.s.score - a.s.score || b.s.streak - a.s.streak || cmp(a.e.name, b.e.name));
  },
  achievements(emp) {
    const s30 = this.stats(emp, 30), s7 = this.stats(emp, 7), sm = Calc.summarize(emp, D.monthStart(today().slice(0, 7)), today());
    return [
      { id: 'streak', ic: '🔥', name: 'Iron Streak', desc: `${s30.streak} on-time days in a row`, got: s30.streak >= 10, ac: 'rgba(255,122,61,.35)', progress: Math.min(1, s30.streak / 10) },
      { id: 'early', ic: '🌅', name: 'Early Bird', desc: `Arrives ${Math.max(0, s30.avgEarly)} min early on average`, got: s30.arrivals >= 8 && s30.avgEarly >= 8, ac: 'rgba(242,184,75,.35)', progress: Math.min(1, Math.max(0, s30.avgEarly) / 8) },
      { id: 'perfect', ic: '💎', name: 'Perfect Week', desc: 'No late or absent day in the last 7 days', got: s7.work >= 4 && s7.late === 0 && s7.absent === 0, ac: 'rgba(92,200,255,.35)', progress: s7.work ? (s7.onTime / s7.work) : 0 },
      { id: 'zero', ic: '🛡️', name: 'Zero Absence Month', desc: 'No absence so far this month', got: sm.working - sm.NM >= 10 && sm.A === 0, ac: 'rgba(75,227,160,.35)', progress: Math.min(1, (sm.working - sm.NM) / 10) * (sm.A === 0 ? 1 : 0) },
      { id: 'ot', ic: '⚡', name: 'Overtime Hero', desc: `${num(hrs(s30.otMins), 1)} h overtime in 30 days`, got: s30.otMins >= 1200, ac: 'rgba(155,123,255,.35)', progress: Math.min(1, s30.otMins / 1200) },
      { id: 'owl', ic: '🦉', name: 'Night Guardian', desc: `${s30.night} night shifts in 30 days`, got: s30.night >= 8, ac: 'rgba(63,224,208,.35)', progress: Math.min(1, s30.night / 8) }
    ];
  },

  /* company / group heatmap: % attended per day */
  heat(emps, days = 140) {
    return this.memo(this.key('heat', emps.length, emps[0]?.id, days), () => {
      const td = today(); let start = D.add(td, -(days - 1)); while (D.dow(start) !== 1) start = D.add(start, -1);
      return D.each(start, td).map(d => {
        let on = 0, att = 0;
        emps.forEach(e => { const x = Calc.day(e, d, td); if (['NE', 'FUT', 'H', 'WO', 'L'].includes(x.code) && !(x.rec && x.rec.in)) return; if (x.code === 'NM') return; on++; if (x.rec && x.rec.status !== 'A') att += x.rec.status === 'HD' ? .5 : 1; });
        return { d, on, att, p: on ? att / on : null };
      });
    });
  },
  heatHTML(cells) {
    const lvl = p => p === null ? 'off' : p >= .97 ? 'l4' : p >= .92 ? 'l3' : p >= .85 ? 'l2' : p > 0 ? 'l1' : '';
    return `<div class="heat">${cells.map((c, i) => `<i class="${lvl(c.p)}" style="animation-delay:${Math.min(i * 4, 600)}ms" title="${fmtDate(c.d)} · ${c.p === null ? 'no working day' : Math.round(c.p * 100) + '% attended (' + num(c.att, 1).replace(/\.0$/, '') + '/' + c.on + ')'}"></i>`).join('')}</div>
      <div class="row between mt-1"><span class="tiny muted">${fmtDate(cells[0]?.d)} → today</span><span class="heat-legend">Less <i style="background:var(--surface-3)"></i><i style="background:rgba(242,184,75,.25)"></i><i style="background:rgba(242,184,75,.45)"></i><i style="background:rgba(242,184,75,.7)"></i><i style="background:var(--gold-2)"></i> More</span></div>`;
  },
  personalHeat(emp, days = 140) {
    const td = today(); let start = D.add(td, -(days - 1)); while (D.dow(start) !== 1) start = D.add(start, -1);
    return D.each(start, td).map(d => { const x = Calc.day(emp, d, td); let p = null; if (x.rec && x.rec.in) p = x.rec.lateMins > 0 ? .86 : x.rec.status === 'HD' ? .9 : 1; else if (x.code === 'A') p = 0; else if (x.code === 'L') p = .5; return { d, p, on: 1, att: p || 0 }; });
  },

  /* rule-based insights — each is computed from records and states its numbers */
  list(emps) {
    // rolling windows: last 14 days vs the 14 days before (robust at the start of a month)
    const out = [], td = today(), cFrom = D.add(td, -13), pFrom = D.add(td, -27), pTo = D.add(td, -14);
    const sum1 = (from, to) => { let late = 0, abs = 0, ot = 0, att = 0, base = 0; emps.forEach(e => { const s = Calc.summarize(e, from, to); late += s.late; abs += s.A; ot += s.otMins; att += s.attended; base += Math.max(0, s.working - s.NM); }); return { late, abs, ot, pct: base ? pct(att, base) : 0 }; };
    const cur = sum1(cFrom, td), prev = sum1(pFrom, pTo);
    const ch = (a, b) => b ? Math.round((a - b) / b * 100) : (a ? 100 : 0);
    const lc = ch(cur.late, prev.late);
    out.push({ ic: 'clock', tone: lc > 10 ? 'red' : lc < -10 ? 'green' : 'amber', t: `Late arrivals ${lc > 0 ? 'up' : lc < 0 ? 'down' : 'flat'} ${Math.abs(lc)}% in the last 14 days`, s: `${cur.late} late check-ins vs ${prev.late} in the previous 14 days` });
    const pc = round2(cur.pct - prev.pct);
    out.push({ ic: 'trend', tone: pc >= 0 ? 'green' : 'red', t: `Attendance ${cur.pct}% over 14 days (${pc >= 0 ? '+' : ''}${pc} pts)`, s: `Compared with ${prev.pct}% in the previous 14 days` });
    // weekday absence pattern (last 60 days)
    const wd = Array(7).fill(0), wn = Array(7).fill(0);
    emps.forEach(e => D.each(D.add(td, -59), D.add(td, -1)).forEach(d => { const x = Calc.day(e, d, td); if (['NE', 'FUT', 'H', 'WO', 'L', 'NM'].includes(x.code)) return; wn[D.dow(d)]++; if (x.code === 'A' || x.rec?.status === 'A') wd[D.dow(d)]++; }));
    const rates = wd.map((a, i) => wn[i] ? a / wn[i] : 0); const worst = rates.indexOf(Math.max(...rates));
    if (rates[worst] > 0) out.push({ ic: 'calendar', tone: 'violet', t: `${DOW[worst]}s have the highest absenteeism`, s: `${round2(rates[worst] * 100)}% of scheduled ${DOW[worst]} shifts missed in the last 60 days` });
    // department leader & laggard (month)
    const depts = Store.db.departments.filter(d => emps.some(e => e.deptId === d.id)).map(d => { const de = emps.filter(e => e.deptId === d.id); let a = 0, b = 0, l = 0; de.forEach(e => { const s = Calc.summarize(e, cFrom, td); a += s.attended; b += Math.max(0, s.working - s.NM); l += s.late; }); return { d, p: b ? pct(a, b) : 0, l, n: de.length, b }; }).filter(x => x.n && x.b);
    if (depts.length > 1) { depts.sort((a, b) => b.p - a.p); out.push({ ic: 'building', tone: 'gold', t: `${depts[0].d.name} leads with ${depts[0].p}% attendance`, s: `${depts[depts.length - 1].d.name} is lowest at ${depts[depts.length - 1].p}% (last 14 days)` }); const lateTop = depts.slice().sort((a, b) => b.l / b.n - a.l / a.n)[0]; if (lateTop.l) out.push({ ic: 'alert', tone: 'amber', t: `${lateTop.d.name}: most late arrivals per person`, s: `${lateTop.l} late check-ins across ${lateTop.n} employees in the last 14 days` }); }
    // overtime concentration
    const ots = emps.map(e => ({ e, m: this.stats(e, 30).otMins })).sort((a, b) => b.m - a.m); const totOt = sum(ots, x => x.m);
    if (totOt > 0) { const top3 = sum(ots.slice(0, 3), x => x.m); out.push({ ic: 'zap', tone: 'violet', t: `${num(hrs(totOt), 0)} overtime hours in 30 days`, s: `Top 3 people account for ${pct(top3, totOt)}% — ${ots.slice(0, 3).map(x => x.e.name.split(' ')[0]).join(', ')}` }); }
    // missing punches
    let miss = 0; emps.forEach(e => D.each(D.add(td, -14), D.add(td, -1)).forEach(d => { const r = Store.att(e.id, d); if (r && r.in && !r.out) miss++; }));
    if (miss) out.push({ ic: 'xCircle', tone: 'red', t: `${miss} missing check-out(s) in the last 14 days`, s: 'Review in Attendance → Approvals & Corrections' });
    return out;
  }
};

/* =====================================================================
   22-punch.js — hold-to-punch with geo-fence & selfie proof
   ===================================================================== */
const Punch = {
  holdMs: 1100,
  dist(a, b) { // metres (haversine)
    const R = 6371000, r = x => x * Math.PI / 180;
    const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
    return Math.round(2 * R * Math.asin(Math.sqrt(h)));
  },
  locate(timeout = 9000) {
    return new Promise((res, rej) => {
      if (!navigator.geolocation) return rej(new Error('This device cannot share its location.'));
      navigator.geolocation.getCurrentPosition(p => res({ lat: round2(p.coords.latitude * 1e4) / 1e4, lng: round2(p.coords.longitude * 1e4) / 1e4, acc: Math.round(p.coords.accuracy), at: new Date().toISOString() }),
        e => rej(new Error(e.code === 1 ? 'Location permission was denied. Allow location for this site to punch.' : 'Could not get your location. Move near a window and try again.')), { enableHighAccuracy: true, timeout, maximumAge: 30000 });
    });
  },
  async geoCheck() {
    const g = S().geo || {};
    if (!g.enabled || g.lat === null || g.lng === null || g.lat === '' || g.lng === '') return { skipped: true };
    let pos;
    try { pos = await this.locate(); } catch (e) { if (g.enforce) throw e; return { error: e.message }; }
    const d = this.dist(pos, { lat: +g.lat, lng: +g.lng });
    const inside = d <= (+g.radius || 300) + Math.min(pos.acc || 0, 150);
    if (!inside && g.enforce) throw new Error(`You are ${d >= 1000 ? (d / 1000).toFixed(1) + ' km' : d + ' m'} from ${g.name || 'the workplace'}. Punching is only allowed within ${g.radius} m.`);
    return Object.assign(pos, { dist: d, inside });
  },
  selfie() {
    return new Promise(res => {
      let stream = null, done = false;
      const stop = () => { if (stream) stream.getTracks().forEach(t => t.stop()); };
      const m = UI.modal({
        title: 'Selfie verification', size: 'sm', icon: 'camera',
        body: `<div class="selfie-cam" id="sf-box"><video id="sf-v" playsinline autoplay muted></video></div><p class="small muted center mt-2 mb-0" id="sf-msg">Centre your face in the circle, then capture.</p>`,
        footer: [{ label: 'Cancel', action: a => { done = true; stop(); a.close(); res(null); } }, { label: 'Capture', cls: 'btn-primary', icon: 'camera', id: 'sf-cap', action: a => {
          const v = $('#sf-v', a.el); if (!v.videoWidth) return UI.toast('Camera is not ready yet.', 'warn');
          const c = document.createElement('canvas'); const s = Math.min(v.videoWidth, v.videoHeight); c.width = c.height = 240;
          c.getContext('2d').drawImage(v, (v.videoWidth - s) / 2, (v.videoHeight - s) / 2, s, s, 0, 0, 240, 240);
          const data = c.toDataURL('image/jpeg', .72); done = true; stop(); a.close(); res(data);
        } }],
        onMount: async a => {
          const x = $('[data-x]', a.el); const oc = x.onclick; x.onclick = () => { oc(); stop(); if (!done) res(null); };
          try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 480 } }, audio: false }); $('#sf-v', a.el).srcObject = stream; }
          catch (e) { $('#sf-msg', a.el).innerHTML = `<span style="color:var(--danger)">Camera unavailable: ${esc(e.message || 'permission denied')}.</span>`; }
        }
      });
    });
  },
  storeSelfie(empId, data) {
    const id = uid('sfy');
    if (IS_CLOUD && typeof Cloud !== 'undefined') Cloud.extraOps.push({ c: 'files', id, op: 'put', data: { id, empId, kind: 'selfie', name: 'Selfie ' + today(), fileName: id + '.jpg', type: 'image/jpeg', data } });
    else return data; // offline: keep the small JPEG inline on the record
    return id;
  },
  async viewSelfie(ref, title) {
    let src = ref;
    if (!String(ref).startsWith('data:')) { try { src = (await Cloud.api('file?id=' + encodeURIComponent(ref))).data; } catch (e) { return UI.toast(e.message, 'error'); } }
    UI.modal({ title: title || 'Punch selfie', size: 'sm', icon: 'camera', dismissible: true, body: `<img src="${src}" style="width:100%;border-radius:20px;display:block">` });
  },
  state(rec) { return !rec || !rec.in ? 'out' : rec.out ? 'done' : Calc.onBreak(rec) ? 'break' : 'in'; },
  async run(me, kind) {
    const s = S();
    let geo = null, shot = null;
    if (kind === 'in' || kind === 'out') {
      try { geo = await this.geoCheck(); } catch (e) { return UI.toast(e.message, 'error', 8000); }
      if (s.selfie?.required) { shot = await this.selfie(); if (!shot) return UI.toast('Selfie is required to punch.', 'warn'); }
    }
    const snap = d => { const r = Store.att(me.id, d); return r ? `${r.in}|${r.out}|${(r.breaks || []).length}|${JSON.stringify(r.breaks || [])}` : ''; };
    const days = [today(), D.add(today(), -1)], beforeSnap = days.map(snap);

  card(box, me) {

    const elapsed = rec?.in && !rec.out ? Math.max(0, toMin(nowTime()) - toMin(rec.in) + (rec.date < td ? 1440 : 0)) : 0;
    box.innerHTML = `<div class="card hero aura-border" style="padding:26px 28px"><img class="hero-logo" src="${App.logo()}" alt="">
      <div class="punch-stage">
        ${canPunch ? `<button class="hold-btn ${st === 'out' ? '' : st === 'done' ? 'done' : 'out'}" id="hold" ${st === 'done' ? 'disabled' : ''} aria-label="${label[1]}">
          <svg class="ring-svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="94" stroke="rgba(255,255,255,.12)"/><circle id="hold-ring" cx="100" cy="100" r="94" stroke="${st === 'out' ? '#ffe3a1' : '#ffd3c2'}" stroke-linecap="round" stroke-dasharray="590.6" stroke-dashoffset="590.6"/></svg>
          <div class="hb-in">${icon(label[0])}<b>${label[1]}</b><small>${esc(label[2])}</small></div></button>`
        : `<div class="orb" style="width:150px;height:150px"><div class="orb-c"><div><b style="font-size:30px">${x.code === 'P' || x.rec?.in ? '✓' : '—'}</b><small>${esc(STATUS_LABEL[x.code] || '')}</small></div></div></div>`}
        <div style="position:relative;min-width:0">

          <div class="big-clock mt-1" id="self-clock">${fmtTime(nowTime())}</div>

/* =====================================================================
   23-pulse.js — "Pulse" dashboard (management) & personal dashboard
   ===================================================================== */
const Pulse = {
  orb(items, center, sub) {
    const R = 78, C = 2 * Math.PI * R, total = sum(items, i => i.v) || 1; let off = 0;
    const arcs = items.filter(i => i.v > 0).map(i => { const len = Math.max(0, (i.v / total) * C - 3); const a = `<circle class="seg-arc" cx="95" cy="95" r="${R}" fill="none" stroke="${i.c}" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 ${C}" data-da="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 95 95)" style="color:${i.c};transition:stroke-dasharray 1.4s var(--ease)"><title>${esc(i.l)}: ${i.v}</title></circle>`; off += (i.v / total) * C; return a; }).join('');
    return `<div class="orb"><svg viewBox="0 0 190 190">
      <circle cx="95" cy="95" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="12"/>
      <g class="orbit"><circle cx="95" cy="5" r="3" fill="var(--gold-1)"/><circle cx="185" cy="95" r="1.6" fill="var(--cyan)"/></g>
      <g class="orbit2"><circle cx="95" cy="178" r="2.2" fill="var(--violet)"/><circle cx="12" cy="95" r="1.4" fill="var(--gold-2)"/></g>
      <circle cx="95" cy="95" r="94" fill="none" stroke="rgba(242,184,75,.18)" stroke-dasharray="1 7"/>
      ${arcs}</svg><div class="orb-c"><div><b data-count-up>${esc(center)}</b><small>${esc(sub)}</small></div></div></div>`;
  },
  animateOrb(root) { requestAnimationFrame(() => setTimeout(() => $$('.seg-arc', root).forEach(a => a.setAttribute('stroke-dasharray', a.dataset.da)), 60)); },
  presence(emps) {
    const td = today();
    const list = emps.map(e => { const r = Store.att(e.id, td) || (() => { const y = Store.att(e.id, D.add(td, -1)); return y && y.in && !y.out ? y : null; })(); return { e, r }; }).filter(x => x.r && x.r.in).sort((a, b) => cmp(b.r.date + (b.r.out || b.r.in), a.r.date + (a.r.out || a.r.in)));
    if (!list.length) return UI.empty('Nobody has checked in yet', 'Arrivals appear here live.', 'activity');
    return `<div class="presence">${list.slice(0, 40).map(({ e, r }) => { const brk = Calc.onBreak(r); const c = r.out ? 'var(--text-3)' : brk ? 'var(--cyan)' : r.lateMins ? 'var(--warning)' : 'var(--success)'; return `<div class="pres" data-go="#/employees/view/${e.id}" title="${esc(e.name)} · ${r.out ? 'checked out ' + fmtTime(r.out) : brk ? 'on break' : 'at work since ' + fmtTime(r.in)}${r.lateMins ? ' · late ' + fmtDur(r.lateMins) : ''}${r.geo?.in ? (r.geo.in.inside ? ' · on-site' : ' · off-site') : ''}"><span class="av" style="--st:${c};background:${e.photo ? 'none' : avColor(e.code)}">${e.photo ? `<img src="${e.photo}" alt="">` : esc(initials(e.name))}</span><b>${esc(e.name.split(' ')[0])}</b><small>${r.out ? '⏻ ' + fmtTime(r.out) : fmtTime(r.in)}</small></div>`; }).join('')}</div>`;
  },
  lbHTML(rows, n = 5) {
    if (!rows.length) return UI.empty('Not enough data yet', 'Scores appear after a few working days.', 'sparkle');
    return rows.slice(0, n).map((x, i) => `<div class="lb-row"><span class="lb-rank">${i + 1}</span>${UI.person(x.e, `🔥 ${x.s.streak} streak · ${x.s.onTimePct}% on time`)}<span class="lb-score">${x.s.score}</span></div>`).join('');
  },
  insightsHTML(list) {
    return list.length ? list.map(i => `<div class="insight"><div class="in-ic tone-${i.tone}">${icon(i.ic)}</div><div><b>${esc(i.t)}</b><small>${esc(i.s)}</small></div></div>`).join('') : UI.empty('No insights yet', '', 'sparkle');
  }
};

/* ---- 24-kiosk.js ---- */
/* =====================================================================
   24-kiosk.js — factory-gate kiosk: employee ID + PIN check-in/out
   Runs inside an HR / supervisor session (attendance.create). PINs are
   hashed; in the hosted edition they are verified only on the server.
   ===================================================================== */
const Kiosk = {
  feed: [],
  pinHash(pin, salt) { return hashPassword(String(pin), salt); },
  async verify(code, pin) {
    if (IS_CLOUD) { const js = await Cloud.api('kiosk/verify', { method: 'POST', body: { code, pin } }); return Store.emp(js.empId); }
    const emp = Auth.scopedEmps().find(e => String(e.code).toLowerCase() === String(code).toLowerCase());
    if (!emp) throw new Error('Employee ID not recognised.');
    const lock = this._fails = this._fails || {}; const f = lock[emp.id] || { n: 0, until: 0 };
    if (Date.now() < f.until) throw new Error('Too many wrong PINs. This ID is locked for 10 minutes.');
    if (!emp.pin) throw new Error('No kiosk PIN is set for this employee. Ask HR to set one.');
    if (this.pinHash(pin, emp.pin.salt) !== emp.pin.hash) { f.n++; if (f.n >= 5) { f.until = Date.now() + 600000; f.n = 0; } lock[emp.id] = f; throw new Error(`Wrong PIN (${Math.max(0, 5 - f.n)} attempt(s) left).`); }
    lock[emp.id] = { n: 0, until: 0 };
    return emp;
  },
  async setPin(emp, pin) {
    if (IS_CLOUD) { await Cloud.api('kiosk/pin', { method: 'POST', body: pin === null ? { empId: emp.id, clear: true } : { empId: emp.id, pin } }); emp.hasPin = pin !== null; try { Cloud.synced.get('employees')?.set(emp.id, JSON.stringify(emp)); } catch { } return; }
    if (pin === null) delete emp.pin; else { const salt = newSalt(); emp.pin = { salt, hash: this.pinHash(pin, salt) }; }
    Store.log(pin === null ? 'Kiosk PIN cleared' : 'Kiosk PIN set', 'employees', emp.code); Store.save();
  },
  hasPin(emp) { return !!(emp && (emp.pin || emp.hasPin)); },
  expand(code) { // "15" → "IP-0015" (uses the employee ID prefix from Settings)
    const c = String(code).trim(); if (!/^\d+$/.test(c)) return c;
    const pre = S().empCodePrefix || 'IP-'; return pre + c.padStart(4, '0');
  },
  pinModal(emp) {
    if (!(emp.id === Auth.user.empId || Auth.can('employees', 'edit'))) return UI.toast('Permission denied.', 'warn');
    UI.modal({ title: `Kiosk PIN — ${emp.name}`, size: 'sm', icon: 'key',
      body: `<p class="small muted mt-0">Used at the kiosk together with the employee ID <b>${esc(emp.code)}</b>. 4–6 digits. PINs are stored as secure hashes and can never be viewed — only reset.</p><form class="form-grid" style="grid-template-columns:1fr">${F.input('pin', 'New PIN', { type: 'password', required: true, attrs: 'inputmode="numeric" maxlength="6" autocomplete="new-password"' })}${F.input('pin2', 'Confirm PIN', { type: 'password', required: true, attrs: 'inputmode="numeric" maxlength="6" autocomplete="new-password"' })}</form>`,
      footer: [this.hasPin(emp) ? { label: 'Remove PIN', cls: 'btn-ghost', action: async a => { try { await this.setPin(emp, null); a.close(); UI.toast('PIN removed.', 'success'); App.refresh(); } catch (e) { UI.toast(e.message, 'error'); } } } : null, { label: 'Cancel', action: 'close' }, { label: 'Save PIN', cls: 'btn-primary', action: async a => {
        const d = F.read(a.el); if (!F.validate(a.el, d, { pin: v => !/^\d{4,6}$/.test(v) ? '4 to 6 digits.' : /^(\d)\1+$/.test(v) || '0123456789'.includes(v) ? 'Too easy to guess — choose another.' : null, pin2: v => v !== d.pin ? 'PINs do not match.' : null })) return;
        try { await this.setPin(emp, d.pin); a.close(); UI.toast('Kiosk PIN saved.', 'success'); App.refresh(); } catch (e) { UI.toast(e.message, 'error'); }
      } }].filter(Boolean) });
  },
  bulkModal() {
    if (!Auth.guard('employees', 'edit')) return;
    const emps = Auth.scopedEmps(); const without = emps.filter(e => !this.hasPin(e));
    UI.modal({ title: 'Kiosk PINs', size: 'lg', icon: 'key',
      body: `<div class="row mb-3">${UI.badge(`${emps.length - without.length} with PIN`, 'green')} ${UI.badge(`${without.length} without PIN`, without.length ? 'amber' : 'gray')}<span class="spacer"></span><button class="btn btn-sm btn-primary" id="kp-gen" ${without.length ? '' : 'disabled'}>${icon('sparkle')}Generate random PINs for ${without.length} employee(s)</button></div>
        <p class="small muted">Generated PINs are shown <b>once</b> on a printable slip sheet so HR can hand them to employees. They cannot be viewed again afterwards.</p>
        <div class="tbl-wrap" style="max-height:360px"><table class="tbl compact"><thead><tr><th>Employee</th><th>ID</th><th>Department</th><th>PIN</th><th></th></tr></thead><tbody>${emps.map(e => `<tr><td>${esc(e.name)}</td><td class="mono">${esc(e.code)}</td><td>${esc(Store.deptName(e.deptId))}</td><td>${this.hasPin(e) ? UI.badge('Set', 'green', true) : UI.badge('Not set', 'amber')}</td><td class="actions"><button class="btn btn-xs" data-pin="${e.id}">${icon('key')}${this.hasPin(e) ? 'Reset' : 'Set'}</button></td></tr>`).join('')}</tbody></table></div>`,
      onMount: m => {
        $$('[data-pin]', m.el).forEach(b => b.onclick = () => { m.close(); this.pinModal(Store.emp(b.dataset.pin)); });
        const g = $('#kp-gen', m.el); if (g) g.onclick = async () => {
          if (!(await UI.confirm({ title: 'Generate PINs?', message: `Create random 4-digit PINs for ${without.length} employee(s). You will get a print-out to distribute them.`, ok: 'Generate' }))) return;
          g.disabled = true; const out = [];
          for (const e of without) { let p; do { p = String(Math.floor(1000 + Math.random() * 9000)); } while (/^(\d)\1+$/.test(p)); try { await this.setPin(e, p); out.push([e, p]); g.innerHTML = `${icon('refresh')}${out.length}/${without.length}…`; } catch (err) { UI.toast(`${e.code}: ${err.message}`, 'error'); } }
          m.close(); UI.toast(`${out.length} PIN(s) created.`, 'success');
          const html = Printer.header('Kiosk PIN slips', 'Cut along the lines and hand each slip to the employee. Keep confidential.') + `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${out.map(([e, p]) => `<div style="border:1px dashed #999;border-radius:8px;padding:10px;font-size:11px"><b style="font-size:12px">${esc(e.name)}</b><br>${esc(Store.deptName(e.deptId))}<br>Employee ID: <b>${esc(e.code)}</b><br>Kiosk PIN: <b style="font-size:16px;letter-spacing:3px">${p}</b></div>`).join('')}</div>` + Printer.footer();
          Printer.run(html); Store.log('Kiosk PINs generated', 'employees', `${out.length} employees`); Store.save(); App.refresh();
        };
      } });
  }
};

    let stage = 'code', code = '', pin = '', busy = false, timer = null;
    const pad = $('#k-pad', K);
    const feed = () => { $('#k-feed', K).innerHTML = Kiosk.feed.slice(0, 6).map(f => `<div class="kf">${UI.avatar(f.e, 'md')}<div style="flex:1;min-width:0"><b>${esc(f.e.name)}</b><div class="small muted">${f.kind === 'in' ? 'Checked in' : 'Checked out'} · ${fmtTime(f.t)}${f.late ? ' · late ' + fmtDur(f.late) : ''}</div></div>${UI.badge(f.kind === 'in' ? 'IN' : 'OUT', f.kind === 'in' ? 'green' : 'gold')}</div>`).join(''); };
    const draw = (msg = '', tone = '') => {
      const dots = Array.from({ length: 6 }, (_, i) => `<span class="dotpin ${i < pin.length ? 'on' : ''}"></span>`).join('');
      pad.innerHTML = `<div class="center mb-2"><h3 style="font-size:20px">${stage === 'code' ? 'Enter your employee number' : 'Enter your PIN'}</h3><div class="small muted">${stage === 'code' ? `Example: 15 → ${esc(Kiosk.expand('15'))}` : esc(Kiosk.expand(code))}</div></div>
        <div class="k-display focus">${stage === 'code' ? (code ? esc(Kiosk.expand(code)) : '<span class="muted" style="font-size:18px;letter-spacing:0">Type number…</span>') : dots}</div>
        <div class="small center" style="min-height:20px;color:var(--${tone || 'text-3'})">${esc(msg)}</div>
        <div class="k-keys">${['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'OK'].map(k => `<button data-k="${k}" class="${k === 'OK' ? 'go' : ''}">${k === 'C' ? '⌫' : k === 'OK' ? (stage === 'code' ? 'Next' : 'Punch') : k}</button>`).join('')}</div>
        ${stage === 'pin' ? `<button class="btn btn-ghost btn-block mt-2" data-k="back">← Different ID</button>` : ''}`;
      $$('[data-k]', pad).forEach(b => b.onclick = () => press(b.dataset.k));
    };
    const reset = (msg, tone) => { clearTimeout(timer); stage = 'code'; code = ''; pin = ''; busy = false; draw(msg, tone); };
    const result = (emp, kind, rec) => {
      const late = kind === 'in' ? rec.lateMins : 0;
      pad.innerHTML = `<div class="k-result">${UI.avatar(emp)}<div class="eyebrow">${kind === 'in' ? 'Checked in' : 'Checked out'} · ${fmtTime(kind === 'in' ? rec.in : rec.out)}</div><h2 style="font-size:28px;margin-top:6px">${kind === 'in' ? 'Welcome' : 'Goodbye'}, ${esc(emp.name.split(' ')[0])}!</h2>
        <p class="muted">${kind === 'in' ? (late ? `You are ${fmtDur(late)} late today.` : 'Right on time — have a great shift.') : `You worked ${fmtDur(rec.workMins, '0m')} today.${rec.otMins ? ' Overtime ' + fmtDur(rec.otMins) + '.' : ''}`}</p>
        <div class="chips" style="justify-content:center">${UI.badge(Calc.shiftFor(emp, today()).name, 'gold')}${late ? UI.badge('Late ' + fmtDur(late), 'amber') : UI.badge('On time', 'green')}</div></div>`;
      const av = $('.k-result .av', pad); if (av) av.classList.add('lg');
      Aura.confetti(80); if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
      Kiosk.feed.unshift({ e: emp, kind, t: kind === 'in' ? rec.in : rec.out, late }); feed();
      timer = setTimeout(() => reset(), 4500);
    };
    const press = async k => {
      if (busy) return;
      if (k === 'back') return reset();
      if (stage === 'code') {
        if (k === 'C') code = code.slice(0, -1); else if (k === 'OK') { if (!code) return draw('Type your employee number first.', 'warning'); stage = 'pin'; } else if (code.length < 6) code += k;
        return draw();
      }
      if (k === 'C') { pin = pin.slice(0, -1); return draw(); }
      if (k !== 'OK') { if (pin.length < 6) pin += k; return draw(); }
      if (pin.length < 4) return draw('PIN is at least 4 digits.', 'warning');
      busy = true; draw('Verifying…', 'text-2');
      try {
        const emp = await Kiosk.verify(Kiosk.expand(code), pin);
        const td = today(); const r0 = Store.att(emp.id, td); const y = Store.att(emp.id, D.add(td, -1));
        const kind = (r0 && r0.in && !r0.out) || (!r0 && y && y.in && !y.out) ? 'out' : (r0 && r0.out) ? null : 'in';
        if (!kind) { busy = false; return reset(`${emp.name.split(' ')[0]}, you already checked out today at ${fmtTime(r0.out)}.`, 'warning'); }
        Att.punch(emp.id, kind);
        const rec = kind === 'in' ? Store.att(emp.id, td) : (Store.att(emp.id, td)?.out ? Store.att(emp.id, td) : Store.att(emp.id, D.add(td, -1)));
        if (!rec || (kind === 'in' && !rec.in) || (kind === 'out' && !rec.out)) { busy = false; return reset('Punch could not be recorded. Please see HR.', 'danger'); }
        rec.source = 'kiosk'; Att.addLog(rec, 'Kiosk', `${kind} via kiosk (${Auth.user.username})`); Store.save();
        result(emp, kind, rec);
      } catch (e) { busy = false; pin = ''; draw(e.message, 'danger'); if (navigator.vibrate) navigator.vibrate(120); }
    };
    const keyH = e => { if (!$('#kiosk')) return document.removeEventListener('keydown', keyH); if (UI.stack.length) return; if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('C'); else if (e.key === 'Enter') press('OK'); else if (e.key === 'Escape') { e.stopPropagation(); exit(); } };
    document.addEventListener('keydown', keyH, true);
    const exit = () => {
      UI.modal({ title: 'Exit kiosk', size: 'sm', icon: 'lock', body: `<p class="small muted mt-0">Enter the password of <b>${esc(Auth.user.username)}</b> to leave kiosk mode.</p>${F.input('pw', 'Password', { type: 'password', attrs: 'autocomplete="current-password"' })}`,
        footer: [{ label: 'Stay in kiosk', action: 'close' }, { label: 'Exit', cls: 'btn-primary', action: async a => {
          const pw = $('[name=pw]', a.el).value; let ok = false;
          if (IS_CLOUD) { try { await Cloud.api('auth/login', { method: 'POST', body: { username: Auth.user.username, password: pw } }); ok = true; } catch (e) { ok = false; } }
          else ok = hashPassword(pw, Auth.user.salt) === Auth.user.hash;
          if (!ok) return UI.toast('Incorrect password.', 'error');
          a.close(); clearTimeout(timer); document.removeEventListener('keydown', keyH, true); K.remove(); try { document.fullscreenElement && document.exitFullscreen(); } catch { } App.refresh();
        } }] });
    };
    $('#k-exit', K).onclick = exit;
    const alive = setInterval(() => { if (!$('#kiosk')) return clearInterval(alive); Auth.touch(); }, 60000); // a kiosk stays signed in while open
    draw(); feed();
  }
};

Pages.wall = {
  title: 'Live Wall', module: 'attendance', visible: () => !Auth.isSelf(),
  dept: '',
  render(el) {
    if (Auth.isSelf()) { el.innerHTML = UI.empty('Not available', '', 'lock'); return; }
    el.innerHTML = pageHead('Live Wall', 'A real-time presence board for a TV in the HR office or production floor.', `<button class="btn btn-gold" id="lw-go">${icon('activity')}Open full-screen wall</button>`) + '<div id="lw-prev"></div>';
    $('#lw-go').onclick = () => this.open();
    this.paint($('#lw-prev'), false);
  },
  tiles(emps) {
    const td = today();
    const order = { working: 0, break: 1, late: 0, out: 2, leave: 3, absent: 4, pending: 5, off: 6 };
    return emps.map(e => {
      const x = Calc.day(e, td, td); const r = x.rec || (() => { const y = Store.att(e.id, D.add(td, -1)); return y && y.in && !y.out ? y : null; })();
      let st = 'pending', label = 'Not yet in', c = 'var(--text-3)';
      if (r && r.in && !r.out) { const b = Calc.onBreak(r); st = b ? 'break' : 'working'; label = b ? 'On break' : `In since ${fmtTime(r.in)}`; c = b ? 'var(--cyan)' : r.lateMins ? 'var(--warning)' : 'var(--success)'; }
      else if (r && r.out) { st = 'out'; label = `Out ${fmtTime(r.out)}`; c = 'var(--violet-c)'; }
      else if (x.code === 'L') { st = 'leave'; label = 'On leave'; c = 'var(--info)'; }
      else if (x.code === 'H' || x.code === 'WO') { st = 'off'; label = x.code === 'H' ? 'Holiday' : 'Weekly off'; c = 'var(--text-3)'; }
      else if (x.code === 'A' || (x.rec && x.rec.status === 'A')) { st = 'absent'; label = 'Absent'; c = 'var(--danger)'; }
      return { e, r, st, label, c, late: r?.lateMins || 0 };
    }).sort((a, b) => (order[a.st] - order[b.st]) || cmp(a.e.name, b.e.name));
  },
  paint(box, full) {
    const emps = Auth.scopedEmps().filter(e => !this.dept || e.deptId === this.dept);
    const snap = Calc.todaySnapshot(emps); const tiles = this.tiles(emps);
    const recent = tiles.filter(t => t.r && t.r.in).map(t => ({ t, at: t.r.out || t.r.in, kind: t.r.out ? 'out' : 'in' })).sort((a, b) => cmp(b.at, a.at)).slice(0, 14);
    box.innerHTML = `${full ? `<div class="row between mb-3"><div class="row"><img src="${App.logo()}" style="width:70px" alt=""><div><div class="eyebrow"><span class="live-dot"></span>Live presence wall</div><h2 style="font-size:26px">${esc(S().company.name)}</h2></div></div>
        <div class="row"><select class="inp" id="lw-dept" style="width:auto">${UI.deptOptions(this.dept)}</select><div class="right"><div class="wall-big" id="wall-clock" style="font-size:44px">${fmtTime(nowTime())}</div><div class="muted small">${DOW[D.dow(today())]}, ${fmtDate(today(), 'DD MMM YYYY')}</div></div><button class="btn btn-ghost" id="lw-x">${icon('x')}Exit</button></div></div>` : ''}
      <div class="grid g-4 mb-3 stagger">${[['Present', snap.present, 'success'], ['Late', snap.late, 'warning'], ['Absent / not in', snap.absent + snap.notMarked, 'danger'], ['Attendance', snap.pct + '%', 'gold-2']].map(([k, v, c]) => `<div class="card" style="padding:18px 20px"><div class="eyebrow" style="color:var(--${c})">${k}</div><div class="wall-big mt-1" data-count-up style="color:var(--${c})">${v}</div></div>`).join('')}</div>
      ${recent.length ? `<div class="ticker mb-3"><div>${recent.map(x => `<span>${x.kind === 'in' ? '▲' : '▼'} <b>${esc(x.t.e.name)}</b> ${x.kind === 'in' ? 'checked in' : 'checked out'} at ${fmtTime(x.at)}</span>`).join('')}</div></div>` : ''}
      <div class="wall-grid">${tiles.map((t, i) => `<div class="wall-tile" style="--wc:${t.c};animation-delay:${Math.min(i * 18, 700)}ms">${UI.avatar(t.e)}<b>${esc(t.e.name)}</b><small>${esc(Store.deptName(t.e.deptId))}</small><div class="wt-st"><span class="badge" style="color:${t.c};background:color-mix(in srgb, ${t.c} 14%, transparent);border-color:color-mix(in srgb, ${t.c} 30%, transparent)">${t.st === 'working' || t.st === 'break' ? '<span class="live-dot" style="background:currentColor;width:6px;height:6px"></span>' : ''}${esc(t.label)}</span>${t.late ? `<div class="tiny mt-1" style="color:var(--warning)">late ${fmtDur(t.late)}</div>` : ''}</div></div>`).join('')}</div>`;
    Aura.countUp(box);
    const d = $('#lw-dept', box); if (d) d.onchange = () => { this.dept = d.value; this.paint(box, true); };
    const x = $('#lw-x', box); if (x) x.onclick = () => this.close();
  },
  open() {
    const W = document.createElement('div'); W.className = 'wall'; W.id = 'wall'; document.body.appendChild(W);
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => { }); } catch { }
    this.paint(W, true);
    this.timer = setInterval(() => { if (!$('#wall')) return clearInterval(this.timer); Auth.touch(); if (IS_CLOUD && typeof Cloud !== 'undefined') Cloud.pull(); if (!$('#lw-dept:focus')) this.paint(W, true); }, 30000);
    this.esc = e => { if (e.key === 'Escape' && $('#wall')) { e.stopPropagation(); this.close(); } };
    document.addEventListener('keydown', this.esc, true);
  },
  close() { clearInterval(this.timer); document.removeEventListener('keydown', this.esc, true); const w = $('#wall'); if (w) w.remove(); try { document.fullscreenElement && document.exitFullscreen(); } catch { } App.refresh(); }
};

      <div class="card"><div class="card-h"><h3>My heatmap</h3></div><div class="card-b">${Insight.heatHTML(Insight.personalHeat(me, 140))}</div></div>`;
  }
};

/* ---- 30-cloud.js ---- */
/* =====================================================================
   30-cloud.js — CLOUD MODE (Vercel + serverless API + Upstash Redis)
   Active only in the hosted build (IPK_CLOUD = true). Replaces local
   storage with the server: sign-in, data loading, change sync, polling,
   users, documents, backup / restore. The server re-checks every change
   against the user's role, so the browser is never trusted.
   ===================================================================== */
const Cloud = {
  ver: 0, epoch: '', synced: new Map(), inflight: false, again: false, timer: null, poll: null,
  extraOps: [], state: 'saved', status: null, lastSyncAt: null, uiStale: false,

  async api(path, { method = 'GET', body } = {}) {
    let r;
    try {
      r = await fetch('/api/' + path, { method, credentials: 'same-origin', headers: method === 'GET' ? {} : { 'Content-Type': 'application/json', 'x-ipk': '1' }, body: body ? JSON.stringify(body) : undefined });
    } catch (e) { const err = new Error('Cannot reach the server. Check the internet connection.'); err.offline = true; throw err; }
    let js = {}; try { js = await r.json(); } catch { }
    if (!r.ok) { const e = new Error(js.error || `Server error (${r.status})`); e.status = r.status; throw e; }
    return js;
  },

  /* ---------- snapshot & diff ---------- */
  ARR: ['roles', 'departments', 'designations', 'shifts', 'rotations', 'employees', 'attendance', 'corrections', 'shiftRequests', 'leaveTypes', 'leaves', 'leaveAdjust', 'encashments', 'holidays', 'specialDays', 'payrollRuns', 'loans', 'payItems', 'notifications', 'audit'],
  records(c) {
    const db = Store.db; const m = new Map();
    if (c === 'settings') { m.set('main', db.settings); return m; }
    if (c === 'notifRead') { const own = (db.notifRead || {})[Auth.user?.id]; if (own) m.set(Auth.user.id, { id: Auth.user.id, ids: own }); return m; }
    (db[c] || []).forEach(r => { if (r && r.id) m.set(String(r.id), r); });
    return m;
  },
  colls() { return [...this.ARR, 'settings', 'notifRead']; },
  snapshot() { this.synced = new Map(); this.colls().forEach(c => { const s = new Map(); this.records(c).forEach((r, id) => s.set(id, JSON.stringify(r))); this.synced.set(c, s); }); },
  diff() {
    const ops = [];
    this.colls().forEach(c => {
      const cur = this.records(c), old = this.synced.get(c) || new Map();
      cur.forEach((r, id) => { const s = JSON.stringify(r); if (old.get(id) !== s) ops.push({ c, id, op: 'put', data: r, _s: s }); });
      if (c !== 'audit' && c !== 'notifications') old.forEach((_, id) => { if (!cur.has(id)) ops.push({ c, id, op: 'del' }); });
    });
    return ops;
  },
  pending() { return this.diff().length + this.extraOps.length; },

  /* ---------- save queue ---------- */
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 120); this.setState('saving'); },
  setState(s, msg) {
    this.state = s; const el = $('#tb-sync'); if (!el) return;
    const map = { saved: ['b-green', 'checkCircle', 'Saved'], saving: ['b-amber', 'refresh', 'Saving…'], offline: ['b-red', 'alert', 'Offline — will retry'], error: ['b-red', 'alert', 'Not saved'] };
    const [cls, ic, txt] = map[s] || map.saved;
    el.className = 'badge ' + cls; el.innerHTML = icon(ic) + esc(msg || txt); el.classList.remove('hidden');
    el.title = this.lastSyncAt ? 'Last saved ' + new Date(this.lastSyncAt).toLocaleTimeString('en-GB', { timeZone: tz() }) : '';
  },
  async flush() {
    if (!Auth.user) return;
    if (this.inflight) { this.again = true; return; }
    const ops = this.diff().concat(this.extraOps.splice(0));
    if (!ops.length) { this.setState('saved'); return; }
    this.inflight = true; this.setState('saving');
    const send = ops.map(({ _s, ...o }) => o);
    try {
      // send in batches that stay below the 4.5 MB serverless request limit
      let batch = [], size = 0, res;
      const post = async () => { if (!batch.length) return; res = await this.api('sync', { method: 'POST', body: { ops: batch } }); if (res.ver) this.ver = Math.max(this.ver, res.ver); (res.adjusted || []).forEach(id => { const r = Store.db.attendance.find(x => x.id === id); if (r && r.approval !== 'pending') r.approval = 'pending'; }); batch = []; size = 0; };
      for (const o of send) { const s = o.data ? JSON.stringify(o.data).length : 50; if (size + s > 3000000) await post(); batch.push(o); size += s; }
      await post();
      ops.forEach(o => { if (o.c === 'files') return; const m = this.synced.get(o.c) || new Map(); if (o.op === 'del') m.delete(o.id); else m.set(o.id, JSON.stringify(o.data)); this.synced.set(o.c, m); });
      this.lastSyncAt = Date.now(); this.setState('saved');
    } catch (e) {
      if (e.offline) { this.extraOps.unshift(...ops.filter(o => o.c === 'files')); this.setState('offline'); setTimeout(() => this.flush(), 8000); }
      else if (e.status === 401) { this.inflight = false; UI.toast('Your session has ended. Please sign in again.', 'warn', 6000); return this.localLogout('Session expired'); }
      else { this.setState('error'); UI.toast(`Not saved: ${e.message} Your screen has been refreshed with the latest server data.`, 'error', 9000); await this.reload(); App.refresh(); }
    } finally { this.inflight = false; }
    if (this.again) { this.again = false; this.flush(); }
  },

  /* ---------- loading & polling ---------- */
  async reload() {
    const js = await this.api('data');
    const db = Object.assign(Defaults.db(), js.db);
    db.notifRead = js.db.notifRead || {};
    Store.db = db; Store.migrate(); Store.reindex();
    this.ver = js.ver; this.epoch = js.epoch; this.snapshot();
    const u = Store.user(js.user.id) || js.user; if (!Store.user(u.id)) Store.db.users.push(u);
    Auth.set(Store.user(u.id));
    try { const th = localStorage.getItem('ipk_theme_' + u.id); if (th) Auth.user.theme = th; } catch { }
    return js;
  },
  safeToRender() {
    if (UI.stack.length || $('.dropdown')) return false;
    const a = document.activeElement; if (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName) && a.id !== 'tb-q') return false;
    const r = Router.current?.route, x = Router.current?.args?.[0];
    if (r === 'employees' && (x === 'new' || x === 'edit')) return false;
    if (r === 'settings') return false;
    return true;
  },
  startPolling() {
    clearInterval(this.poll);
    this.poll = setInterval(() => { if (document.visibilityState === 'visible') this.pull(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Auth.user) this.pull(); });
  },
  async pull() {
    if (!Auth.user || this.inflight || this.pulling) return;
    if (this.uiStale && this.safeToRender()) { this.uiStale = false; Router.render(); }
    this.pulling = true;
    try {
      const js = await this.api(`changes?since=${this.ver}&epoch=${encodeURIComponent(this.epoch)}`);
      if (js.reload) {
        if (this.pending()) return;
        await this.reload(); App.renderShell(); if (this.safeToRender()) Router.render(); else this.uiStale = true;
        return;
      }
      let changed = false;
      Object.entries(js.put || {}).forEach(([c, list]) => list.forEach(r => { if (this.applyRemote(c, r.id, r)) changed = true; }));
      Object.entries(js.del || {}).forEach(([c, ids]) => ids.forEach(id => { if (this.applyRemote(c, id, null)) changed = true; }));
      this.ver = js.ver;
      if (js.user && js.user.id === Auth.user.id) { if (js.user.role !== Auth.user.role || js.user.active === false) { await this.reload(); App.renderShell(); changed = true; } }
      if (changed) { Store.reindex(); App.updateBadges(); if (this.safeToRender()) Router.render(); else this.uiStale = true; }
      if (this.state === 'offline') this.flush();
    } catch (e) {
      if (e.status === 401) return this.localLogout('Session expired');
      if (e.offline) this.setState('offline');
    } finally { this.pulling = false; }
  },
  applyRemote(c, id, r) {
    const db = Store.db; id = String(id);
    if (c === 'users') { const i = db.users.findIndex(x => x.id === id); if (r) { if (i >= 0) db.users[i] = Object.assign(db.users[i], r); else db.users.push(r); } else if (i >= 0) db.users.splice(i, 1); return true; }
    if (c === 'meta') { if (r) db.meta = r; return true; }
    const syncedMap = this.synced.get(c) || new Map();
    const cur = this.records(c).get(id);
    const curS = cur ? JSON.stringify(cur) : undefined;
    if (curS !== syncedMap.get(id)) return false; // local unsaved edit wins; it will be sent next
    if (c === 'settings') { if (r) { db.settings = Object.assign(Defaults.settings(), r); syncedMap.set('main', JSON.stringify(db.settings)); } return true; }
    if (c === 'notifRead') { if (r) { db.notifRead[id] = r.ids; syncedMap.set(id, JSON.stringify({ id, ids: r.ids })); } return true; }
    const arr = db[c]; if (!arr) return false;
    const i = arr.findIndex(x => x.id === id);
    if (r) { if (i >= 0) arr[i] = r; else arr.push(r); syncedMap.set(id, JSON.stringify(r)); }
    else { if (i >= 0) arr.splice(i, 1); syncedMap.delete(id); }
    this.synced.set(c, syncedMap);
    return true;
  },
  localLogout(reason) {
    clearInterval(this.poll); Auth.user = null; Auth.role = null; UI.stack.slice().forEach(m => m.close());
    App.showLogin(reason ? `${reason}. Please sign in again.` : '');
  },

  /* ---------- screens ---------- */
  loading(msg) {

  },

  },
  setupScreen() {

        ${F.input('username', 'Administrator username', { value: 'admin', required: true })}${F.input('name', 'Administrator full name', { required: true })}

        <div class="fld full hidden" id="su-file"><button type="button" class="btn btn-sm" id="su-pick">${icon('upload')}Choose backup file</button> <span class="small muted" id="su-fn"></span></div>
      </form><div id="su-err" class="alert danger mt-2 hidden"></div><button class="btn btn-gold btn-block mt-3" id="su-go">${icon('check')}Complete setup</button>`;

  emptyDb() {

    db.shifts = [{ id: 'sh_gen', code: 'GEN', name: 'General Shift', type: 'fixed', start: '09:00', end: '17:30', breakMins: 30, breakPaid: false, graceMins: null, earlyGraceMins: null, otAllowed: true, weeklyOffs: null, color: '#5cc8ff', active: true }];

  },
  /* upload a whole database through the staged import endpoints */
  async upload(db, call, admin, label, keepSelf = false) {
    const ops = [];
    const files = [];
    this.ARR.forEach(c => (db[c] || []).forEach(r => {
      if (!r || !r.id) return;
      if (c === 'employees') { r = clone(r); (r.documents || []).forEach(x => { if (x.data) { files.push({ c: 'files', id: x.id, data: { id: x.id, empId: r.id, name: x.name, fileName: x.fileName || x.name, data: x.data } }); x.fileId = x.id; delete x.data; } }); }
      ops.push({ c, id: String(r.id), data: r });
    }));
    ops.push({ c: 'settings', id: 'main', data: db.settings || Defaults.settings() });
    ops.push({ c: 'meta', id: 'main', data: Object.assign({}, db.meta || {}, { importedAt: new Date().toISOString() }) });
    Object.entries(db.notifRead || {}).forEach(([id, ids]) => ops.push({ c: 'notifRead', id, data: { id, ids } }));
    (db.users || []).forEach(u => ops.push({ c: 'users', id: u.id, data: u }));
    (db.files || []).forEach(f => files.push({ c: 'files', id: f.id, data: f }));
    const all = ops.concat(files);
    await call({ phase: 'begin' });
    let batch = [], size = 0;
    for (const o of all) { const s = JSON.stringify(o).length; if (size + s > 2500000 && batch.length) { await call({ phase: 'chunk', ops: batch }); batch = []; size = 0; } batch.push(o); size += s; }
    if (batch.length) await call({ phase: 'chunk', ops: batch });
    await call({ phase: 'commit', admin, label, keepSelf, note: `${(db.employees || []).length} employees, ${(db.attendance || []).length} attendance records` });
  },

  /* ---------- install overrides ---------- */
  install() {
    Store.load = () => { };
    Store.save = function () { Cloud.schedule(); return true; };
    Store.usage = () => 0;

    Auth.restore = () => false;
    Auth.login = async (username, password) => {
      try { await Cloud.api('auth/login', { method: 'POST', body: { username, password } }); await Cloud.reload(); Cloud.startPolling(); return { ok: true }; }
      catch (e) { return { ok: false, msg: e.message }; }
    };
    Auth.logout = async (reason) => {
      if (Cloud.pending() && Auth.user) { try { await Cloud.flush(); } catch { } }
      try { await Cloud.api('auth/logout', { method: 'POST', body: { reason: reason || '' } }); } catch { }
      Cloud.localLogout(reason && reason.includes('inactiv') ? 'You were signed out after a period of inactivity' : '');
    };

    App.boot = async function () {
      document.addEventListener('keydown', e => this.keys(e));
      ['click', 'keydown', 'mousemove', 'touchstart'].forEach(ev => document.addEventListener(ev, debounce(() => Auth.user && Auth.touch(), 1000), { passive: true }));
      setInterval(() => Auth.checkTimeout(), 20000);
      window.addEventListener('hashchange', () => Router.render());
      window.addEventListener('beforeunload', e => { if (Auth.user && Cloud.pending()) { Cloud.flush(); e.preventDefault(); e.returnValue = ''; } });
      Store.db = Defaults.db();
      Cloud.loading('Connecting to server…');
      let st;
      try { st = await Cloud.api('setup/status'); } catch (e) { return Cloud.configError({ message: e.message }); }
      Cloud.status = st;
      if (!st.configured) return Cloud.configError(st);
      if (st.company) Object.assign(Store.db.settings.company, { name: st.company.name, logo: st.company.logo });
      if (st.security) Store.db.settings.security = Object.assign(Store.db.settings.security, st.security);
      Store.db.meta.demo = !!st.demo;
      if (st.needsSetup) return Cloud.setupScreen();
      try { await Cloud.api('auth/me'); await Cloud.reload(); Cloud.startPolling(); App.showApp(); }
      catch (e) { App.showLogin(e.status === 401 ? '' : e.message); }
    };
    const origShowLogin = App.showLogin.bind(App);
    App.showLogin = function (msg) {
      if (!Auth.user && Cloud.status) {
        Store.db = Defaults.db();
        if (Cloud.status.company) Object.assign(Store.db.settings.company, Cloud.status.company);
        Store.db.meta.demo = !!Cloud.status.demo;
        if (Cloud.status.demo) Store.db.users = ['hr.manager:hr_manager', 'hr.officer:hr_officer', 'prod.manager:dept_manager', 'supervisor:supervisor', 'payroll:payroll_officer', 'employee:employee'].map(x => { const [username, role] = x.split(':'); return { username, role, demo: true, active: true }; });
      }
      origShowLogin(msg);
      $$('#login [data-p]').forEach(b => { if (b.dataset.p === 'Admin@1234') b.dataset.p = ''; });
    };
    const origShowApp = App.showApp.bind(App);
    App.showApp = function () { origShowApp(); Cloud.setState('saved'); };
    App.applyTheme = function () {
      let t = (Auth.user && Auth.user.theme) || S().theme || 'light';
      if (t === 'system') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    };
    App.toggleTheme = function () {
      const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      Auth.user.theme = t; try { localStorage.setItem('ipk_theme_' + Auth.user.id, t); } catch { }
      Cloud.api('users', { method: 'POST', body: { action: 'theme', theme: t } }).catch(() => { });
      this.applyTheme(); $('#tb-theme').innerHTML = icon(t === 'dark' ? 'sun' : 'moon'); if (Router.current) Router.render();
    };
    App.changePassword = function (forced = false) {
      UI.modal({
        title: forced ? 'Set a new password' : 'Change password', size: 'sm', icon: 'key',
        body: `${forced ? `<div class="alert warn mb-3">${icon('alert')}<div>For security you must set a new password before continuing.</div></div>` : ''}<div class="form-grid" style="grid-template-columns:1fr">${F.input('cur', 'Current password', { type: 'password', required: true, attrs: 'autocomplete="current-password"' })}${F.input('pw1', 'New password', { type: 'password', required: true, hint: 'At least 8 characters with letters and numbers. Other sessions will be signed out.', attrs: 'autocomplete="new-password"' })}${F.input('pw2', 'Confirm new password', { type: 'password', required: true, attrs: 'autocomplete="new-password"' })}</div>`,
        footer: [forced ? { label: 'Sign out', action: m => { m.close(); Auth.logout(); } } : { label: 'Cancel', action: 'close' },
          { label: 'Update password', cls: 'btn-primary', action: async m => {
            const d = F.read(m.el);
            if (!F.validate(m.el, d, { cur: F.req('Current password'), pw1: v => !V.password(v) ? 'Use at least 8 characters including letters and numbers.' : null, pw2: v => v !== d.pw1 ? 'Passwords do not match.' : null })) return;
            try { const js = await Cloud.api('auth/change-password', { method: 'POST', body: { current: d.cur, password: d.pw1 } }); Object.assign(Auth.user, js.user); m.close(); UI.toast('Password updated successfully.', 'success'); }
            catch (e) { UI.toast(e.message, 'error'); }
          } }]
      });
    };

    UsersApi.save = async (u, f, pw, mustChange) => {
      try {
        const js = await Cloud.api('users', { method: 'POST', body: u ? { action: 'update', id: u.id, user: f } : { action: 'create', user: f, password: pw, mustChange } });
        const i = Store.db.users.findIndex(x => x.id === js.user.id);
        if (i >= 0) Store.db.users[i] = js.user; else Store.db.users.push(js.user);
        return Store.user(js.user.id);
      } catch (e) { UI.toast(e.message, 'error', 6000); return null; }
    };
    UsersApi.reset = async (u, pw, mustChange, unlock) => {
      try { const js = await Cloud.api('users', { method: 'POST', body: { action: 'reset', id: u.id, password: pw, mustChange, unlock } }); Object.assign(u, js.user); return true; }
      catch (e) { UI.toast(e.message, 'error', 6000); return false; }
    };
    UsersApi.remove = async (u) => {
      try { await Cloud.api('users', { method: 'POST', body: { action: 'delete', id: u.id } }); Store.db.users = Store.db.users.filter(x => x.id !== u.id); return true; }
      catch (e) { UI.toast(e.message, 'error', 6000); return false; }
    };

    Docs.maxBytes = 600 * 1024;
    Docs.note = 'Files are stored securely in the company cloud database (max 600 KB each). For larger scans, keep originals on the company file server and record the reference here.';
    Docs.attach = async (emp, doc, file) => {
      const data = await UI.readFile(file, 'dataURL');
      doc.size = file.size; doc.fileName = file.name; doc.fileId = doc.id;
      Cloud.extraOps.push({ c: 'files', id: doc.id, op: 'put', data: { id: doc.id, empId: emp.id, name: doc.name, fileName: file.name, type: file.type, data } });
    };
    Docs.download = async (d) => {
      try {
        const href = d.data || (await Cloud.api('file?id=' + encodeURIComponent(d.fileId || d.id))).data;
        const a = document.createElement('a'); a.href = href; a.download = d.fileName || d.name; a.click();
      } catch (e) { UI.toast(e.message, 'error'); }
    };
    Docs.remove = (emp, d) => { if (d.fileId) Cloud.extraOps.push({ c: 'files', id: d.fileId, op: 'del' }); };

    Pages.backup.backup = async function () {
      try {
        UI.toast('Preparing backup…', 'info', 2500);
        const js = await Cloud.api('admin/backup');
        S().lastBackupAt = new Date().toISOString(); Store.save();
        UI.downloadBlob(new Blob([JSON.stringify(js)], { type: 'application/json' }), `IdealAura_Backup_${today()}_${nowTime().replace(':', '')}.json`);
        UI.toast('Backup downloaded. Keep it in a safe place — it contains confidential salary and CNIC data.', 'success', 7000); App.refresh();
      } catch (e) { UI.toast(e.message, 'error'); }
    };
    Pages.backup.replaceAll = async function (db, o = {}) {
      if (Auth.role?.id !== 'super_admin') return UI.toast('Only a Super Administrator can replace the database.', 'warn');
      const m = UI.modal({ title: 'Uploading data to the server…', size: 'sm', body: `<p class="muted">Please keep this window open.</p><div class="progress"><div style="width:60%"></div></div>`, footer: false });
      try {
        if (db.meta?.demo) db.users = (db.users || []).filter(u => u.role !== 'super_admin');
        await Cloud.upload(db, body => Cloud.api('admin/import', { method: 'POST', body }), o.admin || null, o.label, !o.admin);
        m.close(); try { await Cloud.api('auth/logout', { method: 'POST', body: { reason: o.label } }); } catch { }
        Cloud.status.demo = !!db.meta?.demo;
        Cloud.localLogout(o.label || 'Data replaced');
      } catch (e) { m.close(); UI.toast(e.message, 'error', 9000); }
    };
    Pages.backup.purgeAudit = async function () { try { const js = await Cloud.api('admin/purge-audit', { method: 'POST', body: { keep: 500 } }); UI.toast(`${js.removed} old audit entries removed.`, 'success'); await Cloud.reload(); } catch (e) { UI.toast(e.message, 'error'); } };
    const origNotes = Pages.backup.securityNotes;
    Pages.backup.securityNotes = function () {
      return `<div class="alert info mb-2">${icon('shield')}<div class="alert-body"><b>How this hosted version protects your data</b><ul style="margin:6px 0 0;padding-left:18px">
        <li>Data is stored in your company's private cloud database (Upstash Redis, connected through Vercel) and shared by all authorised users.</li>
        <li>Passwords are hashed on the server with <b>scrypt</b>; sessions use signed, HttpOnly, Secure cookies that expire after 12 hours.</li>
        <li>The server re-checks <b>every change</b> against the user's role and data scope — a department manager cannot read or change another department, and salaries are only sent to payroll-authorised users.</li>
        <li>All traffic is encrypted (HTTPS). Repeated failed sign-ins lock the account and are rate-limited per network.</li>
        <li>Still take a <b>JSON backup weekly</b> and keep it off-site; Upstash free plans do not include point-in-time restore.</li></ul></div></div>`;
    };
    const origRender = Pages.backup.render.bind(Pages.backup);
    Pages.backup.render = function (el) {
      origRender(el);
      const card = $$('.card', el).find(c => /Storage/.test(c.textContent || ''));
      if (card) { const b = $('.card-b', card); const meter = $('.storage-meter', b); if (meter) { meter.nextElementSibling.remove(); meter.remove(); } b.insertAdjacentHTML('afterbegin', `<div class="alert success mb-2">${icon('database')}<div>Cloud database connected · last saved ${Cloud.lastSyncAt ? new Date(Cloud.lastSyncAt).toLocaleTimeString('en-GB', { timeZone: tz() }) : 'this session'}</div></div>`); }
    };
    const origAbout = Pages.settings.about.bind(Pages.settings);
    Pages.settings.about = function (el) { origAbout(el); el.insertAdjacentHTML('afterbegin', `<div class="alert success mb-3">${icon('database')}<div class="alert-body"><b>Hosted (cloud) edition.</b> Data is shared securely between all users through the server API. Version ${APP.version}.</div></div>`); };
  }
};
if (IS_CLOUD) { APP.version = '2.0.0'; Cloud.install(); }

App.bindTopbar();
App.boot();
</script>
</body>
</html>
